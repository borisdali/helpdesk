# Ad hoc K8s showcase manifest (not part of the standard kustomize base/overlays
# fault-injection set) — a self-managed (non-operator) Postgres+pgBackRest pod,
# reusing the exact image already built and live-verified for the Docker-based
# SSH dispatch work (testing/docker/Dockerfile.pgbackrest). Exists to prove
# agents/sysadmin's pgBackRest tools genuinely work against a real K8s pod via
# both dispatch paths — kubectl exec (no port exposure) and SSH (needs a
# reachable port) — not just a Docker container reached two different ways.
#
# Apply: kubectl apply -n <namespace> -f testing/k8s/pgbackrest-demo.yaml
#   No namespace in the manifest: it goes where -n points (helpdesk-test in the
#   v0.30 demo, docs/samples/SAMPLE022.md; db for the v0.32 in-cluster tests).
#   Keep it out of the helpdesk stack's own namespace.
# Image: docker-postgres-pgbackrest:latest, loaded via `minikube image load`
#   (not pulled from any registry — must be present in the cluster's own
#   image cache first).
apiVersion: v1
kind: Service
metadata:
  name: pgbackrest-demo
  labels:
    app: pgbackrest-demo
spec:
  selector:
    app: pgbackrest-demo
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
    - name: ssh
      port: 22
      targetPort: 22
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pgbackrest-demo
  labels:
    app: pgbackrest-demo
spec:
  serviceName: pgbackrest-demo
  replicas: 1
  selector:
    matchLabels:
      app: pgbackrest-demo
  template:
    metadata:
      labels:
        app: pgbackrest-demo
    spec:
      initContainers:
        # A Docker named volume inherits the image directory's ownership; a
        # K8s volume is root-owned, and init-pgbackrest.sh's stanza-create
        # runs as postgres (uid/gid 999 in the postgres image). PGDATA needs
        # nothing: the postgres entrypoint fixes its ownership itself.
        - name: repo-owner
          image: docker-postgres-pgbackrest:latest
          imagePullPolicy: Never
          command: ["sh", "-c", "chown 999:999 /var/lib/pgbackrest && chmod 750 /var/lib/pgbackrest"]
          volumeMounts:
            - name: pgbackrest-repo
              mountPath: /var/lib/pgbackrest
      containers:
        - name: postgres
          image: docker-postgres-pgbackrest:latest
          imagePullPolicy: Never # loaded directly into the cluster's image cache, not pulled
          ports:
            - containerPort: 5432
              name: postgres
            - containerPort: 22
              name: ssh
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: testpass
            - name: POSTGRES_DB
              value: testdb
          # The stock postgres entrypoint, not the image's start-with-sshd.sh:
          # that one keeps the container up after postgres dies (for the Docker
          # fixture's exec-based restore), which on Kubernetes would hide what a
          # real crash does: CrashLoopBackOff, no kubectl exec. The restore
          # lifecycle (agents/sysadmin/lifecycle.go) is built for the real thing:
          # it scales the StatefulSet to 0 and runs pgBackRest in a one-off pod
          # with these volumes.
          command: ["docker-entrypoint.sh"]
          args:
            - postgres
            - -c
            - archive_mode=on
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: pgbackrest-repo
              mountPath: /var/lib/pgbackrest
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: pgbackrest-repo
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
