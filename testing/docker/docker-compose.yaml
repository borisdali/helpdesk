services:
  postgres:
    image: postgres:16
    container_name: helpdesk-test-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: testdb
    ports:
      - "15432:5432"
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      # Reserve 5 slots for superuser (postgres) connections so the agent
      # always has headroom to investigate a saturated connection pool.
      # The max-connections injection auto-targets max_connections - this value.
      - superuser_reserved_connections=5
      - -c
      - shared_buffers=32MB
      - -c
      - log_statement=all
      - -c
      - logging_collector=on
      - -c
      - log_directory=log
      - -c
      - log_filename=postgresql.log
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Sidecar for persistent-connection tests (e.g., max_connections saturation).
  # Sleeps forever; the harness `docker exec`s psql commands into it.
  pgloader:
    image: postgres:16
    container_name: helpdesk-test-pgloader
    environment:
      PGPASSWORD: testpass
    entrypoint: ["sleep", "infinity"]
    depends_on:
      postgres:
        condition: service_healthy

  # Dedicated instance for validating auditd's own Postgres storage backend
  # (internal/audit's isPostgres/rebind() support). Deliberately a separate
  # server from `postgres` above, never reused: `postgres` exists to be
  # broken by faulttest, and auditd must stay up through a target-database
  # outage to detect and guide recovery from it (see docs/HA_DR.md's backup
  # detection work) — sharing a server would defeat that. Also deliberately
  # a newer major version than the fault-injection target's postgres:16, to
  # get real cross-version coverage on auditd's own backend rather than only
  # ever testing against whatever version the target happens to pin.
  postgres-auditd:
    image: postgres:18
    container_name: helpdesk-test-pg-auditd
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: auditdtestpass
      POSTGRES_DB: auditd_test
    ports:
      # 15432 is the fault-injection target (postgres, above); 15433 is
      # taken by docker-compose.repl.yaml's replica service. 15434 avoids
      # both.
      - "15434:5432"
    volumes:
      # postgres:18+ images expect a single mount at /var/lib/postgresql
      # (major-version-specific subdirectories underneath), not the old
      # /var/lib/postgresql/data convention still used by postgres:16 above.
      - pgdata-auditd:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  pgdata-auditd:
