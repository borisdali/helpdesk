version: "1"

failures:
  # ── Database failures (13) ─────────────────────────────────────────────

  - id: db-max-connections
    name: "Max connections exhausted"
    category: database
    severity: high
    description: >
      All available PostgreSQL connections are consumed by idle sessions,
      preventing new clients from connecting.
    inject:
      type: docker_exec
      exec_via: helpdesk-test-pgloader
      script: sql/inject_max_connections.sh
      detach: true
    teardown:
      type: docker_exec
      exec_via: helpdesk-test-pgloader
      script: sql/teardown_max_connections.sh
    external_compat: true
    external_inject:
      type: shell_exec
      # Hold idle connections by piping sleep into psql — psql blocks waiting
      # for input, producing state='idle' backends that terminate_idle_connections
      # can terminate.  Redirecting the group to /dev/null (} >/dev/null 2>&1 &)
      # prevents FD inheritance: without it, background psql processes hold the
      # parent bash's stdout pipe open and cmd.CombinedOutput() blocks forever.
      # We spawn enough to fill non-superuser slots but leave superuser_reserved
      # connections free so the verify_sql and agent can still connect.
      # $FAULTTEST_CONN is injected by faulttest from the resolved --conn flag.
      script_inline: |
        if ! command -v psql >/dev/null 2>&1; then
          echo "ERROR: psql not found in PATH (required for shell_exec injection)" >&2
          echo "  macOS: brew install libpq && brew link --force libpq" >&2
          exit 1
        fi
        PSQL_ERR=$(psql "$FAULTTEST_CONN" -t -A -c "SHOW max_connections;" 2>&1 >/dev/null)
        MAX_CONN=$(psql "$FAULTTEST_CONN" -t -A -c "SHOW max_connections;" 2>/dev/null | tr -d ' \n')
        if ! printf '%s' "$MAX_CONN" | grep -qE '^[0-9]+$'; then
          echo "ERROR: could not read max_connections (conn: $FAULTTEST_CONN)" >&2
          echo "  psql error: $PSQL_ERR" >&2
          exit 1
        fi
        SU_RESERVED=$(psql "$FAULTTEST_CONN" -t -A -c "SHOW superuser_reserved_connections;" 2>/dev/null | tr -d ' \n')
        SU_RESERVED=${SU_RESERVED:-3}
        # Count existing client backends so we don't over-spawn and block superuser slots.
        EXISTING=$(psql "$FAULTTEST_CONN" -t -A -c \
          "SELECT count(*) FROM pg_stat_activity WHERE backend_type='client backend';" \
          2>/dev/null | tr -d ' \n')
        EXISTING=${EXISTING:-0}
        # Target: fill up to max_connections - superuser_reserved (regular user limit).
        TARGET=$(( MAX_CONN - SU_RESERVED ))
        SLOTS=$(( TARGET - EXISTING ))
        if [ "$SLOTS" -le 0 ]; then
          echo "Slots already at or above target ($EXISTING existing, target $TARGET/$MAX_CONN); skipping"
          exit 0
        fi
        rm -f /tmp/faulttest_maxconn_pids.txt
        for i in $(seq 1 "$SLOTS"); do
          { sleep 600 | psql "$FAULTTEST_CONN" -q; } >/dev/null 2>&1 &
          echo $! >> /tmp/faulttest_maxconn_pids.txt
        done
        sleep 3
        echo "Injected: $SLOTS idle connections ($EXISTING existing → $TARGET/$MAX_CONN)"
    external_teardown:
      type: shell_exec
      script_inline: |
        if [ -f /tmp/faulttest_maxconn_pids.txt ]; then
          # Kill the entire process group (negative PID) so both sleep and psql
          # are terminated; killing only the subshell PID orphans the psql child.
          while read -r pid; do
            kill -- -"$pid" 2>/dev/null || kill "$pid" 2>/dev/null || true
          done < /tmp/faulttest_maxconn_pids.txt
          rm -f /tmp/faulttest_maxconn_pids.txt
          sleep 2
        fi
        # Safety net: terminate any surviving idle backends via postgres.
        psql "$FAULTTEST_CONN" -c "
          SELECT pg_terminate_backend(pid) FROM pg_stat_activity
            WHERE state = 'idle' AND pid <> pg_backend_pid();
        " >/dev/null 2>&1 || true
        echo "Teardown: idle connections terminated"
    diagnosis_playbook_series_id: pbs_connection_triage
    prompt: >
      Users are getting "too many clients" errors connecting to the database.
      The connection_string is "{{connection_string}}" — use it verbatim for
      all tool calls. Please investigate.
    evaluation:
      expected_tools:
        - check_connection
        - get_connection_stats
      expected_keywords:
        any_of:
          - "max_connections"
          - "too many"
          - "connection limit"
          - "connection pool"
          - "exhausted"
      expected_diagnosis:
        category: "connection_exhaustion"
        narrative: "The agent should identify that the PostgreSQL max_connections limit has been reached due to idle or sleeping sessions consuming all available connection slots, and recommend either terminating idle connections or increasing max_connections."
    remediation:
      playbook_id: pbs_connection_remediate
      verify_sql: "SELECT count(*) < current_setting('max_connections')::int - 5 FROM pg_stat_activity WHERE state = 'idle'"
      verify_timeout: "60s"
    timeout: 60s

  - id: db-long-running-query
    name: "Long-running query blocking"
    category: database
    severity: high
    description: >
      A query holding an ACCESS EXCLUSIVE lock blocks all other access to
      the table, causing application timeouts.
    inject:
      type: docker_exec
      exec_via: helpdesk-test-pgloader
      script: sql/inject_long_running_query.sh
      detach: true
    teardown:
      type: docker_exec
      exec_via: helpdesk-test-pgloader
      script: sql/teardown_long_running_query.sh
    external_compat: true
    external_inject:
      type: shell_exec
      script_inline: |
        set -e
        psql "$FAULTTEST_CONN" -v ON_ERROR_STOP=1 -c "
          CREATE TABLE IF NOT EXISTS _faulttest_longquery (id int PRIMARY KEY);
          INSERT INTO _faulttest_longquery VALUES (1) ON CONFLICT DO NOTHING;
        "
        { { printf "BEGIN;\nLOCK TABLE _faulttest_longquery IN ACCESS EXCLUSIVE MODE;\n"; sleep 600; } \
          | psql "$FAULTTEST_CONN"; } >/dev/null 2>&1 &
        echo $! > /tmp/faulttest_longquery_pid.txt
        sleep 1
        echo "Injected: ACCESS EXCLUSIVE lock on _faulttest_longquery (held until killed)"
    external_teardown:
      type: shell_exec
      script_inline: |
        if [ -f /tmp/faulttest_longquery_pid.txt ]; then
          kill "$(cat /tmp/faulttest_longquery_pid.txt)" 2>/dev/null || true
          rm -f /tmp/faulttest_longquery_pid.txt
        fi
        psql "$FAULTTEST_CONN" -c "
          SELECT pg_terminate_backend(pid)
          FROM (
            SELECT pid FROM pg_stat_activity
            WHERE query LIKE '%_faulttest_longquery%'
              AND state IN ('active', 'idle in transaction')
            UNION
            SELECT l.pid FROM pg_locks l
            JOIN pg_class c ON c.oid = l.relation
            WHERE c.relname = '_faulttest_longquery'
          ) t
          WHERE pid <> pg_backend_pid();
        "
        psql "$FAULTTEST_CONN" -c "DROP TABLE IF EXISTS _faulttest_longquery;"
    diagnosis_playbook_series_id: pbs_slow_query_triage
    prompt: >
      Queries seem to hang indefinitely and certain tables are inaccessible.
      The connection_string is "{{connection_string}}" — use it verbatim for
      all tool calls. Please investigate.
    evaluation:
      expected_tools:
        - get_active_connections
        - get_lock_info
      expected_keywords:
        any_of:
          - "long-running"
          - "pg_sleep"
          - "ACCESS EXCLUSIVE"
          - "lock"
          - "blocking"
          - "blocked"
      expected_diagnosis:
        category: "lock_blocking"
        narrative: "The agent should identify a long-running query holding an ACCESS EXCLUSIVE lock that is blocking other sessions from accessing the table, and recommend canceling or terminating the blocking query."
    remediation:
      playbook_id: pbs_slow_query_remediate
      verify_sql: >
        SELECT count(*) = 0 FROM pg_locks l
        JOIN pg_stat_activity a ON a.pid = l.pid
        WHERE l.mode = 'AccessExclusiveLock' AND l.granted
          AND a.state = 'idle in transaction'
      verify_timeout: "60s"
    timeout: 90s

  - id: db-lock-contention
    name: "Lock contention / deadlock"
    category: database
    severity: high
    description: >
      Two transactions are each waiting for a lock held by the other,
      causing a deadlock that PostgreSQL detects and resolves by killing
      one session.
    inject:
      type: docker_exec
      exec_via: helpdesk-test-pgloader
      script: sql/inject_lock_contention.sh
      detach: true
    teardown:
      type: docker_exec
      exec_via: helpdesk-test-pgloader
      script: sql/teardown_lock_contention.sh
    external_compat: true
    external_inject:
      type: shell_exec
      # Produce real lock contention: a blocker session holds an ACCESS EXCLUSIVE
      # lock on _faulttest_lock, and a waiter session SELECTs against the table
      # and blocks on ACCESS SHARE. The remediation playbook must identify the
      # blocker via get_blocking_queries and terminate it to unblock the waiter.
      # $FAULTTEST_CONN is injected by faulttest from the --conn flag.
      script_inline: |
        set -e
        psql "$FAULTTEST_CONN" -v ON_ERROR_STOP=1 -c "
          CREATE TABLE IF NOT EXISTS _faulttest_lock (id int PRIMARY KEY);
          INSERT INTO _faulttest_lock VALUES (1) ON CONFLICT DO NOTHING;
        "
        # Blocker: holds ACCESS EXCLUSIVE lock in an open transaction.
        { { printf "BEGIN;\nLOCK TABLE _faulttest_lock IN ACCESS EXCLUSIVE MODE;\n"; sleep 600; } \
          | psql "$FAULTTEST_CONN"; } >/dev/null 2>&1 &
        echo $! > /tmp/faulttest_lock_pid.txt
        sleep 1
        # Waiter: queues for ACCESS SHARE on _faulttest_lock, blocked by the blocker.
        { psql "$FAULTTEST_CONN" -c "SELECT * FROM _faulttest_lock;" ; } >/dev/null 2>&1 &
        echo $! > /tmp/faulttest_lock_waiter_pid.txt
        sleep 2
        echo "Injected: blocker pid=$(cat /tmp/faulttest_lock_pid.txt) holds ACCESS EXCLUSIVE; waiter pid=$(cat /tmp/faulttest_lock_waiter_pid.txt) blocked on ACCESS SHARE"
    external_teardown:
      type: shell_exec
      script_inline: |
        # Kill the local background processes (best-effort; psql may outlive the subshell).
        for f in /tmp/faulttest_lock_pid.txt /tmp/faulttest_lock_waiter_pid.txt; do
          if [ -f "$f" ]; then
            kill "$(cat "$f")" 2>/dev/null || true
            rm -f "$f"
          fi
        done
        # Terminate the session holding the ACCESS EXCLUSIVE lock on _faulttest_lock
        # so DROP TABLE doesn't block if the local kill didn't propagate to psql.
        # LOCK TABLE doesn't set backend_xid, so we target via pg_locks instead.
        psql "$FAULTTEST_CONN" -c "
          SELECT pg_terminate_backend(l.pid)
          FROM pg_locks l
          JOIN pg_class c ON l.relation = c.oid
          WHERE c.relname = '_faulttest_lock' AND l.granted AND l.pid <> pg_backend_pid();
          DROP TABLE IF EXISTS _faulttest_lock;
        "
    diagnosis_playbook_series_id: pbs_lock_contention_triage
    remediation:
      playbook_id: pbs_slow_query_remediate
      verify_sql: |
        SELECT NOT EXISTS (
          SELECT 1 FROM pg_locks l
          JOIN pg_class c ON l.relation = c.oid
          WHERE c.relname = '_faulttest_lock' AND l.granted AND l.pid <> pg_backend_pid()
        )
      verify_timeout: "60s"
    prompt: >
      The database is experiencing intermittent "deadlock detected" errors.
      The connection_string is "{{connection_string}}" — use it verbatim for
      all tool calls. Please investigate.
    evaluation:
      expected_tools:
        - get_lock_info
        - get_active_connections
        - get_wait_events
        - get_blocking_queries
      expected_keywords:
        any_of:
          - "deadlock"
          - "lock contention"
          - "waiting"
          - "blocked"
          - "lock"
      expected_diagnosis:
        category: "deadlock"
        narrative: "The agent should identify lock contention or a deadlock situation where transactions are waiting on locks held by other sessions, and recommend resolving the blocking sessions or reviewing transaction patterns."
    timeout: 240s

  - id: db-table-bloat
    name: "Table bloat / dead tuples"
    category: database
    severity: medium
    description: >
      A table has accumulated a large number of dead tuples because
      autovacuum is disabled, wasting disk space and degrading performance.
    external_compat: true
    inject:
      type: sql
      script: sql/inject_table_bloat.sql
    teardown:
      type: sql
      script: sql/teardown_table_bloat.sql
    external_inject:
      type: sql
      script_inline: |
        CREATE TABLE IF NOT EXISTS test_bloat_table (id SERIAL PRIMARY KEY, data TEXT);
        ALTER TABLE test_bloat_table SET (autovacuum_enabled = false);
        INSERT INTO test_bloat_table (data) SELECT repeat('x', 200) FROM generate_series(1, 100000);
        DELETE FROM test_bloat_table WHERE id % 10 != 0;
        CHECKPOINT;
    external_teardown:
      type: sql
      script_inline: "DROP TABLE IF EXISTS test_bloat_table;"
    diagnosis_playbook_series_id: pbs_vacuum_triage
    prompt: >
      The database seems to be using more disk than expected and some queries
      are getting slower. The connection_string is "{{connection_string}}" —
      use it verbatim for all tool calls. Please investigate table health.
    evaluation:
      expected_tools:
        - get_table_stats
      expected_keywords:
        any_of:
          - "dead tuples"
          - "bloat"
          - "autovacuum"
          - "vacuum"
          - "n_dead_tup"
      expected_diagnosis:
        category: "table_bloat"
        narrative: "The agent should identify that a table has accumulated excessive dead tuples because autovacuum is disabled or not keeping up, causing disk bloat and query slowdowns, and recommend running VACUUM or re-enabling autovacuum."
    remediation:
      playbook_id: pbs_vacuum_remediate
      verify_sql: "SELECT COALESCE((SELECT n_dead_tup < 10000 FROM pg_stat_user_tables WHERE relname = 'test_bloat_table'), true)"
      verify_timeout: "120s"
    timeout: 60s

  - id: db-high-cache-miss
    name: "High cache miss ratio"
    category: database
    severity: medium
    description: >
      The database cache hit ratio is low because sequential scans on a
      large table drove blks_read high relative to blks_hit, pushing the
      cache hit ratio below 95%.
    external_compat: true
    inject:
      type: sql
      script: sql/inject_high_cache_miss.sql
    teardown:
      type: sql
      script: sql/teardown_high_cache_miss.sql
    external_inject:
      type: sql
      script_inline: |
        CREATE TABLE IF NOT EXISTS test_large_table (id SERIAL PRIMARY KEY, data TEXT);
        INSERT INTO test_large_table (data) SELECT repeat('y', 500) FROM generate_series(1, 100000);
        SELECT pg_stat_reset();
        SELECT count(*) FROM test_large_table WHERE data LIKE '%z%';
    external_teardown:
      type: sql
      script_inline: "DROP TABLE IF EXISTS test_large_table; SELECT pg_stat_reset();"
    prompt: >
      Users report slow query performance. The connection_string is
      "{{connection_string}}" — use it verbatim for all tool calls.
      Please check database health and performance metrics.
    evaluation:
      expected_tools:
        - get_database_stats
        - get_slow_queries
      expected_keywords:
        any_of:
          - "cache hit"
          - "cache miss"
          - "hit ratio"
          - "shared_buffers"
          - "blks_read"
      expected_diagnosis:
        category: "cache_performance"
        narrative: "The agent should identify a low buffer cache hit ratio (blks_read elevated relative to blks_hit) caused by sequential scans on the large table, and recommend optimizing query access patterns (e.g. adding indexes on scanned columns) or resetting cache statistics to establish a fresh baseline. The agent should not assume shared_buffers is undersized without evidence that the working set exceeds the configured buffer pool."
    diagnosis_playbook_series_id: pbs_cache_miss_triage
    remediation:
      playbook_id: pbs_cache_miss_remediate
      verify_sql: >
        SELECT CASE
          WHEN sum(blks_hit) + sum(blks_read) = 0 THEN true
          ELSE (sum(blks_hit)::float / (sum(blks_hit) + sum(blks_read))) >= 0.95
        END
        FROM pg_stat_database WHERE datname = current_database()
      verify_timeout: "60s"
    timeout: 60s

  - id: db-backup-archiving-broken
    name: "WAL archiving failing"
    category: database
    severity: high
    description: >
      archive_command is broken — every archiving attempt fails. This is
      the precondition failure for both PITR and most base-backup
      strategies: recovery from a real data-loss event depends on a
      complete, unbroken WAL archive, and a silently failing archiver
      means that assumption is false the whole time no one is looking.
    external_compat: true
    inject:
      type: sql
      script: sql/inject_backup_archiving_broken.sql
    teardown:
      type: sql
      script: sql/teardown_backup_archiving_broken.sql
    external_inject:
      type: sql
      script_inline: |
        SELECT pg_stat_reset_shared('archiver');
        ALTER SYSTEM SET archive_command = '/bin/false';
        SELECT pg_reload_conf();
        SELECT pg_switch_wal();
        SELECT pg_sleep(1);
        SELECT pg_switch_wal();
        SELECT pg_sleep(1);
    external_teardown:
      type: sql
      script_inline: |
        ALTER SYSTEM SET archive_command = '/bin/true';
        SELECT pg_reload_conf();
        SELECT pg_switch_wal();
        SELECT pg_sleep(1);
    diagnosis_playbook_series_id: pbs_db_backup_health_triage
    prompt: >
      Monitoring flagged that WAL archiving may not be keeping up on this
      database. The connection_string is "{{connection_string}}" — use it
      verbatim for all tool calls. Please investigate backup/archiving
      health and determine whether there's an actual problem.
    evaluation:
      expected_tools:
        - get_backup_status
      expected_keywords:
        any_of:
          - "archiv"
          - "archive_command"
          - "pg_stat_archiver"
          - "failed"
          - "WAL"
      expected_diagnosis:
        category: "backup_archiving"
        narrative: "The agent should identify from pg_stat_archiver that the most recent WAL archiving attempt failed and has not since been followed by a success, correctly distinguishing this from archiving simply being unconfigured (archive_mode=off), and recommend investigating/fixing archive_command rather than assuming a transient blip."
    remediation:
      playbook_id: pbs_db_backup_archiving_remediate
      verify_sql: >
        SELECT NOT (last_failed_time IS NOT NULL AND (last_archived_time IS NULL OR last_failed_time > last_archived_time))
        FROM pg_stat_archiver
      verify_timeout: "60s"
    timeout: 60s

  - id: db-pgbackrest-repo-unreadable
    name: "pgBackRest repo unreadable"
    category: database
    severity: high
    description: >
      pgBackRest's own repository directory becomes unreadable (permission
      denial after a host-level change, a bad mount, an ownership drift) —
      the backup-taking precondition itself, distinct from WAL-archiving
      health (db-backup-archiving-broken). pgBackRest cannot even determine
      its own stanza's status once this happens.
    # A full-catalog sweep (make faulttest) applies one shared connection
    # string to every database-category fault — but this one needs its own
    # dedicated pgBackRest-equipped container, not whatever Postgres
    # instance the other 23 database faults in the same run share. Resolved
    # against the harness's own infrastructure.json (testing/testing.infra.json
    # by default, or FAULTTEST_INFRA_CONFIG) — "pgbackrest-db" is already
    # registered there. Found live, 2026-10-01: without this, the fault ran
    # against a plain postgres container with no pgBackRest installed at
    # all, failing outright rather than skipping cleanly.
    agent_conn_override: pgbackrest-db
    # Only the sysadmin agent has get_pgbackrest_status, and
    # pbs_pgbackrest_health_triage runs on it. A direct (non-gateway) run
    # would otherwise follow the category to the database agent, which can
    # only guess from SQL; found 2026-10-16, see Failure.DirectAgent.
    direct_agent: sysadmin
    prerequisites: |
      Requires the dedicated pgBackRest target
      (testing/docker/docker-compose.pgbackrest.yaml), not the plain
      `postgres` target — pgBackRest refuses to back up unless
      archive_command actually invokes it, which conflicts directly with
      db-backup-archiving-broken's own archive_command manipulation on
      `postgres` (confirmed live: "archive_command '/bin/true' must contain
      pgbackrest"). Also requires an initial backup already taken via
      testing/docker/setup-pgbackrest-backup.sh — a stanza with zero backups
      ever taken is its own, different finding ("never backed up"), not this
      fault's.

      Docker-only: this fault needs a container it can chmod into, unlike
      db-backup-archiving-broken's pure-SQL mechanism. No external_compat
      variant is offered for the same reason db-replica-container-stopped
      doesn't have one — there's no SQL-only way to reproduce a real
      filesystem-permission failure on an arbitrary external target.
    inject:
      type: docker_exec
      exec_via: helpdesk-test-pg-pgbackrest
      script_inline: chmod 000 /var/lib/pgbackrest
    teardown:
      type: docker_exec
      exec_via: helpdesk-test-pg-pgbackrest
      script_inline: chmod 700 /var/lib/pgbackrest
    diagnosis_playbook_series_id: pbs_pgbackrest_health_triage
    prompt: >
      Monitoring flagged that pgBackRest may not be able to report backup
      status for this database. The connection_string is
      "{{connection_string}}" — use it verbatim for all tool calls. Please
      investigate backup health and determine whether there's an actual
      problem.
    evaluation:
      expected_tools:
        - get_pgbackrest_status
      expected_keywords:
        any_of:
          - "permission"
          - "pgbackrest"
          - "repo"
          - "unreadable"
          - "unable to"
      expected_diagnosis:
        category: "pgbackrest_repo_unreadable"
        objective_evidence_signal: pgbackrest_backup_unhealthy
        narrative: "The agent should identify from get_pgbackrest_status that pgBackRest cannot access its own repository (a non-ok stanza status, likely reporting the stanza as \"[invalid]\" with a permission-denied detail in the repo-level status message), correctly distinguishing this filesystem-level failure from WAL-archiving health or a simple stale-backup finding, and recommend investigating the repo path's permissions/ownership rather than assuming a transient blip."
    timeout: 60s

  - id: db-pgbackrest-wal-gap
    name: "pgBackRest WAL chain broken"
    category: database
    severity: high
    description: >
      A WAL segment the latest backup needs is missing from the pgBackRest
      archive, while the database itself is healthy and pgBackRest reports
      the stanza ok. Nothing is wrong today, but the backup can no longer be
      restored: PostgreSQL could not reach a consistent state from it, and a
      restore would overwrite PGDATA for nothing. Exercises v0.32's
      wal_continuity check, the pgbackrest_wal_chain_broken signal and
      pbs_pgbackrest_health_triage's broken-chain ending, none of which the
      backup-age check (backup_stale) can see.
    # Same dedicated pgBackRest target, and the same agent, as
    # db-pgbackrest-repo-unreadable.
    agent_conn_override: pgbackrest-db
    direct_agent: sysadmin
    prerequisites: |
      Requires the dedicated pgBackRest target
      (testing/docker/docker-compose.pgbackrest.yaml) with an initial backup
      already taken (testing/docker/setup-pgbackrest-backup.sh).

      inject moves the latest backup's own start segment aside inside the
      repo (a name the WAL check ignores), so the chain is broken at the
      backup itself (consistency_reachable=false). teardown moves it back and
      is safe to run more than once. Neither touches PGDATA or the running
      instance, and nothing is written to the archive.

      Either health-triage ending that escalates to a human is correct here:
      Ending E (broken chain) when the backup is fresh, or Ending C (stale
      backup, with wal_continuity=broken in its findings) when it isn't, as
      on a fixture whose only backup was taken days ago. Both record the
      pgbackrest_wal_chain_broken signal, which is listed first in
      agents/sysadmin/objective_evidence.yaml.

      Docker-only, same reasoning as db-pgbackrest-repo-unreadable. No
      external_compat variant.
    inject:
      type: docker_exec
      exec_via: helpdesk-test-pg-pgbackrest
      script_inline: |
        set -e
        seg=$(su postgres -c 'pgbackrest --stanza=main info --output=json' | grep -o '"start":"[0-9A-F]\{24\}"' | tail -1 | cut -d'"' -f4)
        test -n "$seg"
        f=$(ls /var/lib/pgbackrest/archive/main/*/"$(echo "$seg" | cut -c1-16)"/"$seg"-*)
        mv "$f" "$f.hidden-by-fault"
    teardown:
      type: docker_exec
      exec_via: helpdesk-test-pg-pgbackrest
      script_inline: |
        for f in $(find /var/lib/pgbackrest/archive -name '*.hidden-by-fault'); do
          mv "$f" "${f%.hidden-by-fault}"
        done
    diagnosis_playbook_series_id: pbs_pgbackrest_health_triage
    prompt: >
      A routine backup audit wants confirmation that this database's latest
      pgBackRest backup can actually be restored. The connection_string is
      "{{connection_string}}" — use it verbatim for all tool calls. Please
      check backup health and say whether a restore from the latest backup
      would work.
    evaluation:
      expected_tools:
        - get_pgbackrest_status
      expected_keywords:
        any_of:
          - "wal_continuity"
          - "WAL chain"
          - "missing"
          - "consistent state"
          - "broken"
      expected_diagnosis:
        category: "pgbackrest_wal_chain_broken"
        objective_evidence_signal: pgbackrest_wal_chain_broken
        narrative: "The agent should read wal_continuity from get_pgbackrest_status and report that the chain is broken: the segment the latest backup itself needs (wal_continuity.gaps, consistency_reachable=false) is missing from the repo, so PostgreSQL could not start from that backup and a restore must not be attempted. It should not take the healthy stanza status (status_code=0) as proof the backup is usable, and should hand the decision to a human (take a new full backup, or recover the segment) rather than call run_pgbackrest_backup or restore_from_backup itself."
    timeout: 90s

  - id: db-pgbackrest-wal-gap-k8s
    name: "pgBackRest WAL chain broken (Kubernetes pod)"
    category: database
    severity: high
    description: >
      db-pgbackrest-wal-gap against the self-managed pgBackRest pod
      (testing/k8s/pgbackrest-demo.yaml) with the whole helpdesk stack
      in-cluster: the latest backup's start segment is moved aside in the
      pod's repo, so the WAL check (get_pgbackrest_status over kubectl exec)
      must report the chain broken and pbs_pgbackrest_health_triage must stop
      at a human on the pgbackrest_wal_chain_broken signal. Added v0.32 to
      check item 1's broken-chain detection on Kubernetes, not only its
      healthy path.
    # The gateway resolves the alias from its own infrastructure config
    # (testing/k8s/helm-values-pgbackrest.yaml); the harness needs none.
    agent_conn_override: pgbackrest-k8s
    direct_agent: sysadmin
    prerequisites: |
      The helpdesk stack deployed in-cluster with
      testing/k8s/helm-values-pgbackrest.yaml, the pgBackRest pod applied in
      namespace db (kubectl apply -n db -f testing/k8s/pgbackrest-demo.yaml)
      with a first full backup taken, and the harness's kubectl able to reach
      the cluster (--context, or FAULTTEST_KUBE_CONTEXT). Run via the gateway
      (--via-gateway, through a port-forward) with --conn pgbackrest-k8s.

      Same inject/teardown as db-pgbackrest-wal-gap, run in the pod with
      kubectl exec instead of docker exec. Neither touches PGDATA or the
      running instance. Namespace db and selector app=pgbackrest-demo are
      fixed here, as in the other K8s faults' scripts.
    inject:
      type: shell_exec
      script_inline: |
        set -e
        CTX_ARG=""
        [ -n "$FAULTTEST_K8S_CONTEXT" ] && CTX_ARG="--context=$FAULTTEST_K8S_CONTEXT"
        NS=db
        POD=$(kubectl $CTX_ARG get pod -n "$NS" -l app=pgbackrest-demo -o jsonpath='{.items[0].metadata.name}')
        [ -n "$POD" ] || { echo "no pgbackrest-demo pod in $NS" >&2; exit 1; }
        kubectl $CTX_ARG exec -n "$NS" "$POD" -- sh -c '
          set -e
          seg=$(su postgres -c "pgbackrest --stanza=main info --output=json" 2>/dev/null | grep -o "\"start\":\"[0-9A-F]\{24\}\"" | tail -1 | cut -d\" -f4)
          test -n "$seg"
          f=$(ls /var/lib/pgbackrest/archive/main/*/"$(echo "$seg" | cut -c1-16)"/"$seg"-*)
          mv "$f" "$f.hidden-by-fault"
          echo "hid $f"
        '
    teardown:
      type: shell_exec
      script_inline: |
        set -e
        CTX_ARG=""
        [ -n "$FAULTTEST_K8S_CONTEXT" ] && CTX_ARG="--context=$FAULTTEST_K8S_CONTEXT"
        NS=db
        POD=$(kubectl $CTX_ARG get pod -n "$NS" -l app=pgbackrest-demo -o jsonpath='{.items[0].metadata.name}')
        [ -n "$POD" ] || { echo "no pgbackrest-demo pod in $NS" >&2; exit 1; }
        kubectl $CTX_ARG exec -n "$NS" "$POD" -- sh -c '
          for f in $(find /var/lib/pgbackrest/archive -name "*.hidden-by-fault"); do
            mv "$f" "${f%.hidden-by-fault}"
          done
        '
    diagnosis_playbook_series_id: pbs_pgbackrest_health_triage
    prompt: >
      A routine backup audit wants confirmation that this database's latest
      pgBackRest backup can actually be restored. The connection_string is
      "{{connection_string}}" — use it verbatim for all tool calls. Please
      check backup health and say whether a restore from the latest backup
      would work.
    evaluation:
      expected_tools:
        - get_pgbackrest_status
      expected_keywords:
        any_of:
          - "wal_continuity"
          - "WAL chain"
          - "missing"
          - "consistent state"
          - "broken"
      expected_diagnosis:
        category: "pgbackrest_wal_chain_broken"
        objective_evidence_signal: pgbackrest_wal_chain_broken
        narrative: "Same as db-pgbackrest-wal-gap: the agent should read wal_continuity from get_pgbackrest_status and report the chain broken (the segment the latest backup itself needs is missing, consistency_reachable=false), so a restore must not be attempted, and hand the decision to a human rather than call run_pgbackrest_backup or restore_from_backup."
    timeout: 90s

  - id: db-pgbackrest-wal-gap-vm
    name: "pgBackRest WAL chain broken (real host/VM)"
    category: database
    severity: high
    description: >
      db-pgbackrest-wal-gap against a real Linux VM reached over SSH: the latest
      backup's own start segment is moved aside inside the VM's pgBackRest
      repo, while PostgreSQL is healthy and pgBackRest reports the stanza ok.
      The health triage (the sysadmin agent's get_pgbackrest_status, dispatched
      over SSH) must report the chain broken and stop at a human on the
      pgbackrest_wal_chain_broken signal; a restore from this backup is
      refused by design, so a chain run this way ends at the health triage and
      never reaches the restore hop. Added v0.33 to qualify the broken-chain
      detection on the VM path and, run from a Job, from inside a cluster.
    # The diagnosis playbook runs on the sysadmin agent, so a direct (non-gateway)
    # run must ask it too; asked the database agent it would never see the tool.
    direct_agent: sysadmin
    prerequisites: |
      Requires a real Linux VM with PostgreSQL and pgBackRest installed and an
      initial backup already taken (testing/docker/setup-pgbackrest-vm.sh), and
      a testing.infra.json db_server entry for it (the setup script prints it).
      Run through the gateway, diagnosis only (no --remediate), with the VM as
      both the connection and the SSH target:
        go run ./testing/cmd/faulttest run --ids db-pgbackrest-wal-gap-vm \
          --via-gateway --gateway $GW --api-key <key> \
          --conn "<vm db_server's connection_string>" --agent-conn <vm db_server's key> \
          --ssh-host postgres@<vm-host> --ssh-port 22 --ssh-key <path>
      To run it from inside a cluster as a Job, see deploy/helm/README.md §10.6.

      inject moves the latest backup's start segment aside (a name the WAL
      check ignores), as the Docker fault does; teardown moves it back and is
      safe to run more than once. Neither touches PGDATA or the running
      instance, and nothing is written to the archive. They run as the SSH
      user, which must own the repo (the recommended ssh_user: postgres does);
      the repo path is read from /etc/pgbackrest.conf (repo1-path, default
      /var/lib/pgbackrest).

      Either health-triage ending that escalates to a human is correct here:
      Ending E (broken chain) when the backup is fresh, or Ending C (stale
      backup, with wal_continuity=broken in its findings) when it isn't.
      No external_compat variant: ssh_exec always requires real OS access.
    inject:
      type: ssh_exec
      exec_via: "" # filled by --ssh-host at runtime
      script_inline: |
        set -e
        STANZA="main" # EDIT to match your VM's pgBackRest stanza
        # PGBACKREST_REPO_PATH is a test seam; on a real VM it is unset.
        REPO="${PGBACKREST_REPO_PATH:-$(grep '^repo1-path=' /etc/pgbackrest.conf 2>/dev/null | cut -d= -f2)}"
        REPO="${REPO:-/var/lib/pgbackrest}"
        seg=$(pgbackrest --stanza="$STANZA" info --output=json | grep -o '"start":"[0-9A-F]\{24\}"' | tail -1 | cut -d'"' -f4)
        test -n "$seg" || { echo "no backup found for stanza $STANZA: take one first" >&2; exit 1; }
        f=$(ls "$REPO"/archive/"$STANZA"/*/"$(echo "$seg" | cut -c1-16)"/"$seg"-*)
        mv "$f" "$f.hidden-by-fault"
        echo "hid $f"
    teardown:
      type: ssh_exec
      exec_via: ""
      script_inline: |
        REPO="${PGBACKREST_REPO_PATH:-$(grep '^repo1-path=' /etc/pgbackrest.conf 2>/dev/null | cut -d= -f2)}"
        REPO="${REPO:-/var/lib/pgbackrest}"
        for f in $(find "$REPO"/archive -name '*.hidden-by-fault'); do
          mv "$f" "${f%.hidden-by-fault}"
          echo "restored ${f%.hidden-by-fault}"
        done
    diagnosis_playbook_series_id: pbs_pgbackrest_health_triage
    prompt: >
      A routine backup audit wants confirmation that this database's latest
      pgBackRest backup can actually be restored. The connection_string is
      "{{connection_string}}" — use it verbatim for all tool calls. Please
      check backup health and say whether a restore from the latest backup
      would work.
    evaluation:
      expected_tools:
        - get_pgbackrest_status
      expected_keywords:
        any_of:
          - "wal_continuity"
          - "WAL chain"
          - "missing"
          - "consistent state"
          - "broken"
      expected_diagnosis:
        category: "pgbackrest_wal_chain_broken"
        objective_evidence_signal: pgbackrest_wal_chain_broken
        narrative: "The agent should read wal_continuity from get_pgbackrest_status (dispatched over SSH to the VM) and report that the chain is broken: the segment the latest backup itself needs (wal_continuity.gaps, consistency_reachable=false) is missing from the repo, so PostgreSQL could not start from that backup and a restore must not be attempted. It should not take the healthy stanza status (status_code=0) as proof the backup is usable, and should hand the decision to a human rather than call run_pgbackrest_backup or restore_from_backup itself."
    timeout: 120s

  - id: db-pgdata-corrupted
    name: "Data directory corrupted — restore from latest backup"
    category: database
    severity: critical
    description: >
      The instance's own data directory is damaged beyond a simple restart
      (pg_control missing) — the actual data-loss scenario pbs_db_data_loss_triage
      exists for, not just a backup-health precondition like
      db-pgbackrest-repo-unreadable. Closes v0.31's restore/recovery gap:
      v0.30 only ever answered "is backup healthy?"; this fault proves the
      narrowest real restore slice — restore to the latest pgBackRest
      backup, single instance, no PITR-to-timestamp — actually works
      end to end against real data loss.
    # Same dedicated pgBackRest target as db-pgbackrest-repo-unreadable, for
    # the same reason (a full-catalog sweep shares one connection string
    # across every database-category fault; this needs its own container
    # with a real backup already taken).
    agent_conn_override: pgbackrest-db
    # pbs_db_data_loss_triage starts on the database agent, but the evidence
    # (pg_control missing) is only in the host logs it escalates to the
    # sysadmin agent for. A direct run has no escalation, so it asks sysadmin
    # outright, as host-pg-crash does. Asked the database agent, it scored
    # 70% and 20% on two runs, 2026-10-16, depending on wording alone.
    direct_agent: sysadmin
    prerequisites: |
      Requires the dedicated pgBackRest target
      (testing/docker/docker-compose.pgbackrest.yaml) with an initial
      backup already taken (testing/docker/setup-pgbackrest-backup.sh), and
      testing/docker/start-with-sshd.sh's container-survives-a-postgres-
      crash fix (v0.31) — without it, deleting pg_control crashes the
      whole container (postgres is PID 1), taking sshd down with it and
      making the target unreachable by either of agents/sysadmin's
      dispatch paths at the exact moment diagnosis/restore needs them.
      Confirmed live, 2026-10-06.

      Docker-only, same reasoning as db-pgbackrest-repo-unreadable: this
      fault needs real filesystem access into the container, not a SQL-only
      mechanism. No external_compat variant.

      inject deliberately uses shell_exec (runs on the harness host, with
      real `docker` CLI access), not docker_exec (which only runs inside
      the container and cannot issue `docker restart` on itself) — the
      crash must happen as part of the container's own supervised startup
      so it lands in `docker logs` (get_host_logs is a literal `docker logs
      --tail N`), not an out-of-band exec session's own stdout. Verified
      live: a bare `rm` without a restart doesn't crash a running backend
      (pg_control is read at startup, not continuously) — the container
      must actually restart to make postgres attempt startup and panic.
    inject:
      type: shell_exec
      script_inline: |
        set -e
        docker exec helpdesk-test-pg-pgbackrest rm -f /var/lib/postgresql/data/global/pg_control
        docker restart helpdesk-test-pg-pgbackrest
    teardown:
      type: shell_exec
      # Repairs infra directly, not through any agent tool — same convention
      # every other fault's teardown uses, needed because --repeat stability
      # runs skip remediation entirely (see docs/CONSISTENCY.md). The exact
      # sequence verified live, 2026-10-06, against the real fixture: a
      # stale postmaster.pid (left over from the abnormal exit) blocks
      # pgbackrest restore outright ("[038]: unable to restore while
      # PostgreSQL is running") until removed — --force does NOT bypass
      # this, it means something else to pgBackRest.
      #
      # Skipped when postgres is already up: after a successful remediation
      # the rm below would delete the LIVE postmaster.pid, defeating that
      # same [038] guard, and restore over a running server (found 2026-10-17
      # on the VM variant). pg_isready needs no -h here: client and server
      # are the same build in the same image, so the socket dir matches.
      script_inline: |
        set -e
        if docker exec helpdesk-test-pg-pgbackrest pg_isready -q; then
          echo "postgres is up: nothing to repair"; exit 0
        fi
        docker exec -u postgres helpdesk-test-pg-pgbackrest sh -c '
          PGDATA=$(grep "^pg1-path=" /etc/pgbackrest.conf | cut -d= -f2)
          rm -f "$PGDATA/postmaster.pid"
          pgbackrest --stanza=main --delta restore
        '
        docker restart helpdesk-test-pg-pgbackrest
        # Don't hand the next fault a server still in recovery: pg_isready alone
        # says yes to a consistent server that hasn't promoted yet.
        for i in $(seq 1 60); do [ "$(docker exec -u postgres helpdesk-test-pg-pgbackrest psql -Atqc 'SELECT NOT pg_is_in_recovery()' 2>/dev/null)" = t ] && break; sleep 2; done
    diagnosis_playbook_series_id: pbs_db_data_loss_triage
    remediation:
      # Checked after the gateway's auto-chained restore: without it a PASS
      # graded the diagnosis only, whether or not postgres came back.
      verify_sql: "SELECT 1"
      verify_timeout: "120s"
    prompt: >
      Monitoring flagged that this database is unreachable. The
      connection_string is "{{connection_string}}" — use it verbatim for
      all tool calls. Please investigate and determine the root cause and
      appropriate recovery path.
    evaluation:
      expected_tools:
        - get_host_logs
        - get_pgbackrest_status
      expected_keywords:
        any_of:
          - "pg_control"
          - "could not find the database system"
          - "data directory"
          - "corrupt"
          - "restore"
      expected_diagnosis:
        category: "pgdata_corrupted"
        narrative: "pbs_db_data_loss_triage (DB agent) has no tool of its own to read Docker container logs. It should front-load everything it CAN determine without log evidence — single_instance, backup_tool, pitr_decided — into FINDINGS, then emit ESCALATE_TO: pbs_sysadmin_host_triage rather than guessing the rest. That playbook calls get_host_logs, recognizes \"could not find the database system\" as a genuine data-loss signature, judges whether the logs suggest anything beyond a plain restore, and — if the prior findings plus its own evidence all qualify — emits TRANSITION_TO: pbs_pgbackrest_health_triage directly (same agent, no bounce back to the DB agent for a decision it's already equipped to make). That playbook calls get_pgbackrest_status, confirms a healthy non-stale backup (Ending D), sees the data_loss_restore_candidate=true finding, and emits TRANSITION_TO: pbs_pgbackrest_restore_remediate — none of the triage/inspection playbooks perform the restore itself."
    # 300s, not the catalog's usual 90s: this is a 4-hop chain (data_loss_triage
    # -> docker_inspect -> pgbackrest_health_triage -> pgbackrest_restore_remediate),
    # one hop deeper than db-replica-container-stopped's own 3-hop chain
    # (which uses 180s), and the last hop is a genuinely slow real restore +
    # container restart + WAL replay, not a quick docker start. Found live,
    # 2026-10-07: 90s cut the connection mid-remediation, right as
    # restore_from_backup was running — the chain itself was correct, only
    # the client timeout was too short to let it finish.
    timeout: 300s

  - id: db-pgdata-corrupted-unarchived-tail
    name: "Data directory corrupted with commits not yet archived — restore keeps the pg_wal tail"
    category: database
    severity: critical
    description: >
      db-pgdata-corrupted, with archiving broken before the crash so the last
      commits exist only in pg_wal: row A in a completed segment waiting as
      .ready, row B in the open segment. Before v0.32 item 13, pgbackrest
      --delta restore emptied pg_wal and both rows were lost (the canary run,
      docs/samples/SAMPLE024.md). restore_from_backup now saves the tail,
      copies it back and archive-pushes it; this fault proves the whole agent
      chain does that, through playbook 1.6, and checks the rows themselves
      with verify_sql rather than trusting the chain's own report.
    agent_conn_override: pgbackrest-db
    direct_agent: sysadmin
    prerequisites: |
      Same as db-pgdata-corrupted: the dedicated pgBackRest target with
      archiving configured (testing/docker/setup-pgbackrest-backup.sh).
      Docker-only. The inject takes its own full backup first, so the backup
      is fresh (never refused as stale) and the archive end is this run's.

      verify_sql is checked only when remediation runs (FAULTTEST_REMEDIATE=
      true via the gateway, as faulttest-gateway-pgbackrest runs it). The
      harness checks it after the gateway's own chain too, not only after a
      remediation the harness triggers itself.
    inject:
      type: shell_exec
      # The archive_command reload is asynchronous, so the sleep before the
      # WAL switch; the .ready check makes injection fail loudly if row A's
      # segment was archived anyway, rather than test nothing.
      script_inline: |
        set -e
        C=helpdesk-test-pg-pgbackrest
        # Wait for postgres to be out of recovery: a fault before this one (e.g.
        # db-pgdata-corrupted's teardown restore + restart) can hand over a
        # server still recovering, and the backup below then fails ("the
        # database system is starting up", "are all available clusters in
        # recovery?"; found in the faulttest sweeps). pg_isready alone isn't
        # enough: a consistent server accepts read-only connections while
        # still in archive recovery (hot_standby), before it promotes.
        for i in $(seq 1 60); do [ "$(docker exec -u postgres "$C" psql -Atqc 'SELECT NOT pg_is_in_recovery()' 2>/dev/null)" = t ] && break; sleep 2; done
        [ "$(docker exec -u postgres "$C" psql -Atqc 'SELECT NOT pg_is_in_recovery()' 2>/dev/null)" = t ]
        docker exec -u postgres "$C" pgbackrest --stanza=main --type=full backup
        docker exec -u postgres "$C" psql -d testdb -v ON_ERROR_STOP=1 \
          -c "ALTER SYSTEM SET archive_command = '/bin/false'" -c "SELECT pg_reload_conf()"
        sleep 2
        docker exec -u postgres "$C" psql -d testdb -v ON_ERROR_STOP=1 \
          -c "DROP TABLE IF EXISTS canary_wal_tail" \
          -c "CREATE TABLE canary_wal_tail (id int PRIMARY KEY, segment text)" \
          -c "INSERT INTO canary_wal_tail VALUES (1, 'A: completed, .ready, never archived')" \
          -c "SELECT pg_switch_wal()" \
          -c "INSERT INTO canary_wal_tail VALUES (2, 'B: open segment')"
        sleep 2
        docker exec "$C" sh -c 'ls /var/lib/postgresql/data/pg_wal/archive_status | grep -q "\.ready$"'
        docker exec "$C" rm -f /var/lib/postgresql/data/global/pg_control
        docker restart "$C"
    inject_timeout: 120s
    teardown:
      type: shell_exec
      # Up (remediation worked): archiving is already back (the restore
      # brought back the backup's postgresql.auto.conf); drop the table and
      # switch WAL so the drop is archived. Down: db-pgdata-corrupted's own
      # repair, which also loses the canary rows; the table was never
      # archived, so it's gone afterwards. The saved pg_wal dirs are this
      # fault's own test data: always removed.
      script_inline: |
        set -e
        C=helpdesk-test-pg-pgbackrest
        docker exec -u postgres "$C" sh -c 'rm -rf /var/lib/postgresql/pg_wal.saved-*'
        # A server still in archive recovery answers pg_isready but is read-only
        # ("cannot execute DROP TABLE in a read-only transaction"): wait for it to
        # promote, or to turn out to be down.
        for i in $(seq 1 60); do docker exec "$C" pg_isready -q || break; [ "$(docker exec -u postgres "$C" psql -Atqc 'SELECT NOT pg_is_in_recovery()' 2>/dev/null)" = t ] && break; sleep 2; done
        if docker exec "$C" pg_isready -q; then
          docker exec -u postgres "$C" psql -d testdb -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET archive_command = 'pgbackrest --stanza=main archive-push %p'" \
            -c "SELECT pg_reload_conf()" -c "DROP TABLE IF EXISTS canary_wal_tail" -c "SELECT pg_switch_wal()"
          exit 0
        fi
        docker exec -u postgres "$C" sh -c '
          PGDATA=$(grep "^pg1-path=" /etc/pgbackrest.conf | cut -d= -f2)
          rm -f "$PGDATA/postmaster.pid"
          pgbackrest --stanza=main --delta restore
        '
        docker restart "$C"
        # Don't hand the next fault a server still in recovery: pg_isready alone
        # says yes to a consistent server that hasn't promoted yet.
        for i in $(seq 1 60); do [ "$(docker exec -u postgres helpdesk-test-pg-pgbackrest psql -Atqc 'SELECT NOT pg_is_in_recovery()' 2>/dev/null)" = t ] && break; sleep 2; done
    diagnosis_playbook_series_id: pbs_db_data_loss_triage
    remediation:
      # Both rows back (commits that were only in pg_wal survived the
      # restore) and archiving on again.
      verify_sql: >
        SELECT (SELECT count(*) FROM canary_wal_tail) = 2
           AND current_setting('archive_command') <> '/bin/false'
      verify_timeout: "120s"
    prompt: >
      Monitoring flagged that this database is unreachable. The
      connection_string is "{{connection_string}}" — use it verbatim for
      all tool calls. Please investigate and determine the root cause and
      appropriate recovery path.
    evaluation:
      expected_tools:
        - get_host_logs
        - get_pgbackrest_status
      expected_keywords:
        any_of:
          - "pg_control"
          - "could not find the database system"
          - "data directory"
          - "corrupt"
          - "restore"
      expected_diagnosis:
        category: "pgdata_corrupted"
        narrative: "Same diagnosis and chain as db-pgdata-corrupted (data_loss_triage -> sysadmin host triage -> pgbackrest_health_triage -> pgbackrest_restore_remediate). What differs is the restore: restore_from_backup's result has a pg_wal_tail with replay_through_wal past the archive end and row A's segment in pushed_to_archive, verify_restore_recovery returns verified with replayed_through_wal, and the remediation's findings say the commits in the pg_wal tail were recovered rather than lost."
    timeout: 300s

  - id: db-pitr-dropped-table
    name: "A table was dropped on a live database — point-in-time restore to just before"
    category: database
    severity: high
    description: >
      Logical corruption, not a crash: the database is up and serving when
      someone drops a table (pitr_orders, five rows) and creates another
      (pitr_after_drop) that must not survive either. Restoring to the latest
      backup would replay the DROP, so the only recovery is a point-in-time
      restore to the moment before it. The inject script commits the rows,
      takes a backup after them, notes the database's own clock, and only then
      does the damage; it prints that moment as PITR_TARGET, and the harness
      supplies it the way the operator who noticed would: on the triage run's
      request, then at the gate with the plan digest it read from the plan tool
      and the acknowledgements. pbs_pgbackrest_pitr_triage plans it
      (read-only); the gateway holds the boundary into
      pbs_pgbackrest_pitr_remediate at a human gate whatever the approval mode;
      the approval allows stopping the running instance; the restore flushes
      its WAL to the archive, stops it, restores to the target in the
      container's own volumes and the playbook starts it again. verify_sql
      checks the rows themselves, not the chain's report: the dropped table is
      back with all five rows and the table made after the drop is gone.
    agent_conn_override: pgbackrest-db
    direct_agent: sysadmin
    pitr:
      target_type: time
      allow_stop_serving: true
    prerequisites: |
      The dedicated pgBackRest target with archiving configured
      (testing/docker/setup-pgbackrest-backup.sh), Docker-only. The sysadmin
      agent must be reachable at FAULTTEST_SYSADMIN_AGENT_URL: the harness
      reads the plan from it, as the operator would, to approve the digest it
      reviewed. Run with the gateway and remediation on
      (faulttest-gateway-pgbackrest). A live restore stops the container, so
      this fault is not run alongside others against the same target.
    inject:
      type: shell_exec
      script_inline: |
        set -e
        C=helpdesk-test-pg-pgbackrest
        Q() { docker exec -u postgres "$C" psql -d testdb -v ON_ERROR_STOP=1 -Atqc "$1"; }
        # A fault before this one can hand over a server still recovering.
        for i in $(seq 1 60); do [ "$(docker exec -u postgres "$C" psql -Atqc 'SELECT NOT pg_is_in_recovery()' 2>/dev/null)" = t ] && break; sleep 2; done
        [ "$(docker exec -u postgres "$C" psql -Atqc 'SELECT NOT pg_is_in_recovery()' 2>/dev/null)" = t ]
        Q "DROP TABLE IF EXISTS pitr_orders"
        Q "DROP TABLE IF EXISTS pitr_after_drop"
        Q "CREATE TABLE pitr_orders (id int PRIMARY KEY, item text)"
        Q "INSERT INTO pitr_orders SELECT g, 'order-' || g FROM generate_series(1, 5) g"
        # A backup that finishes after the rows, so a restore can start from it.
        docker exec -u postgres "$C" pgbackrest --stanza=main --type=incr backup >/dev/null
        sleep 3
        T=$(Q "SELECT to_char(clock_timestamp() AT TIME ZONE 'UTC', 'YYYY-MM-DD\"T\"HH24:MI:SS\"Z\"')")
        LSN=$(Q "SELECT pg_current_wal_lsn()")
        sleep 2
        # The damage, after the target: another table, and the drop.
        Q "CREATE TABLE pitr_after_drop (id int)"
        Q "INSERT INTO pitr_after_drop VALUES (1)"
        Q "DROP TABLE pitr_orders"
        echo "PITR_TARGET time=$T lsn=$LSN"
    inject_timeout: 180s
    teardown:
      type: shell_exec
      # Up (remediation worked, or never ran): drop what this fault made. Down
      # or stopped (a run that died between the stop and the restart): start
      # the container, and if PostgreSQL still will not answer, restore to
      # the latest backup as db-pgdata-corrupted does.
      script_inline: |
        set -e
        C=helpdesk-test-pg-pgbackrest
        if [ "$(docker inspect -f '{{.State.Running}}' "$C")" != true ]; then docker start "$C"; fi
        for i in $(seq 1 60); do docker exec "$C" pg_isready -q || break; [ "$(docker exec -u postgres "$C" psql -Atqc 'SELECT NOT pg_is_in_recovery()' 2>/dev/null)" = t ] && break; sleep 2; done
        docker exec -u postgres "$C" sh -c 'rm -rf /var/lib/postgresql/pg_wal.saved-*'
        if docker exec "$C" pg_isready -q; then
          docker exec -u postgres "$C" psql -d testdb -v ON_ERROR_STOP=1 \
            -c "DROP TABLE IF EXISTS pitr_orders" -c "DROP TABLE IF EXISTS pitr_after_drop" -c "SELECT pg_switch_wal()"
          exit 0
        fi
        docker exec -u postgres "$C" sh -c '
          PGDATA=$(grep "^pg1-path=" /etc/pgbackrest.conf | cut -d= -f2)
          rm -f "$PGDATA/postmaster.pid"
          pgbackrest --stanza=main --delta restore
        '
        docker restart "$C"
        for i in $(seq 1 60); do [ "$(docker exec -u postgres "$C" psql -Atqc 'SELECT NOT pg_is_in_recovery()' 2>/dev/null)" = t ] && break; sleep 2; done
    diagnosis_playbook_series_id: pbs_pgbackrest_pitr_triage
    remediation:
      verify_sql: >
        SELECT to_regclass('public.pitr_after_drop') IS NULL
           AND (SELECT count(*) FROM public.pitr_orders) = 5
      verify_timeout: "180s"
    prompt: >
      An operator reports that the table pitr_orders on this database was
      dropped by mistake a few minutes ago, and wants the database back as it
      was just before. The connection_string is "{{connection_string}}" — use it
      verbatim for all tool calls. The recovery target comes with this request;
      do not choose or change one. Plan the point-in-time restore and report
      whether it is feasible.
    evaluation:
      expected_tools:
        - plan_point_in_time_recovery
      expected_keywords:
        any_of:
          - "plan_digest"
          - "feasible"
          - "point-in-time"
          - "pitr_orders"
      expected_diagnosis:
        category: "plan_feasible"
        narrative: "The triage must plan the supplied target with plan_point_in_time_recovery and report it feasible with the plan digest, the backup it would restore and what would be discarded; it must not choose a target, stop anything, or call a restore tool. The chain then holds at a gate (recovery_target_required) for a human; the harness approves the digest it read from the plan. The restore stops the running instance, restores to the target and the remediation playbook restarts it and verifies where recovery stopped."
    timeout: 420s

  - id: db-pgdata-corrupted-k8s
    name: "Data directory corrupted — restore from latest backup (Kubernetes pod)"
    category: database
    severity: critical
    description: >
      db-pgdata-corrupted against the self-managed pgBackRest pod on
      Kubernetes, in its own namespace (db-destruct): pg_control is deleted
      and the pod deleted, so it crash-loops (CrashLoopBackOff, no kubectl
      exec) like a real storage loss. The agent-driven chain has to cross
      four hops on its own: pbs_db_data_loss_triage hands off to
      pbs_sysadmin_host_triage, which reads the pod's logs (kubectl logs, the
      crashed run first) and finds "could not find the database system",
      pbs_pgbackrest_health_triage confirms a healthy backup and a continuous
      WAL chain, and pbs_pgbackrest_restore_remediate scales the StatefulSet
      to 0, restores in a one-off pod, and resumes it with restart_container.
      Added v0.33: v0.32 verified each of those tools in-cluster but the
      playbooks did not route a Kubernetes data-loss case to them.
    # Resolved from the gateway's own infrastructure config (an entry with
    # k8s_namespace db-destruct and k8s_pod_selector app=pgbackrest-demo, see
    # testing/k8s/helm-values-pgbackrest.yaml); the harness needs none.
    agent_conn_override: pgbackrest-k8s-destruct
    prerequisites: |
      The helpdesk stack deployed in-cluster (or a local stack whose
      sysadmin agent can reach the cluster) with an inventory entry
      pgbackrest-k8s-destruct for namespace db-destruct, and the pgBackRest
      pod applied there with a recent full backup and a clean
      `pgbackrest check` (what `make integration-k8s` does first):
        kubectl create namespace db-destruct
        kubectl apply -n db-destruct -f testing/k8s/pgbackrest-demo.yaml
        kubectl -n db-destruct exec pgbackrest-demo-0 -- su postgres -c \
          'pgbackrest --stanza=main --type=full backup'
      Run with the gate flags, against the gateway:
        go run ./testing/cmd/faulttest run --ids db-pgdata-corrupted-k8s \
          --remediate --via-gateway --gateway $GW --api-key <key> \
          --conn pgbackrest-k8s-destruct --context minikube \
          --approval-mode force --gate-escalation --operator <you>

      Destructive: the inject and teardown scripts refuse any namespace that
      does not end in -destruct. Neither needs SSH; both use kubectl from the
      harness, and recovery is checked with verify_exec (kubectl exec), since
      the harness has no route to the pod's ClusterIP.
    inject_timeout: 180s
    inject:
      type: shell_exec
      script_inline: |
        set -e
        CTX_ARG=""
        [ -n "$FAULTTEST_K8S_CONTEXT" ] && CTX_ARG="--context=$FAULTTEST_K8S_CONTEXT"
        NS=db-destruct
        case "$NS" in *-destruct) ;; *) echo "refusing to crash a database in namespace $NS: it must end in -destruct" >&2; exit 1;; esac
        K="kubectl $CTX_ARG -n $NS"
        POD=$($K get pod -l app=pgbackrest-demo -o jsonpath='{.items[0].metadata.name}')
        [ -n "$POD" ] || { echo "no pgbackrest-demo pod in $NS" >&2; exit 1; }
        $K exec "$POD" -- rm -f /var/lib/postgresql/data/global/pg_control
        $K delete pod "$POD" --wait=true
        # Postgres cannot start without pg_control: wait for the state a real
        # crash leaves, a pod that exists, is not ready and cannot be exec'd
        # into (CrashLoopBackOff).
        for i in $(seq 1 60); do
          P=$($K get pod -l app=pgbackrest-demo -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [ -n "$P" ] && [ "$($K get pod "$P" -o jsonpath='{.status.containerStatuses[0].ready}' 2>/dev/null)" != true ]; then
            if ! $K exec "$P" -- true >/dev/null 2>&1; then
              sleep 5 # let it crash at least once more
              echo "crashed: $P is not ready and cannot be exec'd into"
              exit 0
            fi
          fi
          sleep 3
        done
        echo "pod did not reach a crashed, un-exec-able state within 3 minutes" >&2
        exit 1
    teardown:
      type: shell_exec
      # Repairs the cluster directly, not through any agent tool (same
      # convention as the Docker and VM faults: --repeat runs skip
      # remediation, and a failed remediation must not leave the pod down).
      # Nothing to do when the pod is ready; otherwise it does what the
      # agent's restore does, by hand: scale to 0, restore in a one-off pod on
      # the StatefulSet's volumes, scale back up. Also removes the
      # pg_wal.saved-* copies a restore leaves on the repo volume.
      script_inline: |
        set -e
        CTX_ARG=""
        [ -n "$FAULTTEST_K8S_CONTEXT" ] && CTX_ARG="--context=$FAULTTEST_K8S_CONTEXT"
        NS=db-destruct
        case "$NS" in *-destruct) ;; *) echo "refusing to repair namespace $NS: it must end in -destruct" >&2; exit 1;; esac
        K="kubectl $CTX_ARG -n $NS"
        PROMOTED="psql -d testdb -Atc 'SELECT NOT pg_is_in_recovery()'"
        wait_promoted() {
          for i in $(seq 1 90); do
            [ "$($K exec pgbackrest-demo-0 -- su postgres -c "$PROMOTED" 2>/dev/null)" = t ] && return 0
            sleep 2
          done
          echo "pgbackrest-demo-0 did not finish recovery" >&2
          return 1
        }
        READY=$($K get pod -l app=pgbackrest-demo -o jsonpath='{.items[0].status.containerStatuses[0].ready}' 2>/dev/null || true)
        if [ "$READY" = true ]; then
          wait_promoted
          $K exec pgbackrest-demo-0 -- sh -c 'rm -rf /var/lib/pgbackrest/pg_wal.saved-*'
          echo "pgbackrest-demo is ready: nothing to repair"
          exit 0
        fi
        $K scale statefulset/pgbackrest-demo --replicas=0
        $K wait --for=delete pod -l app=pgbackrest-demo --timeout=120s || true
        OVR='{"apiVersion":"v1","spec":{"restartPolicy":"Never","volumes":[{"name":"pgdata","persistentVolumeClaim":{"claimName":"pgdata-pgbackrest-demo-0"}},{"name":"pgbackrest-repo","persistentVolumeClaim":{"claimName":"pgbackrest-repo-pgbackrest-demo-0"}}],"containers":[{"name":"fault-repair","image":"docker-postgres-pgbackrest:latest","imagePullPolicy":"Never","command":["su","postgres","-c","PGDATA=$(grep ^pg1-path= /etc/pgbackrest.conf | cut -d= -f2); rm -f $PGDATA/postmaster.pid; pgbackrest --stanza=main --delta restore; rm -rf /var/lib/pgbackrest/pg_wal.saved-*"],"volumeMounts":[{"name":"pgdata","mountPath":"/var/lib/postgresql/data"},{"name":"pgbackrest-repo","mountPath":"/var/lib/pgbackrest"}]}]}}'
        $K delete pod fault-repair --ignore-not-found --wait=true
        $K run fault-repair --image=docker-postgres-pgbackrest:latest --restart=Never --overrides="$OVR"
        PH=""
        for i in $(seq 1 90); do
          PH=$($K get pod fault-repair -o jsonpath='{.status.phase}' 2>/dev/null || true)
          [ "$PH" = Succeeded ] || [ "$PH" = Failed ] && break
          sleep 2
        done
        $K logs fault-repair 2>&1 | grep -v "WARN: environment contains invalid option" || true
        $K delete pod fault-repair --wait=false
        [ "$PH" = Succeeded ] || { echo "repair restore ended $PH" >&2; exit 1; }
        $K scale statefulset/pgbackrest-demo --replicas=1
        $K wait --for=condition=Ready pod/pgbackrest-demo-0 --timeout=300s
        wait_promoted
    diagnosis_playbook_series_id: pbs_db_data_loss_triage
    remediation:
      # The harness has no route to the pod's ClusterIP, so recovery is
      # checked from inside it: the instance is serving and has finished
      # recovery (promoted), not merely accepting read-only connections.
      verify_exec: |
        CTX_ARG=""
        [ -n "$FAULTTEST_K8S_CONTEXT" ] && CTX_ARG="--context=$FAULTTEST_K8S_CONTEXT"
        [ "$(kubectl $CTX_ARG -n db-destruct exec pgbackrest-demo-0 -- su postgres -c "psql -d testdb -Atc 'SELECT NOT pg_is_in_recovery()'" 2>/dev/null)" = t ]
      verify_timeout: "240s"
    prompt: >
      Monitoring flagged that this database is unreachable. The
      connection_string is "{{connection_string}}" — use it verbatim for
      all tool calls. Please investigate and determine the root cause and
      appropriate recovery path.
    evaluation:
      expected_tools:
        - get_host_logs
        - get_pgbackrest_status
      expected_keywords:
        any_of:
          - "pg_control"
          - "could not find the database system"
          - "data directory"
          - "corrupt"
          - "restore"
      expected_diagnosis:
        category: "pgdata_corrupted"
        narrative: "Same chain as db-pgdata-corrupted over a Kubernetes pod: pbs_db_data_loss_triage front-loads single_instance/backup_tool/pitr_decided and hands off to pbs_sysadmin_host_triage, which reads runtime=kubectl from check_host, reads the pod's logs with get_host_logs (kubectl logs, the crashed run first) and finds the \"could not find the database system\" signature, then transitions to pbs_pgbackrest_health_triage (healthy backup, continuous WAL chain) and pbs_pgbackrest_restore_remediate, which restores in a one-off pod with the StatefulSet scaled to 0 and resumes it with restart_container."
    timeout: 420s

  - id: db-pitr-dropped-table-k8s
    name: "A table was dropped on a live database — point-in-time restore to just before (Kubernetes pod)"
    category: database
    severity: high
    description: >
      db-pitr-dropped-table against the self-managed pgBackRest pod on
      Kubernetes, in its own namespace (db-destruct): the pod is up and serving
      when pitr_orders (five rows) is dropped and pitr_after_drop is created.
      Restoring to the latest backup would replay the DROP, so the recovery is
      a point-in-time restore to the moment before it. The inject script
      commits the rows, takes an incremental backup after them, notes the
      database's own clock and prints it as PITR_TARGET; the harness supplies
      it on the triage run and, at the gate, with the digest of the plan it
      read from the in-cluster sysadmin agent. The approval allows stopping the
      running pod: the restore flushes its WAL to the archive, stops it cleanly,
      scales the StatefulSet to 0, restores in a one-off pod on its volumes and
      the playbook resumes it with restart_container. verify_exec then checks
      the rows themselves from inside the pod.
    agent_conn_override: pgbackrest-k8s-destruct
    direct_agent: sysadmin
    pitr:
      target_type: time
      allow_stop_serving: true
    prerequisites: |
      The helpdesk stack deployed in-cluster with an inventory entry
      pgbackrest-k8s-destruct for namespace db-destruct, a sysadmin agent image
      that has the point-in-time tools (rebuild after v0.33 P4), and the
      pgBackRest pod applied there with a recent full backup (what
      `make integration-k8s` does first). From the laptop, forward the gateway
      and the sysadmin agent (the harness reads the plan from the latter, as an
      operator would):
        kubectl -n helpdesk-system port-forward svc/helpdesk-gateway 18080:8080 &
        kubectl -n helpdesk-system port-forward svc/helpdesk-sysadmin-agent 11103:1103 &
      Then:
        go run ./testing/cmd/faulttest run --ids db-pitr-dropped-table-k8s \
          --remediate --via-gateway --gateway http://localhost:18080 --api-key <key> \
          --sysadmin-agent http://localhost:11103 --sysadmin-api-key <key> \
          --conn pgbackrest-k8s-destruct --context minikube \
          --approval-mode force --gate-escalation --operator <you>

      Destructive: the inject and teardown scripts refuse any namespace that
      does not end in -destruct. The live restore stops the pod, so do not run
      this alongside other faults against the same namespace.
    inject_timeout: 180s
    inject:
      type: shell_exec
      script_inline: |
        set -e
        CTX_ARG=""
        [ -n "$FAULTTEST_K8S_CONTEXT" ] && CTX_ARG="--context=$FAULTTEST_K8S_CONTEXT"
        NS=db-destruct
        case "$NS" in *-destruct) ;; *) echo "refusing to damage a database in namespace $NS: it must end in -destruct" >&2; exit 1;; esac
        K="kubectl $CTX_ARG -n $NS"
        POD=$($K get pod -l app=pgbackrest-demo -o jsonpath='{.items[0].metadata.name}')
        [ -n "$POD" ] || { echo "no pgbackrest-demo pod in $NS" >&2; exit 1; }
        # SQL goes in on stdin, so no layer of quoting touches it.
        Q() { printf '%s\n' "$1" | $K exec -i "$POD" -- su postgres -c 'psql -d testdb -v ON_ERROR_STOP=1 -Atq'; }
        for i in $(seq 1 60); do [ "$(Q 'SELECT NOT pg_is_in_recovery()' 2>/dev/null)" = t ] && break; sleep 2; done
        [ "$(Q 'SELECT NOT pg_is_in_recovery()' 2>/dev/null)" = t ]
        Q "DROP TABLE IF EXISTS pitr_orders"
        Q "DROP TABLE IF EXISTS pitr_after_drop"
        Q "CREATE TABLE pitr_orders (id int PRIMARY KEY, item text)"
        Q "INSERT INTO pitr_orders SELECT g, 'order-' || g FROM generate_series(1, 5) g"
        # A backup that finishes after the rows, so a restore can start from it.
        $K exec "$POD" -- su postgres -c 'pgbackrest --stanza=main --type=incr backup' >/dev/null 2>&1
        sleep 3
        T=$(Q "SELECT to_char(clock_timestamp() AT TIME ZONE 'UTC', 'YYYY-MM-DD\"T\"HH24:MI:SS\"Z\"')")
        LSN=$(Q "SELECT pg_current_wal_lsn()")
        sleep 2
        # The damage, after the target: another table, and the drop.
        Q "CREATE TABLE pitr_after_drop (id int)"
        Q "INSERT INTO pitr_after_drop VALUES (1)"
        Q "DROP TABLE pitr_orders"
        echo "PITR_TARGET time=$T lsn=$LSN"
    teardown:
      type: shell_exec
      # (db-pgdata-corrupted-k8s's repair, plus dropping this fault's tables.)
      # Repairs the cluster directly, not through any agent tool (same
      # convention as the Docker and VM faults: --repeat runs skip
      # remediation, and a failed remediation must not leave the pod down).
      # Nothing to do when the pod is ready; otherwise it does what the
      # agent's restore does, by hand: scale to 0, restore in a one-off pod on
      # the StatefulSet's volumes, scale back up. Also removes the
      # pg_wal.saved-* copies a restore leaves on the repo volume.
      script_inline: |
        set -e
        CTX_ARG=""
        [ -n "$FAULTTEST_K8S_CONTEXT" ] && CTX_ARG="--context=$FAULTTEST_K8S_CONTEXT"
        NS=db-destruct
        case "$NS" in *-destruct) ;; *) echo "refusing to repair namespace $NS: it must end in -destruct" >&2; exit 1;; esac
        K="kubectl $CTX_ARG -n $NS"
        PROMOTED="psql -d testdb -Atc 'SELECT NOT pg_is_in_recovery()'"
        wait_promoted() {
          for i in $(seq 1 90); do
            [ "$($K exec pgbackrest-demo-0 -- su postgres -c "$PROMOTED" 2>/dev/null)" = t ] && return 0
            sleep 2
          done
          echo "pgbackrest-demo-0 did not finish recovery" >&2
          return 1
        }
        READY=$($K get pod -l app=pgbackrest-demo -o jsonpath='{.items[0].status.containerStatuses[0].ready}' 2>/dev/null || true)
        if [ "$READY" = true ]; then
          wait_promoted
          $K exec pgbackrest-demo-0 -- sh -c 'rm -rf /var/lib/pgbackrest/pg_wal.saved-*'
          # Up (remediation worked, or never ran): drop what this fault made and
          # let the drop reach the archive.
          $K exec -i pgbackrest-demo-0 -- su postgres -c 'psql -d testdb -v ON_ERROR_STOP=1 -q' <<'SQL'
        DROP TABLE IF EXISTS pitr_orders;
        DROP TABLE IF EXISTS pitr_after_drop;
        SELECT pg_switch_wal();
        SQL
          echo "pgbackrest-demo is ready: dropped this fault's tables"
          exit 0
        fi
        $K scale statefulset/pgbackrest-demo --replicas=0
        $K wait --for=delete pod -l app=pgbackrest-demo --timeout=120s || true
        OVR='{"apiVersion":"v1","spec":{"restartPolicy":"Never","volumes":[{"name":"pgdata","persistentVolumeClaim":{"claimName":"pgdata-pgbackrest-demo-0"}},{"name":"pgbackrest-repo","persistentVolumeClaim":{"claimName":"pgbackrest-repo-pgbackrest-demo-0"}}],"containers":[{"name":"fault-repair","image":"docker-postgres-pgbackrest:latest","imagePullPolicy":"Never","command":["su","postgres","-c","PGDATA=$(grep ^pg1-path= /etc/pgbackrest.conf | cut -d= -f2); rm -f $PGDATA/postmaster.pid; pgbackrest --stanza=main --delta restore; rm -rf /var/lib/pgbackrest/pg_wal.saved-*"],"volumeMounts":[{"name":"pgdata","mountPath":"/var/lib/postgresql/data"},{"name":"pgbackrest-repo","mountPath":"/var/lib/pgbackrest"}]}]}}'
        $K delete pod fault-repair --ignore-not-found --wait=true
        $K run fault-repair --image=docker-postgres-pgbackrest:latest --restart=Never --overrides="$OVR"
        PH=""
        for i in $(seq 1 90); do
          PH=$($K get pod fault-repair -o jsonpath='{.status.phase}' 2>/dev/null || true)
          [ "$PH" = Succeeded ] || [ "$PH" = Failed ] && break
          sleep 2
        done
        $K logs fault-repair 2>&1 | grep -v "WARN: environment contains invalid option" || true
        $K delete pod fault-repair --wait=false
        [ "$PH" = Succeeded ] || { echo "repair restore ended $PH" >&2; exit 1; }
        $K scale statefulset/pgbackrest-demo --replicas=1
        $K wait --for=condition=Ready pod/pgbackrest-demo-0 --timeout=300s
        wait_promoted
    diagnosis_playbook_series_id: pbs_pgbackrest_pitr_triage
    remediation:
      # The harness has no route to the pod's ClusterIP, so the rows are checked
      # from inside it: the dropped table is back with all five rows, the table
      # made after the drop is gone, and the instance has finished recovery.
      verify_exec: |
        CTX_ARG=""
        [ -n "$FAULTTEST_K8S_CONTEXT" ] && CTX_ARG="--context=$FAULTTEST_K8S_CONTEXT"
        [ "$(kubectl $CTX_ARG -n db-destruct exec pgbackrest-demo-0 -- su postgres -c "psql -d testdb -Atc \"SELECT NOT pg_is_in_recovery() AND to_regclass('public.pitr_after_drop') IS NULL AND (SELECT count(*) FROM public.pitr_orders) = 5\"" 2>/dev/null)" = t ]
      verify_timeout: "240s"
    prompt: >
      An operator reports that the table pitr_orders on this database was
      dropped by mistake a few minutes ago, and wants the database back as it
      was just before. The connection_string is "{{connection_string}}" — use it
      verbatim for all tool calls. The recovery target comes with this request;
      do not choose or change one. Plan the point-in-time restore and report
      whether it is feasible.
    evaluation:
      expected_tools:
        - plan_point_in_time_recovery
      expected_keywords:
        any_of:
          - "plan_digest"
          - "feasible"
          - "point-in-time"
          - "pitr_orders"
      expected_diagnosis:
        category: "plan_feasible"
        narrative: "Same as db-pitr-dropped-table over a Kubernetes pod: the triage plans the supplied target with plan_point_in_time_recovery and reports it feasible with the plan digest, without choosing a target or calling a restore tool; the chain holds at a gate (recovery_target_required) for the harness to approve; the restore flushes the running pod's WAL, stops it, scales the StatefulSet to 0, restores in a one-off pod and the remediation playbook resumes it with restart_container and verifies where recovery stopped."
    timeout: 420s

  - id: db-pgdata-corrupted-vm
    name: "Data directory corrupted — restore from latest backup (real host/VM)"
    category: database
    severity: critical
    description: >
      Same scenario as db-pgdata-corrupted (pg_control missing, restore from
      pgBackRest), but against a real, SSH-reachable Linux host/VM running
      PostgreSQL as a genuine systemd service — not a Docker container. Added
      v0.31 to prove pbs_db_data_loss_triage's full chain, and
      agents/sysadmin's own dispatch (check_host/get_host_logs/
      read_pg_log_file/restart_service), work against a real systemd target,
      on par with the Docker and Kubernetes paths. Reuses the identical
      diagnosis/remediation playbook chain — only the injection/teardown
      mechanism and the target's own runtime differ.
    # No agent_conn_override: unlike db-pgdata-corrupted's dedicated Docker
    # target, this fault's target is the real VM supplied via --ssh-host —
    # point --conn/--agent-conn at that VM's own infra-config entry.
    prerequisites: |
      Requires a real Linux VM (Ubuntu or RHEL/Red Hat) with PostgreSQL and
      pgBackRest installed and an initial backup already taken — see
      testing/docker/setup-pgbackrest-vm.sh (run once, manually, against your
      own VM; not part of any automated `make` target, since this project
      doesn't own or provision the VM itself). Requires a
      testing.infra.json db_server entry for the VM with systemd_unit and
      pg_log_dir set correctly for your distro (the setup script prints the
      exact entry to add). Run with:
        go run ./testing/cmd/faulttest run --ids db-pgdata-corrupted-vm \
          --remediate --ssh-host=<user@vm-host> --ssh-port=<port> \
          --ssh-key=<path> --conn=<vm db_server's connection_string> \
          --agent-conn=<vm db_server's key> --infra-config=<path> ...

      The injection/teardown scripts below assume the dispatch user has
      passwordless sudo for `systemctl restart <unit>` (or runs as root) —
      the same privilege agents/sysadmin's own restart_service dispatch
      needs on the agent side; see the setup script's own comments for the
      exact sudoers line. PG_UNIT below is a placeholder — Ubuntu/Debian's
      package-managed postgresql.service is a meta-unit covering every
      registered cluster; RHEL/Red Hat's package creates a plain
      postgresql-<version> unit instead. Edit it to match your real VM
      before running, same as you'd edit any other environment-specific
      value in a customer-facing runbook.

      No external_compat variant: ssh_exec always requires real OS access,
      the same reasoning db-pg-hba-corrupt's own SSH-injectable faults
      already establish.
    inject:
      type: ssh_exec
      exec_via: "" # filled by --ssh-host at runtime
      script_inline: |
        #!/bin/bash
        set -e
        PG_UNIT="postgresql@16-main" # EDIT to match your real VM's unit name
        DATA_DIR=$(psql -t -c "SHOW data_directory;" 2>/dev/null | tr -d ' ')
        if [ -z "$DATA_DIR" ]; then
          echo "could not determine data_directory via psql — is postgres reachable?" >&2
          exit 1
        fi
        rm -f "$DATA_DIR/global/pg_control"
        # Unlike `docker restart <container>` (db-pgdata-corrupted's own
        # equivalent line), which always exits 0 regardless of whether the
        # containerized process subsequently crashes, `systemctl restart` is
        # synchronous — it waits for the unit to report started/failed and
        # returns non-zero when it fails to start. Postgres genuinely cannot
        # start without pg_control, so this restart failing is the CORRECT,
        # intended outcome proving the corruption took effect — not a sign
        # injection itself failed. Found live (2026-10-09): under `set -e`,
        # an un-tolerated failure here aborted the script and faulttest
        # reported "injection failed" even though the fault had been
        # successfully induced (service genuinely down, as intended).
        sudo systemctl restart "$PG_UNIT" || true
    teardown:
      type: ssh_exec
      exec_via: ""
      # Repairs infra directly, not through any agent tool — same convention
      # db-pgdata-corrupted's own teardown uses, needed because --repeat
      # stability runs skip remediation entirely (see docs/CONSISTENCY.md).
      # Reads PGDATA from pgbackrest.conf, not psql — postgres is down at
      # teardown time.
      script_inline: |
        #!/bin/bash
        set -e
        PG_UNIT="postgresql@16-main" # EDIT to match your real VM's unit name
        STANZA="main" # EDIT to match your real VM's pgBackRest stanza
        # No `sudo -u postgres` wrapper here: setup-pgbackrest-vm.sh authorizes
        # the dispatch SSH key under ~postgres/.ssh/authorized_keys and the SSH
        # login IS already postgres (per the recommended ssh_user: "postgres"
        # infra entry) — its sudoers grant only covers run-as=root for
        # `systemctl restart`/`show`, not run-as=postgres, so wrapping in
        # `sudo -u postgres` would be rejected outright ("not allowed to
        # execute ... as postgres"), not merely prompt for a password.
        #
        # Skipped when the unit is already active: after a successful
        # remediation the rm below would delete the LIVE postmaster.pid and
        # restore over a running server (found 2026-10-17). Checks the unit,
        # not pg_isready, because the socket directory differs by distro
        # (/var/run/postgresql on Debian/Ubuntu, /run/postgresql + /tmp on RHEL
        # PGDG, /tmp from source) while PG_UNIT is already this script's one
        # per-distro setting. is-active needs no sudo.
        if systemctl is-active --quiet "$PG_UNIT"; then
          echo "$PG_UNIT is active: nothing to repair"; exit 0
        fi
        PGDATA=$(grep "^pg1-path=" /etc/pgbackrest.conf | cut -d= -f2)
        rm -f "$PGDATA/postmaster.pid"
        pgbackrest --stanza="$STANZA" --delta restore
        sudo systemctl restart "$PG_UNIT"
    diagnosis_playbook_series_id: pbs_db_data_loss_triage
    prompt: >
      Monitoring flagged that this database is unreachable. The
      connection_string is "{{connection_string}}" — use it verbatim for
      all tool calls. Please investigate and determine the root cause and
      appropriate recovery path.
    evaluation:
      expected_tools:
        - get_host_logs
        - get_pgbackrest_status
      expected_keywords:
        any_of:
          - "pg_control"
          - "could not find the database system"
          - "data directory"
          - "corrupt"
          - "restore"
      expected_diagnosis:
        category: "pgdata_corrupted"
        narrative: "Same chain as db-pgdata-corrupted, over a real systemd/VM target instead of Docker: pbs_db_data_loss_triage recognizes the \"[systemd: ...]\" hosting tag, front-loads single_instance/backup_tool/pitr_decided, and hands off to pbs_sysadmin_host_triage, which reads runtime=systemd from check_host, uses the systemd-specific field guidance (ActiveState/SubState/Result) instead of exitcode=/oomkilled=, and — since journalctl typically only shows service-lifecycle lines, not PostgreSQL's own output — calls read_pg_log_file for the real \"could not find the database system\" signature before transitioning to pbs_pgbackrest_health_triage, then pbs_pgbackrest_restore_remediate, which uses restart_service (not restart_container) once check_host confirms runtime=systemd."
    # Same 300s reasoning as db-pgdata-corrupted — a 4-hop chain with a
    # genuinely slow last hop (real restore + service restart + WAL replay).
    timeout: 300s

  - id: db-connection-refused
    name: "Database connection refused"
    category: database
    severity: critical
    description: >
      The PostgreSQL server is stopped and not accepting connections.
    external_compat: true
    inject:
      type: docker
      action: stop
      service: postgres
    teardown:
      type: docker
      action: start
      service: postgres
    external_inject:
      type: shell_exec
      script_inline: |
        set -e
        docker stop "$FAULTTEST_CONTAINER"
        echo "PostgreSQL container $FAULTTEST_CONTAINER stopped"
    external_teardown:
      type: shell_exec
      script_inline: |
        set -e
        docker start "$FAULTTEST_CONTAINER"
        sleep 3
        echo "PostgreSQL container $FAULTTEST_CONTAINER started"
    remediation:
      playbook_id: pbs_db_restart_action
      verify_sql: "SELECT 1"
      verify_timeout: "120s"
    diagnosis_playbook_series_id: pbs_db_restart_triage
    prompt: >
      The database is unreachable and users are getting connection refused
      errors. The connection_string is "{{connection_string}}" — use it
      verbatim for all tool calls. Please investigate.
    evaluation:
      expected_tools:
        - check_connection
      expected_keywords:
        any_of:
          - "connection refused"
          - "unreachable"
          - "could not connect"
          - "server closed"
          - "not accepting"
      expected_diagnosis:
        category: "connection_refused"
        narrative: "The agent should identify that the PostgreSQL server is not running or not accepting connections (connection refused error). The agent should note the very recent server uptime as evidence of a prior outage that has since recovered, or identify that the server is currently unreachable. For a Docker-hosted or container-hosted server, the correct action is to escalate to the sysadmin agent for container inspection (ESCALATE_TO: pbs_sysadmin_host_triage) since the agent cannot access Docker logs or container state directly — this escalation is the right outcome, not a premature one."
    timeout: 30s

  - id: db-auth-failure
    name: "Authentication failure"
    category: database
    severity: critical
    description: >
      The connection string has incorrect credentials, causing
      authentication failures.
    inject:
      type: config
      override:
        connection_string: "host=localhost port=15432 dbname=testdb user=postgres password=wrongpassword"
    teardown:
      type: config
      restore: true
    prompt: >
      The database is returning authentication errors. The connection_string
      is "{{connection_string}}" — use it verbatim for all tool calls.
      Please investigate.
    evaluation:
      expected_tools:
        - check_connection
      expected_keywords:
        any_of:
          - "authentication"
          - "password"
          - "auth"
          - "denied"
          - "failed"
      expected_diagnosis:
        category: "authentication_failure"
        narrative: "The agent should identify that the database connection is failing due to incorrect credentials or an authentication error, and recommend verifying the username and password in the connection string."
    diagnosis_playbook_series_id: pbs_auth_failure_triage
    timeout: 30s

  - id: db-not-exist
    name: "Database does not exist"
    category: database
    severity: critical
    description: >
      The connection string references a database name that doesn't exist
      on the server.
    inject:
      type: config
      override:
        connection_string: "host=localhost port=15432 dbname=nonexistent_db user=postgres password=testpass"
    teardown:
      type: config
      restore: true
    prompt: >
      Applications are getting errors when connecting to the database.
      The connection_string is "{{connection_string}}" — use it verbatim
      for all tool calls. Please investigate.
    evaluation:
      expected_tools:
        - check_connection
      expected_keywords:
        any_of:
          - "does not exist"
          - "not found"
          - "no database"
          - "nonexistent"
      expected_diagnosis:
        category: "database_not_found"
        narrative: "The agent should identify that the database name specified in the connection string does not exist on the server, and recommend verifying the database name or creating it."
    timeout: 30s

  - id: db-replication-lag
    name: "Replication lag"
    category: database
    severity: high
    description: >
      The streaming replica has fallen behind the primary due to paused
      WAL replay, causing stale reads.
    external_compat: true  # pure libpq, no Docker/OS access needed
    requires_replica: true  # needs a real replica attached; set FAULTTEST_REPLICA_CONN_STR
    inject:
      type: sql
      target: replica
      script_inline: "SELECT pg_wal_replay_pause();"
    teardown:
      type: sql
      target: replica
      script_inline: "SELECT pg_wal_replay_resume();"
    prompt: >
      The replica seems to be returning stale data — recent writes on the
      primary are not visible. The primary connection_string is
      "{{connection_string}}" — use it verbatim for all tool calls.
      Please investigate replication status.
    evaluation:
      expected_tools:
        - get_replication_status
      expected_keywords:
        any_of:
          - "replication lag"
          - "replay"
          - "wal"
          - "standby"
          - "behind"
          - "lag"
      expected_diagnosis:
        category: "replication_lag"
        narrative: "The agent should identify that the streaming replica has fallen behind the primary due to paused or stalled WAL replay, and recommend resuming WAL replay or investigating the replica's replication slot."
    diagnosis_playbook_series_id: pbs_replication_lag
    remediation:
      playbook_id: pbs_replication_remediate
      verify_sql: "SELECT count(*) = 0 FROM pg_stat_replication WHERE replay_lag > interval '60 seconds'"
      verify_timeout: "120s"
    timeout: 60s

  - id: db-replica-disconnected
    name: "Replica disconnected (walreceiver dropped)"
    category: database
    severity: high
    description: >
      The streaming replica's connection to the primary has been severed entirely.
      pg_stat_replication no longer shows the replica at all — a naive check could
      misread the absent row as "no active replication = healthy," when the correct
      signal is an inactive slot in pg_replication_slots with growing retained WAL.
    external_compat: true
    requires_replica: true
    # 120s, not the 90s default: injection's own precondition guard can wait
    # up to 90s on its own for the replica to reconnect after a prior --repeat
    # rep's teardown (see inject's own comment) — needs headroom above that or
    # the harness SIGKILLs the injection subprocess before the guard's own,
    # more informative RAISE EXCEPTION ever gets a chance to fire.
    inject_timeout: 60s
    prerequisites: >
      The injection connection (not the agent's own connection) must be superuser —
      needed both for pg_hba.conf's COPY ... TO PROGRAM rewrite below and for
      pg_terminate_backend. A real streaming replica must already be attached to the
      target primary — injection fails loudly if not.
    inject:
      type: sql
      script_inline: >
        COPY (SELECT 1) TO PROGRAM
        'for i in $(seq 1 45); do
        n=$(psql -tAc "SELECT count(*) FROM pg_stat_replication" -d testdb);
        if [ "$n" -gt 0 ]; then exit 0; fi;
        sleep 1; done;
        echo "db-replica-disconnected fault requires an already-connected streaming
        replica; none found in pg_stat_replication after waiting 45s for
        reconnection (relevant for --repeat: the replica needs time to reconnect
        after a prior rep''s teardown lifts the reject rule)" >&2; exit 1';
        COPY (SELECT 'host replication all all reject') TO PROGRAM
        'cat > /tmp/hba_new.conf && cat /var/lib/postgresql/data/pg_hba.conf >> /tmp/hba_new.conf && mv /tmp/hba_new.conf /var/lib/postgresql/data/pg_hba.conf';
        SELECT pg_reload_conf();
        SELECT pg_terminate_backend(pid) FROM pg_stat_replication;
    teardown:
      type: sql
      script_inline: >
        COPY (SELECT 1) TO PROGRAM
        'tail -n +2 /var/lib/postgresql/data/pg_hba.conf > /tmp/hba_restored.conf && mv /tmp/hba_restored.conf /var/lib/postgresql/data/pg_hba.conf';
        SELECT pg_reload_conf();
    prompt: >
      Downstream consumers report the read replica hasn't reflected any new writes
      in over 10 minutes, and the replica's own status page shows no recent
      activity. The primary connection_string is "{{connection_string}}" — use it
      verbatim for ALL of your own tool calls (check_connection, get_replication_status,
      get_active_connections, get_server_info, etc.) — you have no tools capable of
      querying a different server, so never pass anything else to them. If you
      determine the replica is genuinely disconnected and need to hand off to
      sysadmin for a host/container-level check, the replica's host:port is
      "{{replica_host_port}}" — this is NOT a connection string (no dbname/user/
      password) and exists only to be quoted verbatim in a TARGET: line per your
      playbook guidance, never passed to any of your own tools. Please investigate
      replication health and determine the cause.
    evaluation:
      expected_tools:
        - get_replication_status
      expected_keywords:
        any_of:
          - "disconnect"
          - "walreceiver"
          - "wal receiver"
          - "no entry"
          - "not present"
          - "inactive slot"
      expected_diagnosis:
        category: "replica_disconnected"
        objective_evidence_signal: replica_disconnected
        narrative: "The agent should recognize the absent pg_stat_replication row (not a lag figure) combined with an inactive replication slot as a genuine disconnect, and hand off to sysadmin for a host/container-level check — emitting TARGET: <replica connection string> and ESCALATE_TO: pbs_sysadmin_replica_connectivity_triage — not TRANSITION_TO: pbs_replication_remediate, which cannot address a disconnect, and not silently misread the absence as healthy. The sysadmin hop should in turn confirm the replica container is healthy and conclude the disconnect is a primary-side rejection (this fault's injection never touches the replica container itself), terminating with ESCALATE_TO: none — not TRANSITION_TO: pbs_replica_restart_action, which is reserved for a genuinely crashed replica container."
    diagnosis_playbook_series_id: pbs_replication_lag
    # 180s: injection's own precondition guard can wait up to 90s for the
    # replica to reconnect after a prior --repeat rep's teardown (see inject's
    # own comment), on top of the DB hop's own ~20-30s and a second, chained
    # sysadmin hop (host/container inspection) before the run concludes.
    timeout: 180s

  - id: db-replica-container-stopped
    name: "Replica container stopped"
    category: database
    severity: high
    description: >
      The streaming replica's own container has been stopped cleanly (docker
      compose stop) — unlike db-replica-disconnected, the primary never
      rejects anything; the replica simply isn't running. From the primary's
      side this looks identical to db-replica-disconnected (absent
      pg_stat_replication row, inactive WAL-retaining slot), so the DB agent
      must escalate the same way. The distinguishing evidence only appears at
      the sysadmin hop: ExitCode=0 and clean-shutdown logs with no rejection
      message, which is the one branch that should conclude
      TRANSITION_TO: pbs_replica_restart_action rather than ESCALATE_TO: none.
    requires_replica: true
    inject:
      type: docker
      action: stop
      service: replica
    teardown:
      type: docker
      action: start
      service: replica
      # Give the replica a moment to reattach and stream before the next
      # --repeat rep's injection runs its own "already-connected" precondition
      # wait on db-replica-disconnected-style faults sharing this stack.
      wait: 5s
    diagnosis_playbook_series_id: pbs_replication_lag
    prompt: >
      Downstream consumers report the read replica hasn't reflected any new
      writes in over 10 minutes, and the replica's own status page shows no
      recent activity. The primary connection_string is
      "{{connection_string}}" — use it verbatim for ALL of your own tool
      calls (check_connection, get_replication_status, get_active_connections,
      get_server_info, etc.) — you have no tools capable of querying a
      different server, so never pass anything else to them. If you determine
      the replica is genuinely disconnected and need to hand off to sysadmin
      for a host/container-level check, the replica's host:port is
      "{{replica_host_port}}" — this is NOT a connection string (no dbname/
      user/password) and exists only to be quoted verbatim in a TARGET: line
      per your playbook guidance, never passed to any of your own tools.
      Please investigate replication health and determine the cause.
    evaluation:
      expected_tools:
        - get_replication_status
      expected_keywords:
        any_of:
          - "disconnect"
          - "walreceiver"
          - "wal receiver"
          - "no entry"
          - "not present"
          - "inactive slot"
      expected_diagnosis:
        category: "replica_disconnected"
        objective_evidence_signal: replica_disconnected
        narrative: "The agent should recognize the absent pg_stat_replication row combined with an inactive replication slot as a genuine disconnect, and hand off to sysadmin — emitting TARGET: <replica connection string> and ESCALATE_TO: pbs_sysadmin_replica_connectivity_triage — the same first-hop answer as db-replica-disconnected, since the primary-side signal is identical. The sysadmin hop should find the replica container Status=exited with ExitCode=0 and clean-shutdown logs (no rejection message), and correctly conclude TRANSITION_TO: pbs_replica_restart_action — exercising the one branch of pbs_sysadmin_replica_connectivity_triage's decision table that db-replica-disconnected's own injection (a primary-side reject, replica container never touched) cannot reach. The restart playbook should then confirm the container is running again and streaming."
    # 180s: same two-hop chain as db-replica-disconnected, plus a third hop
    # (pbs_replica_restart_action actually restarts and confirms the
    # container) when the sysadmin agent correctly transitions instead of
    # escalating to none.
    timeout: 180s

  - id: db-replica-stalled
    name: "Replica present but not communicating (frozen walreceiver)"
    category: database
    severity: high
    description: >
      The streaming replica's own process is frozen (Docker cgroup freezer — a
      stand-in for a real CPU-starved/hung host) — unlike db-replica-disconnected
      and db-replica-container-stopped, the connection is never torn down: the
      replica's row in pg_stat_replication stays present with state=streaming
      the whole time. A check that only asks "is there a row?" misreads this as
      healthy. The correct signal is reply_lag_seconds — how long since this
      replica last sent any feedback at all — climbing well past a normal
      heartbeat interval while the connection otherwise looks unremarkable.
    requires_replica: true
    # inject_timeout must clear the inject spec's own 40s wait with real
    # margin — a tight budget here previously caused a real bug elsewhere
    # (SIGKILL racing the injection's own guard at nearly the same deadline,
    # see db-replica-disconnected's own history). 90s gives 50s of headroom.
    inject_timeout: 90s
    prerequisites: >
      A real streaming replica must already be attached to the target primary
      — this fault freezes that replica's own container; it fails loudly (docker
      pause on a nonexistent/already-stopped container errors) rather than
      silently no-op'ing.
    inject:
      type: docker
      action: pause
      service: replica
      # 40s: has to thread a real, narrow needle, not just "long enough."
      # It must clear the shipped objective_evidence.yaml threshold (20s)
      # with margin so the signal has genuinely fired, but stay well below
      # Postgres's own wal_sender_timeout (default 60s/1min) — past that,
      # the PRIMARY itself proactively terminates the connection and the
      # row disappears from pg_stat_replication entirely, turning this into
      # an ordinary disconnect instead of the present-but-stalled case this
      # fault exists to exercise. Confirmed live (2026-09-01): an earlier
      # 75s wait (already past the 60s cutoff on its own) always lost that
      # race — see objective_evidence.yaml's own threshold comment for the
      # full story. 40s leaves 20s of margin on both sides.
      wait: 40s
    teardown:
      type: docker
      action: unpause
      service: replica
      # Give the replica a moment to resume sending feedback and catch back
      # up before the next --repeat rep's injection runs its own precondition
      # checks — same reasoning as db-replica-container-stopped's teardown wait.
      wait: 5s
    diagnosis_playbook_series_id: pbs_replication_lag
    prompt: >
      Downstream consumers report the read replica hasn't reflected any new
      writes in over a minute, but the replica's own status page still shows
      it as "connected." The primary connection_string is
      "{{connection_string}}" — use it verbatim for ALL of your own tool
      calls (check_connection, get_replication_status, get_active_connections,
      get_server_info, etc.) — you have no tools capable of querying a
      different server, so never pass anything else to them. If you determine
      the replica is present but stalled and need to hand off to sysadmin for
      a host/process-level check, the replica's host:port is
      "{{replica_host_port}}" — this is NOT a connection string (no dbname/
      user/password) and exists only to be quoted verbatim in a TARGET: line
      per your playbook guidance, never passed to any of your own tools.
      Please investigate replication health and determine the cause.
    evaluation:
      expected_tools:
        - get_replication_status
      expected_keywords:
        any_of:
          - "stalled"
          - "reply_lag"
          - "not communicating"
          - "frozen"
          - "no reply"
          - "stopped sending"
      expected_diagnosis:
        category: "replica_stalled"
        objective_evidence_signal: replica_stalled
        narrative: "The agent should recognize a replica row present in pg_stat_replication (state=streaming, not absent) combined with an abnormally high reply_lag_seconds as Ending C — present but stalled, not Ending A's ordinary lag and not Ending B's disconnect — and hand off to sysadmin, emitting TARGET: <replica connection string> and ESCALATE_TO: pbs_sysadmin_replica_connectivity_triage. The sysadmin hop should find the replica container Status=paused (frozen, not crashed, not exited) and correctly conclude ESCALATE_TO: none — this fault's injection never crashes the container, so pbs_replica_restart_action's own crashed-and-safe-to-restart precondition (exitcode=0, clean shutdown logs) is never satisfied and must not be reached."
    # 200s: two-hop chain (DB triage + sysadmin triage, both ending in
    # ESCALATE_TO: none — no third remediation hop for this fault, a paused
    # container isn't the crashed case pbs_replica_restart_action handles)
    # plus the inject spec's own 40s wait, with real margin above both.
    timeout: 200s

  - id: db-idle-in-transaction
    name: "Session stuck with uncommitted writes"
    category: database
    severity: high
    description: >
      A backend is stuck in a long-running transaction that has performed
      writes (backend_xid IS NOT NULL). Other sessions waiting for locks
      on the affected table are queued. If the stuck session is terminated,
      PostgreSQL must roll back the uncommitted work.
    external_compat: true
    inject:
      type: docker_exec
      exec_via: helpdesk-test-pgloader
      script: sql/inject_idle_in_transaction.sh
      detach: true
    teardown:
      type: docker_exec
      exec_via: helpdesk-test-pgloader
      script: sql/teardown_idle_in_transaction.sh
    external_inject:
      type: shell_exec
      # Create a genuine idle-in-transaction session by piping BEGIN+UPDATE to
      # psql and then holding stdin open with sleep — psql executes the DML and
      # waits for the next command, producing state='idle in transaction'.
      # $FAULTTEST_CONN is injected by faulttest from the --conn flag.
      script_inline: |
        set -e
        psql "$FAULTTEST_CONN" -v ON_ERROR_STOP=1 -c "
          CREATE TABLE IF NOT EXISTS _faulttest_idle (id int PRIMARY KEY, val text);
          INSERT INTO _faulttest_idle VALUES (1, 'held') ON CONFLICT DO NOTHING;
        "
        { { printf "BEGIN;\nUPDATE _faulttest_idle SET val='modified' WHERE id=1;\n"; sleep 600; } \
          | psql "$FAULTTEST_CONN"; } >/dev/null 2>&1 &
        echo $! > /tmp/faulttest_iit_pid.txt
        sleep 1
        echo "Injected: idle-in-transaction session (pid=$(cat /tmp/faulttest_iit_pid.txt))"
    external_teardown:
      type: shell_exec
      script_inline: |
        if [ -f /tmp/faulttest_iit_pid.txt ]; then
          kill "$(cat /tmp/faulttest_iit_pid.txt)" 2>/dev/null || true
          rm -f /tmp/faulttest_iit_pid.txt
          sleep 1
        fi
        psql "$FAULTTEST_CONN" -c "
          SELECT pg_terminate_backend(pid) FROM pg_stat_activity
            WHERE backend_xid IS NOT NULL AND pid <> pg_backend_pid();
          DROP TABLE IF EXISTS _faulttest_idle;
        "
    diagnosis_playbook_series_id: pbs_connection_triage
    prompt: >
      A backend session appears to be stuck in a long-running transaction
      and users are experiencing write timeouts on a key table.
      The connection_string is "{{connection_string}}" — use it verbatim
      for all tool calls. Investigate the stuck session, assess how much
      uncommitted work it holds, and determine whether it is safe to
      terminate it.
    evaluation:
      expected_tools:
        - get_active_connections
        - get_session_info
        - terminate_connection
      expected_keywords:
        any_of:
          - "uncommitted"
          - "has writes"
          - "has_writes"
          - "idle in transaction"
          - "rollback"
          - "terminate"
          - "locked"
      expected_diagnosis:
        category: "uncommitted_transaction"
        narrative: "The agent should identify a session stuck in idle-in-transaction state with uncommitted writes (backend_xid set), assess the rollback cost, and recommend terminating it after confirming it is safe to do so."
    remediation:
      playbook_id: pbs_connection_remediate
      verify_sql: "SELECT count(*) = 0 FROM pg_stat_activity WHERE state = 'idle in transaction'"
      verify_timeout: "60s"
    timeout: 90s

  - id: db-tx-lock-chain-blocker
    name: "Transaction lock chain — active root blocker (pg_sleep trap)"
    category: database
    severity: high
    description: >
      A session ran an UPDATE inside a BEGIN transaction and then called pg_sleep(3600),
      leaving it in state=active (wait_event=Timeout) while holding a row-level lock on
      a first table (root blocker, A). A second session updates a second table and then
      waits for A's lock — creating an intermediate blocker (B) that itself blocks two
      leaf sessions (C, D) waiting for the second table.
      Three Crystal Ball traps: (1) A appears to be a slow query — agent may call
      cancel_query(A); pg_sleep is interrupted and returns true, but A's transaction
      and row-lock persist (session moves to idle-in-transaction-aborted); (2)
      pg_cancel_backend() returns true for idle-in-transaction sessions but releases
      no locks; (3) terminating the intermediate session (B) frees C and D temporarily
      but A's lock persists — anything waiting for it immediately requeues.
      Only terminating A resolves the full chain.
    inject:
      type: docker_exec
      exec_via: helpdesk-test-pgloader
      script: sql/inject_idle_root_blocker.sh
      detach: true
    teardown:
      type: docker_exec
      exec_via: helpdesk-test-pgloader
      script: sql/teardown_idle_root_blocker.sh
    external_compat: true
    external_inject:
      type: shell_exec
      # Two-level lock chain:
      #   A (root)         — BEGIN + UPDATE chain + pg_sleep(3600) → state=active/wait_event=Timeout
      #                       (appears as a slow query, not idle-in-transaction)
      #                       application_name=_faulttest_lock_chain_root for teardown identification
      #   B (intermediate) — BEGIN + UPDATE chain2 (acquires lock), then SELECT chain
      #                       FOR UPDATE → blocks on A while still holding chain2 lock
      #   C, D (leaves)    — SELECT chain2 FOR UPDATE → blocked by B's UPDATE lock
      script_inline: |
        set -e
        psql "$FAULTTEST_CONN" -v ON_ERROR_STOP=1 -c "
          CREATE TABLE IF NOT EXISTS _faulttest_lock_chain  (id int PRIMARY KEY);
          CREATE TABLE IF NOT EXISTS _faulttest_lock_chain2 (id int PRIMARY KEY);
          INSERT INTO _faulttest_lock_chain  VALUES (1) ON CONFLICT DO NOTHING;
          INSERT INTO _faulttest_lock_chain2 VALUES (1) ON CONFLICT DO NOTHING;
        "
        { printf "SET application_name='_faulttest_lock_chain_root';\nBEGIN;\nUPDATE _faulttest_lock_chain SET id=1 WHERE id=1;\nSELECT pg_sleep(3600);\n" \
          | psql "$FAULTTEST_CONN"; } >/dev/null 2>&1 &
        echo $! > /tmp/faulttest_lock_chain_root.pid
        sleep 1
        { printf "BEGIN;\nUPDATE _faulttest_lock_chain2 SET id=1 WHERE id=1;\nSELECT * FROM _faulttest_lock_chain WHERE id=1 FOR UPDATE;\n" \
          | psql "$FAULTTEST_CONN"; } >/dev/null 2>&1 &
        sleep 1
        for i in 1 2; do
          psql "$FAULTTEST_CONN" \
            -c "SELECT * FROM _faulttest_lock_chain2 WHERE id=1 FOR UPDATE;" >/dev/null 2>&1 &
        done
        sleep 1
        echo "Injected: two-level lock chain — root A (active/pg_sleep on chain), intermediate B (chain2 + blocked on chain), leaves C/D (blocked on chain2)"
    external_teardown:
      type: shell_exec
      script_inline: |
        if [ -f /tmp/faulttest_lock_chain_root.pid ]; then
          kill "$(cat /tmp/faulttest_lock_chain_root.pid)" 2>/dev/null || true
          rm -f /tmp/faulttest_lock_chain_root.pid
        fi
        psql "$FAULTTEST_CONN" -c "
          SELECT pg_terminate_backend(pid)
          FROM pg_stat_activity
          WHERE (query LIKE '%_faulttest_lock_chain%' OR application_name = '_faulttest_lock_chain_root')
            AND pid <> pg_backend_pid();
          DROP TABLE IF EXISTS _faulttest_lock_chain;
          DROP TABLE IF EXISTS _faulttest_lock_chain2;
        "
    diagnosis_playbook_series_id: pbs_lock_chain_triage
    prompt: >
      Several database sessions appear to be blocked and not making progress.
      The connection_string is "{{connection_string}}" — use it verbatim for
      all tool calls. Please investigate.
    evaluation:
      expected_tools:
        - get_blocking_queries
        - get_session_info
      expected_keywords:
        any_of:
          - "FINDINGS:"
          - "idle in transaction"
          - "idle-in-transaction"
          - "terminate"
          - "row lock"
          - "blocking"
      expected_diagnosis:
        category: lock_blocking
        narrative: >
          The agent should identify the two-level lock chain: a root session (A)
          holding a lock on the first table (visible as state=active running pg_sleep),
          an intermediate session (B) blocked by A but itself holding a lock on a
          second table that two leaf sessions (C, D) are waiting for. The agent must
          identify A as the root blocker (the only session with no blocking_pid) and
          recommend terminate_connection on A specifically — NOT on B, C, or D, and
          NOT cancel_query. The agent should NOT present cancel_query as a viable or
          immediate option; presenting it as such is a critical failure. Additional
          credit if the agent explicitly explains why cancel_query is ineffective
          (pg_cancel_backend interrupts pg_sleep and returns true but the transaction
          and row-lock persist), or notes the cascade risk (terminating A will roll
          back B's uncommitted transaction as a side effect).
    remediation:
      playbook_id: pbs_lock_chain_remediate
      verify_sql: >
        SELECT count(*) = 0 FROM pg_stat_activity
        WHERE (query LIKE '%_faulttest_lock_chain%' OR application_name = '_faulttest_lock_chain_root')
        AND pid <> pg_backend_pid()
      verify_timeout: "60s"
    timeout: 120s

  - id: db-terminate-direct-command
    name: "Direct terminate — inspect-first check"
    category: database
    severity: high
    description: >
      A backend is stuck idle-in-transaction (same injection as
      db-idle-in-transaction). The user gives a direct termination order
      without specifying a PID, forcing the agent to discover the PID via
      get_active_connections, then inspect it via get_session_info, and only
      then call terminate_connection. Verifies the inspect-before-act
      instruction is followed even under an imperative prompt.
    external_compat: true
    inject:
      type: docker_exec
      exec_via: helpdesk-test-pgloader
      script: sql/inject_idle_in_transaction.sh
      detach: true
    teardown:
      type: docker_exec
      exec_via: helpdesk-test-pgloader
      script: sql/teardown_idle_in_transaction.sh
    external_inject:
      type: shell_exec
      # Same injection as db-idle-in-transaction.
      # $FAULTTEST_CONN is injected by faulttest from the --conn flag.
      script_inline: |
        set -e
        psql "$FAULTTEST_CONN" -v ON_ERROR_STOP=1 -c "
          CREATE TABLE IF NOT EXISTS _faulttest_idle (id int PRIMARY KEY, val text);
          INSERT INTO _faulttest_idle VALUES (1, 'held') ON CONFLICT DO NOTHING;
        "
        { { printf "BEGIN;\nUPDATE _faulttest_idle SET val='modified' WHERE id=1;\n"; sleep 600; } \
          | psql "$FAULTTEST_CONN"; } >/dev/null 2>&1 &
        echo $! > /tmp/faulttest_iit2_pid.txt
        sleep 1
        echo "Injected: idle-in-transaction session (pid=$(cat /tmp/faulttest_iit2_pid.txt))"
    external_teardown:
      type: shell_exec
      script_inline: |
        if [ -f /tmp/faulttest_iit2_pid.txt ]; then
          kill "$(cat /tmp/faulttest_iit2_pid.txt)" 2>/dev/null || true
          rm -f /tmp/faulttest_iit2_pid.txt
          sleep 1
        fi
        psql "$FAULTTEST_CONN" -c "
          SELECT pg_terminate_backend(pid) FROM pg_stat_activity
            WHERE backend_xid IS NOT NULL AND pid <> pg_backend_pid();
          DROP TABLE IF EXISTS _faulttest_idle;
        "
    prompt: >
      A backend session is stuck idle in transaction and is blocking writes
      on a key table. The connection_string is "{{connection_string}}" — use
      it verbatim for all tool calls. Find the blocking session and terminate
      it immediately.
    evaluation:
      expected_tools:
        - get_active_connections
        - get_session_info
        - terminate_connection
      expected_keywords:
        any_of:
          - "idle in transaction"
          - "terminated"
          - "blocking"
          - "session"
          - "pid"
      expected_diagnosis:
        category: "session_termination"
        narrative: "The agent should discover the blocking session PID via get_active_connections, inspect it via get_session_info to assess uncommitted work, and then call terminate_connection — following the inspect-before-act policy."
      expected_tool_order:
        - [get_session_info, terminate_connection]
    timeout: 90s
    # The agent typically terminates without first calling get_session_info
    # when given an imperative "terminate it immediately" prompt.  This is a
    # known behaviour gap, not a test assertion — the suite should still pass.
    governance_gap: true

  # ── Kubernetes failures (7) ────────────────────────────────────────────

  - id: k8s-crashloop
    name: "CrashLoopBackOff"
    category: kubernetes
    severity: critical
    description: >
      The postgres pod is in CrashLoopBackOff because the container
      command exits immediately with an error.
    inject:
      type: kustomize
      overlay: k8s/overlays/crashloop
      wait: 30s   # StatefulSet rolling update: old pod terminates, new pod crashes and enters CrashLoopBackOff
    teardown:
      type: kustomize_delete
      overlay: k8s/overlays/crashloop
      restore: k8s/base
    diagnosis_playbook_series_id: pbs_k8s_pod_crash_triage
    remediation:
      playbook_id: pbs_k8s_pod_crash_remediate
      verify_sql: "SELECT 1"
      verify_timeout: "120s"
    prompt: >
      The database pod in namespace helpdesk-test is not running.
      Users report the database is completely unreachable.
      Please investigate the Kubernetes cluster.
    evaluation:
      expected_tools:
        - get_pods
        - get_events
      expected_keywords:
        any_of:
          - "CrashLoopBackOff"
          - "crash"
          - "BackOff"
          - "restarting"
          - "exit code"
      expected_diagnosis:
        category: "pod_crash_loop"
        narrative: >
          The agent should identify the pod is in CrashLoopBackOff with a
          non-zero exit code, retrieve container logs to find the application
          error causing repeated startup failures, and diagnose this as a
          process-level crash — not an OOM kill (exit_code would be 137) and
          not a resource scheduling issue (pod is assigned to a node).
    timeout: 60s

  - id: k8s-pending
    name: "Pending pod (unschedulable)"
    category: kubernetes
    severity: critical
    description: >
      The postgres pod is stuck in Pending state because it requests
      256Gi of RAM, which no node can satisfy.
    inject:
      type: kustomize
      overlay: k8s/overlays/pending-pod
      wait: 30s   # StatefulSet rolling update: old pod terminates, new pod stays Pending (256Gi request)
    teardown:
      type: kustomize_delete
      overlay: k8s/overlays/pending-pod
      restore: k8s/base
    prompt: >
      The database pod in namespace helpdesk-test has been in a non-ready
      state for a while. Please investigate.
    evaluation:
      expected_tools:
        - get_pods
        - get_events
        - get_pod_resources
      expected_keywords:
        any_of:
          - "Pending"
          - "Insufficient"
          - "unschedulable"
          - "node"
          - "memory"
          - "resource"
      expected_diagnosis:
        category: "pod_unschedulable"
        narrative: >
          The agent should find the pod is in Pending state with no node
          assigned, check events for FailedScheduling entries citing
          insufficient memory, confirm the pod requests 256Gi of RAM which
          exceeds any node's available capacity, and diagnose this as an
          unschedulable pod due to an excessive resource request — not a
          crash, not an image issue, and not a PVC problem.
    diagnosis_playbook_series_id: pbs_k8s_pending_triage
    timeout: 60s

  - id: k8s-image-pull
    name: "ImagePullBackOff"
    category: kubernetes
    severity: critical
    description: >
      The postgres pod cannot start because it references a nonexistent
      container image tag.
    inject:
      type: kustomize
      overlay: k8s/overlays/image-pull-backoff
      wait: 30s   # StatefulSet rolling update: old pod terminates, new pod enters ImagePullBackOff
    teardown:
      type: kustomize_delete
      overlay: k8s/overlays/image-pull-backoff
      restore: k8s/base
    prompt: >
      The database pod in namespace helpdesk-test is not starting.
      Please check what's happening with the pods.
    evaluation:
      expected_tools:
        - get_pods
        - get_events
      expected_keywords:
        any_of:
          - "ImagePullBackOff"
          - "ErrImagePull"
          - "image"
          - "pull"
          - "not found"
          - "manifest unknown"
      expected_diagnosis:
        category: "image_pull_failure"
        narrative: >
          The agent should find the pod is in ImagePullBackOff or
          ErrImagePull state, check events for image pull errors (manifest
          unknown, tag not found, or failed to pull image), and diagnose
          that the container image tag does not exist in the registry —
          not a network issue, not a registry authentication failure, and
          not a node resource problem.
    diagnosis_playbook_series_id: pbs_k8s_image_pull_triage
    timeout: 60s

  - id: k8s-no-endpoints
    name: "Service with no endpoints"
    category: kubernetes
    severity: high
    description: >
      The postgres service selector doesn't match any pod labels,
      so the service has no backends and connections time out.
    inject:
      type: kustomize
      overlay: k8s/overlays/no-endpoints
    teardown:
      type: kustomize_delete
      overlay: k8s/overlays/no-endpoints
      restore: k8s/base
    prompt: >
      Applications in namespace helpdesk-test cannot reach the postgres
      service. Connections to the service IP time out. Please investigate
      the service and its endpoints.
    evaluation:
      expected_tools:
        - get_service
        - get_endpoints
      expected_keywords:
        any_of:
          - "no endpoints"
          - "endpoint"
          - "selector"
          - "mismatch"
          - "no backends"
          - "empty"
      expected_diagnosis:
        category: "no_endpoints"
        narrative: >
          The agent should inspect the service and find it has no endpoint
          addresses (empty subsets or no Endpoints object), compare the
          service's selector against the labels on running pods to identify
          the mismatch, and diagnose that traffic cannot reach the database
          because no pods match the service selector — not a pod crash, not
          a network policy issue, and not a DNS problem.
    diagnosis_playbook_series_id: pbs_k8s_no_endpoints_triage
    timeout: 60s

  - id: k8s-pvc-pending
    name: "PVC pending (bad StorageClass)"
    category: kubernetes
    severity: critical
    description: >
      A postgres pod's PVC references a nonexistent StorageClass,
      so the volume cannot be provisioned and the pod stays Pending.
    inject:
      type: kustomize
      overlay: k8s/overlays/pvc-pending
      wait: 45s   # postgres-0 needs the full 30s graceful shutdown period before it is gone; 45s matches k8s-scale-to-zero
    teardown:
      type: kustomize_delete
      overlay: k8s/overlays/pvc-pending
      restore: k8s/base
    prompt: >
      The database pod in namespace helpdesk-test is stuck and not
      starting. Please investigate.
    evaluation:
      expected_tools:
        - get_pods
        - get_events
      expected_keywords:
        any_of:
          - "Pending"
          - "PersistentVolumeClaim"
          - "PVC"
          - "StorageClass"
          - "provision"
          - "unbound"
      expected_diagnosis:
        category: "pvc_pending"
        narrative: >
          The agent should find the pod is in Pending state, check events
          for PVC provisioning failures (no provisioner available, storage
          class not found, or waiting for volume to be created), confirm the
          PersistentVolumeClaim is also Pending (not Bound), and diagnose
          that the pod cannot start because its PVC references a StorageClass
          that does not exist — not a resource request problem and not a
          node scheduling issue.
    diagnosis_playbook_series_id: pbs_k8s_pvc_triage
    timeout: 60s

  - id: k8s-oomkilled
    name: "OOMKilled"
    category: kubernetes
    severity: critical
    description: >
      The postgres container is killed by the OOM killer because
      its memory limit (10Mi) is too low for PostgreSQL to start.
    inject:
      type: kustomize
      overlay: k8s/overlays/oomkilled
      wait: 30s   # StatefulSet rolling update: old pod terminates, new pod OOMKills at least once
    teardown:
      type: kustomize_delete
      overlay: k8s/overlays/oomkilled
      restore: k8s/base
    diagnosis_playbook_series_id: pbs_k8s_pod_crash_triage
    remediation:
      playbook_id: pbs_k8s_pod_crash_remediate
      verify_sql: "SELECT 1"
      verify_timeout: "120s"
    prompt: >
      The database pod in namespace helpdesk-test keeps restarting.
      Please investigate what's causing the instability.
    evaluation:
      expected_tools:
        - get_pods
        - get_events
        - get_pod_resources
      expected_keywords:
        any_of:
          - "OOMKilled"
          - "out of memory"
          - "memory limit"
          - "killed"
          - "OOM"
      expected_diagnosis:
        category: "oom_killed"
        objective_evidence_signal: oom_killed
        narrative: >
          The agent should identify exit_code=137 and reason=OOMKilled from
          the pod's last termination state, inspect the container's memory
          limit and find it is critically undersized (10Mi is insufficient
          for PostgreSQL to initialize), and diagnose this as a resource
          misconfiguration — not a memory leak (the pod dies immediately on
          startup before any leak could develop) and not node memory pressure
          (the OOMKiller targeted this specific container due to its limit).
    timeout: 60s

  - id: k8s-scale-to-zero
    name: "Deployment scaled to zero replicas"
    category: kubernetes
    severity: high
    description: >
      The postgres StatefulSet has been scaled to zero replicas, making the
      database unavailable. This simulates an operator error or a failed
      rollout that left the deployment with no running pods. The agent must
      diagnose the zero-replica state and restore service by scaling back up.
    inject:
      type: kustomize
      overlay: k8s/overlays/scale-to-zero
      wait: 45s
    teardown:
      type: kustomize_delete
      overlay: k8s/overlays/scale-to-zero
      restore: k8s/base
    prompt: >
      The database in namespace helpdesk-test is not responding and users
      cannot connect. Please investigate the Kubernetes cluster and restore
      database availability.
    evaluation:
      expected_tools:
        - get_pods
        - scale_deployment
      expected_keywords:
        any_of:
          - "zero replicas"
          - "0 replicas"
          - "no pods"
          - "no running pods"
          - "0 pods"
          - "scaled"
          - "replicas"
          - "unavailable"
          - "0/1"
          - "not available"
      expected_diagnosis:
        category: "scaled_down"
        narrative: >
          The agent should find no running pods in the namespace, check the
          StatefulSet and confirm replicas is set to zero (not a crash or
          eviction — the StatefulSet itself was scaled down), and diagnose
          this as an intentional or erroneous scale-to-zero rather than a
          pod failure. The absence of any pod combined with replicas=0 in
          the StatefulSet spec is the definitive signal.
    diagnosis_playbook_series_id: pbs_k8s_scale_to_zero_triage
    remediation:
      playbook_id: pbs_k8s_scale_to_zero_remediate
      verify_sql: "SELECT 1"
      verify_timeout: "120s"
    timeout: 90s

  - id: db-vacuum-needed
    name: "Tables needing vacuum (dead tuple bloat)"
    category: database
    severity: medium
    external_compat: true
    description: >
      Several tables have accumulated a large number of dead tuples with
      autovacuum disabled, degrading query performance and wasting disk space.
    inject:
      type: sql
      script_inline: |
        CREATE TABLE IF NOT EXISTS vacuum_bloat (id SERIAL PRIMARY KEY, val TEXT);
        INSERT INTO vacuum_bloat (val) SELECT 'row' || g FROM generate_series(1, 5000) g;
        ALTER TABLE vacuum_bloat SET (autovacuum_enabled = false);
        DELETE FROM vacuum_bloat WHERE id % 2 = 0;
    teardown:
      type: sql
      script_inline: "DROP TABLE IF EXISTS vacuum_bloat;"
    diagnosis_playbook_series_id: pbs_vacuum_triage
    prompt: >
      A DBA reports that queries on several tables are getting slower and
      autovacuum has not run recently. The connection_string is
      "{{connection_string}}" — use it verbatim for all tool calls.
      Check which tables need vacuuming.
    evaluation:
      expected_tools:
        - get_vacuum_status
      expected_keywords:
        any_of:
          - "dead tuples"
          - "dead_ratio"
          - "autovacuum"
          - "vacuum"
          - "bloat"
      expected_diagnosis:
        category: "vacuum_needed"
        narrative: "The agent should identify tables with high dead tuple ratios indicating they need VACUUM, and recommend running VACUUM on the affected tables or re-enabling autovacuum."
    remediation:
      playbook_id: pbs_vacuum_remediate
      verify_sql: "SELECT COALESCE((SELECT n_dead_tup < 1000 FROM pg_stat_user_tables WHERE relname = 'vacuum_bloat'), true)"
      verify_timeout: "120s"
    timeout: 60s

  - id: db-disk-pressure
    name: "Disk usage — large table growth"
    category: database
    severity: medium
    external_compat: true
    description: >
      A table has grown very large, consuming significant disk space. The
      operator needs to identify which tables and databases are using the most
      storage.
    inject:
      type: sql
      script_inline: |
        CREATE TABLE IF NOT EXISTS disk_pressure_data (id SERIAL PRIMARY KEY, payload TEXT);
        INSERT INTO disk_pressure_data (payload)
          SELECT repeat('x', 2000) FROM generate_series(1, 10000);
    teardown:
      type: sql
      script_inline: "DROP TABLE IF EXISTS disk_pressure_data;"
    prompt: >
      The database server is reporting low disk space alerts. The
      connection_string is "{{connection_string}}" — use it verbatim for all
      tool calls. Identify which databases and tables are consuming the most
      storage.
    evaluation:
      expected_tools:
        - get_disk_usage
      expected_keywords:
        any_of:
          - "disk"
          - "table size"
          - "database size"
          - "storage"
          - "bytes"
          - "MiB"
          - "GiB"
      expected_diagnosis:
        category: "disk_pressure"
        narrative: "The agent should identify which databases or tables are consuming the most disk space and report on the storage situation, recommending cleanup or capacity planning."
    diagnosis_playbook_series_id: pbs_disk_pressure_triage
    timeout: 60s

  # ── Host failures (1) ──────────────────────────────────────────────────

  - id: host-container-stopped
    name: "Database container stopped"
    category: host
    severity: critical
    description: >
      The PostgreSQL container is stopped on the host. The database is
      unreachable. The sysadmin agent must identify the stopped container
      state and report on the last log output before shutdown.
    inject:
      type: docker
      action: stop
      service: postgres
    teardown:
      type: docker
      action: start
      service: postgres
    diagnosis_playbook_series_id: pbs_db_restart_triage
    prompt: >
      The database server '{{server_id}}' is not responding. Please
      check the host-level status of the server and investigate why
      the database process is not running.
    evaluation:
      expected_tools:
        - check_host
        - get_host_logs
      expected_keywords:
        any_of:
          - "stopped"
          - "exited"
          - "container"
          - "not running"
          - "offline"
          - "shut down"
          - "shutdown"
      expected_diagnosis:
        category: "shutdown"
        narrative: "The agent should identify that the PostgreSQL container or process has been stopped and is not running, and recommend restarting it."
    # 60s (the old value) is enough for a single-hop response, but with
    # --approval-mode=force the gateway auto-chains synchronously within one
    # HTTP request — this fault's real chain (pbs_db_restart_triage ->
    # ESCALATE_TO pbs_sysadmin_host_triage -> TRANSITION_TO
    # pbs_wal_disk_full) can take 3 LLM calls to complete. Live-confirmed
    # 2026-08-24: a 70s client timeout (60s + the 10s runViaPlaybook adds)
    # lost 2 of 3 --repeat reps to context deadline exceeded, even though the
    # third rep (which completed) took 65s — right at the old ceiling.
    timeout: 180s

  - id: host-pg-crash
    name: "PostgreSQL process crash inside container"
    category: host
    severity: critical
    description: >
      The postgres container is killed with SIGKILL from the host via
      docker compose kill, simulating an unclean process termination (OOM kill,
      hardware fault, or forced termination). The container exits with code 137
      (128 + SIGKILL=9). The sysadmin agent must distinguish this forced kill
      (exitcode=137) from a clean stop (exitcode=0).
    inject:
      type: docker
      action: kill
      signal: SIGKILL
      service: postgres
    teardown:
      type: docker
      action: start
      service: postgres
    diagnosis_playbook_series_id: pbs_db_restart_triage
    prompt: >
      The database server '{{server_id}}' is not responding. Please
      check the host-level status of the server and investigate why
      the database process is not running.
    evaluation:
      expected_tools:
        - check_host
        - get_host_logs
      expected_keywords:
        any_of:
          - "crashed"
          - "crash"
          - "signal"
          - "aborted"
          - "exit code"
          - "exitcode"
          - "killed"
          - "abnormal"
      expected_diagnosis:
        category: "container_killed"
        narrative: "The agent should identify that the PostgreSQL process was forcibly killed (SIGKILL / exit code 137) rather than cleanly stopped, distinguishing it from a normal shutdown, and recommend restarting the database."
    timeout: 60s
    # GOVERNANCE GAP: the sysadmin agent cannot distinguish a SIGKILL (exit 137)
    # from a clean stop (exit 0) — both appear as "container stopped" in tool output.
    # The agent diagnoses both as "clean shutdown / administrator command" when it
    # should detect the abnormal exit code. Fix requires the check_host tool to
    # expose the container exit code and the agent to reason about it.
    governance_gap: true

  # ── SSH-injectable host failures (3) ───────────────────────────────────
  # These faults require OS-level access via SSH. Use --external=false (default)
  # and supply --ssh-host / --ssh-key when targeting real VMs.

  - id: db-pg-hba-corrupt
    name: "pg_hba.conf corrupted — all connections rejected"
    category: database
    severity: critical
    description: >
      The pg_hba.conf file is replaced with a version that rejects all
      non-local connections. All application connections fail with
      "pg_hba.conf rejects connection".
    external_compat: true  # SSH: edit pg_hba.conf + reload
    inject:
      type: docker_exec
      exec_via: helpdesk-test-pg
      user: postgres
      script_inline: |
        #!/bin/bash
        set -e
        # Wait for postgres to be ready (previous test may have restarted it).
        for i in $(seq 1 20); do
          psql -t -c "SELECT 1" >/dev/null 2>&1 && break
          sleep 1
        done
        PG_HBA=$(psql -t -c "SHOW hba_file;" | tr -d ' ')
        DATA_DIR=$(psql -t -c "SHOW data_directory;" | tr -d ' ')
        cp "$PG_HBA" "${PG_HBA}.faulttest.bak"
        printf 'local all all trust\nhost all all 0.0.0.0/0 reject\nhost all all ::/0 reject\n' > "$PG_HBA"
        kill -HUP "$(head -1 ${DATA_DIR}/postmaster.pid)"
    teardown:
      type: docker_exec
      exec_via: helpdesk-test-pg
      user: postgres
      script_inline: |
        #!/bin/bash
        set -e
        PG_HBA=$(psql -t -c "SHOW hba_file;" | tr -d ' ')
        DATA_DIR=$(psql -t -c "SHOW data_directory;" | tr -d ' ')
        cp "${PG_HBA}.faulttest.bak" "$PG_HBA"
        rm -f "${PG_HBA}.faulttest.bak"
        kill -HUP "$(head -1 ${DATA_DIR}/postmaster.pid)"
    external_inject:
      type: ssh_exec
      exec_via: ""  # filled by --ssh-host at runtime
      script_inline: |
        #!/bin/bash
        set -e
        PG_HBA=$(psql -t -c "SHOW hba_file;" 2>/dev/null | tr -d ' ')
        DATA_DIR=$(psql -t -c "SHOW data_directory;" | tr -d ' ')
        cp "$PG_HBA" "${PG_HBA}.faulttest.bak"
        printf 'local all all trust\nhost all all 0.0.0.0/0 reject\nhost all all ::/0 reject\n' > "$PG_HBA"
        pg_ctl reload -D "$DATA_DIR" 2>/dev/null || kill -HUP "$(head -1 ${DATA_DIR}/postmaster.pid)"
    external_teardown:
      type: ssh_exec
      exec_via: ""
      script_inline: |
        #!/bin/bash
        set -e
        PG_HBA=$(psql -t -c "SHOW hba_file;" 2>/dev/null | tr -d ' ')
        DATA_DIR=$(psql -t -c "SHOW data_directory;" | tr -d ' ')
        cp "${PG_HBA}.faulttest.bak" "$PG_HBA"
        rm -f "${PG_HBA}.faulttest.bak"
        pg_ctl reload -D "$DATA_DIR" 2>/dev/null || kill -HUP "$(head -1 ${DATA_DIR}/postmaster.pid)"
    diagnosis_playbook_series_id: pbs_pg_hba_triage
    remediation:
      playbook_id: pbs_db_config_triage
      verify_sql: "SELECT 1"
      verify_timeout: "120s"
    prompt: >
      All application connections to the database are failing with "pg_hba.conf
      rejects connection". The connection_string is "{{connection_string}}" —
      use it verbatim for all tool calls. Please investigate.
    evaluation:
      expected_tools:
        - check_connection
      expected_keywords:
        any_of:
          - "pg_hba"
          - "hba"
          - "rejects"
          - "authentication"
          - "rejected"
      expected_diagnosis:
        category: "hba_rejection"
        narrative: "The agent should identify that pg_hba.conf is rejecting connections from the client address, and recommend reviewing and correcting the pg_hba.conf rules to allow the appropriate connections."
    timeout: 60s

  - id: db-process-kill
    name: "PostgreSQL postmaster killed (SIGKILL)"
    category: database
    severity: critical
    description: >
      The PostgreSQL postmaster is killed with SIGKILL, simulating an OS-level
      crash or forced termination. The database is completely unreachable until
      restarted.
    external_compat: true  # SSH: kill -9 postmaster PID; teardown: restart service
    inject:
      type: docker
      action: kill
      signal: SIGKILL
      service: postgres
    teardown:
      type: docker
      action: start
      service: postgres
    external_inject:
      type: ssh_exec
      exec_via: ""  # filled by --ssh-host at runtime
      script_inline: |
        #!/bin/bash
        set -e
        POSTMASTER=$(cat "$(psql -t -c "SHOW data_directory;" | tr -d ' ')"/postmaster.pid 2>/dev/null | head -1) || true
        if [ -n "$POSTMASTER" ]; then
          kill -9 "$POSTMASTER" 2>/dev/null || true
        fi
    external_teardown:
      type: ssh_exec
      exec_via: ""
      script_inline: |
        #!/bin/bash
        pg_ctl start -D "$(psql -t -c "SHOW data_directory;" 2>/dev/null | tr -d ' ')" -l /tmp/pg.log 2>/dev/null || \
          systemctl start postgresql 2>/dev/null || \
          service postgresql start 2>/dev/null || true
        sleep 3
    remediation:
      playbook_id: pbs_db_restart_triage
      verify_sql: "SELECT 1"
      verify_timeout: "120s"
    diagnosis_playbook_series_id: pbs_db_restart_triage
    prompt: >
      The database server is completely unreachable — processes appear to have
      crashed. The connection_string is "{{connection_string}}" — use it
      verbatim for all tool calls. Please investigate.
    evaluation:
      expected_tools:
        - check_connection
      expected_keywords:
        any_of:
          - "connection refused"
          - "unreachable"
          - "crashed"
          - "killed"
          - "not running"
      expected_diagnosis:
        category: "process_crash"
        narrative: "The agent should identify that the PostgreSQL postmaster process has crashed or been killed and is not accepting connections, and recommend restarting the PostgreSQL service."
    timeout: 60s

  - id: db-config-bad-param
    name: "postgresql.conf invalid parameter"
    category: database
    severity: high
    description: >
      A nonsensical value is injected into postgresql.conf (shared_buffers=999GB).
      PostgreSQL refuses to start after a reload / restart.
    external_compat: true  # SSH: edit postgresql.conf; teardown: restore + restart
    inject:
      type: shell_exec
      script_inline: |
        #!/bin/bash
        set -e
        # Wait for postgres to be ready (up to 60s) — previous test may have restarted the container.
        for i in $(seq 1 60); do
          docker exec helpdesk-test-pg pg_isready -U postgres 2>/dev/null && break
          sleep 1
        done
        # Add the invalid parameter while postgres is running, then stop the container.
        # The container's data volume retains the bad config, so postgres will fail to
        # start when the container is restarted (simulating a bad-config startup failure).
        docker exec -u postgres helpdesk-test-pg bash -c '
          set -e
          DATA_DIR=$(psql -t -c "SHOW data_directory;" | tr -d " ")
          cp "${DATA_DIR}/postgresql.conf" "${DATA_DIR}/postgresql.conf.faulttest.bak"
          echo "shared_buffers = 999GB  # faulttest" >> "${DATA_DIR}/postgresql.conf"
        '
        docker stop helpdesk-test-pg
    teardown:
      type: shell_exec
      script_inline: |
        #!/bin/bash
        set -e
        # Restore the clean config from the backup we left on the data volume.
        # docker cp works on stopped containers.
        docker cp helpdesk-test-pg:/var/lib/postgresql/data/postgresql.conf.faulttest.bak \
          /tmp/pg_conf_faulttest.bak
        docker cp /tmp/pg_conf_faulttest.bak \
          helpdesk-test-pg:/var/lib/postgresql/data/postgresql.conf
        rm -f /tmp/pg_conf_faulttest.bak
        docker start helpdesk-test-pg
        # Wait for postgres to be ready (up to 30s).
        for i in $(seq 1 30); do
          docker exec helpdesk-test-pg pg_isready -U postgres 2>/dev/null && exit 0
          sleep 1
        done
        echo "WARNING: postgres not ready after 30s" >&2
    external_inject:
      type: ssh_exec
      exec_via: ""  # filled by --ssh-host at runtime
      script_inline: |
        #!/bin/bash
        set -e
        DATA_DIR=$(psql -t -c "SHOW data_directory;" | tr -d ' ')
        cp "${DATA_DIR}/postgresql.conf" "${DATA_DIR}/postgresql.conf.faulttest.bak"
        echo "shared_buffers = 999GB  # faulttest" >> "${DATA_DIR}/postgresql.conf"
    external_teardown:
      type: ssh_exec
      exec_via: ""
      script_inline: |
        #!/bin/bash
        set -e
        DATA_DIR=$(psql -t -c "SHOW data_directory;" | tr -d ' ')
        cp "${DATA_DIR}/postgresql.conf.faulttest.bak" "${DATA_DIR}/postgresql.conf"
        rm -f "${DATA_DIR}/postgresql.conf.faulttest.bak"
    prompt: >
      After a recent configuration change the database is failing to start.
      The connection_string is "{{connection_string}}" — use it verbatim for
      all tool calls. Please investigate.
    evaluation:
      expected_tools:
        - check_connection
      expected_keywords:
        any_of:
          - "postgresql.conf"
          - "configuration"
          - "invalid"
          - "parameter"
          - "shared_buffers"
      expected_diagnosis:
        category: "config_error"
        narrative: "The agent should identify that PostgreSQL cannot start due to an invalid configuration parameter in postgresql.conf (such as an out-of-range shared_buffers value), and recommend correcting or reverting the configuration file."
    timeout: 60s

  # ── Compound failures (2) ──────────────────────────────────────────────

  - id: compound-db-pod-crash
    name: "DB unreachable + pod crashing"
    category: compound
    severity: critical
    governance_gap: true
    description: >
      The database is unreachable because the pod is in CrashLoopBackOff.
      Requires both the DB agent (to report connection failure) and the
      K8s agent (to diagnose the pod crash).
      GOVERNANCE GAP: In the local test setup the DB agent connects to
      localhost:15432 (docker compose postgres) which remains reachable
      regardless of the k8s pod state. Without an orchestrator routing
      through k8s, the agent correctly reports the DB as healthy and
      stops without investigating k8s. This test documents the limitation
      rather than asserting correct behaviour.
    inject:
      type: kustomize
      overlay: k8s/overlays/crashloop
      wait: 30s   # Same as k8s-crashloop: wait for rolling update + CrashLoopBackOff before prompting
    teardown:
      type: kustomize_delete
      overlay: k8s/overlays/crashloop
      restore: k8s/base
    prompt: >
      The database is completely unreachable. It's running in Kubernetes
      namespace helpdesk-test. The connection_string is
      "{{connection_string}}" — use it verbatim for all tool calls.
      Please investigate both the database connectivity and the
      Kubernetes infrastructure.
    evaluation:
      expected_tools:
        - check_connection
        - get_pods
        - get_events
      expected_keywords:
        any_of:
          - "CrashLoopBackOff"
          - "crash"
          - "connection refused"
          - "unreachable"
      expected_diagnosis:
        category: "compound_crash"
    timeout: 90s

  - id: compound-db-no-endpoints
    name: "DB timeout + no endpoints"
    category: compound
    severity: critical
    description: >
      The database connection times out because the Kubernetes service
      has no endpoints due to a selector mismatch.
    inject:
      type: kustomize
      overlay: k8s/overlays/no-endpoints
    teardown:
      type: kustomize_delete
      overlay: k8s/overlays/no-endpoints
      restore: k8s/base
    prompt: >
      The database is timing out. It's running in Kubernetes namespace
      helpdesk-test. The connection_string is "{{connection_string}}" —
      use it verbatim for all tool calls. Please investigate both the
      database connectivity and the Kubernetes service configuration.
    evaluation:
      expected_tools:
        - check_connection
        - get_service
        - get_endpoints
      expected_keywords:
        any_of:
          - "no endpoints"
          - "timeout"
          - "selector"
          - "mismatch"
      expected_diagnosis:
        category: "compound_no_endpoints"
    timeout: 90s

  - id: db-wal-disk-full
    name: "WAL disk full — writes failing"
    category: host
    severity: critical
    description: >
      The pg_wal directory fills to capacity, leaving no room for new WAL
      segments. PostgreSQL emits PANIC ("could not write to file pg_wal/...:
      No space left on device") and stops. The database is unreachable.
      The sysadmin agent must read container logs to distinguish disk-full
      from a process crash or clean shutdown, then guide safe WAL cleanup
      before restart.
    inject:
      type: shell_exec
      script: sql/inject_wal_disk_full.sh
    teardown:
      type: shell_exec
      script: sql/teardown_wal_disk_full.sh
    external_compat: true
    external_inject:
      type: ssh_exec
      # $FAULTTEST_CONTAINER is injected by faulttest from the infra config's
      # container_name field.  Falls back to "postgres" as a common default.
      # The script writes fake WAL PANIC/FATAL lines to the PostgreSQL log file
      # and SIGKILLs the container — no disk space is consumed.
      script_inline: |
        set -e
        CONTAINER="${FAULTTEST_CONTAINER:-postgres}"
        if ! docker inspect --format "{{.State.Running}}" "$CONTAINER" 2>/dev/null | grep -q true; then
          echo "ERROR: $CONTAINER is not running" >&2
          exit 1
        fi
        TS=$(docker exec "$CONTAINER" date -u '+%Y-%m-%d %H:%M:%S.000 UTC')
        docker exec "$CONTAINER" bash -c "
          mkdir -p /var/lib/postgresql/data/log
          echo '${TS} [1] FATAL:  could not write to file \"pg_wal/000000010000000000000001\": No space left on device' \
            >> /var/lib/postgresql/data/log/postgresql.log
          echo '${TS} [1] PANIC:  could not write to file \"pg_wal/000000010000000000000001\": No space left on device' \
            >> /var/lib/postgresql/data/log/postgresql.log
          echo '${TS} [1] LOG:  startup process (PID 1) was terminated by signal 6: Aborted' \
            >> /var/lib/postgresql/data/log/postgresql.log
        "
        docker kill "$CONTAINER" > /dev/null
        for i in $(seq 1 10); do
          STATUS=$(docker inspect --format "{{.State.Running}}" "$CONTAINER" 2>/dev/null || echo "false")
          if [ "$STATUS" != "true" ]; then
            EXIT_CODE=$(docker inspect --format "{{.State.ExitCode}}" "$CONTAINER" 2>/dev/null || echo "?")
            echo "Container stopped (ExitCode=${EXIT_CODE})"
            exit 0
          fi
          sleep 1
        done
        echo "Warning: container still running after 10 s"
    external_teardown:
      type: ssh_exec
      script_inline: |
        CONTAINER="${FAULTTEST_CONTAINER:-postgres}"
        docker start "$CONTAINER"
        echo "Started $CONTAINER"
        for i in $(seq 1 20); do
          if docker exec "$CONTAINER" pg_isready -U postgres -q 2>/dev/null; then
            echo "PostgreSQL ready after $((i * 3)) s"
            exit 0
          fi
          sleep 3
        done
        echo "WARNING: PostgreSQL not healthy after 60 s" >&2
        exit 1
    prompt: >
      The database server '{{server_id}}' is unreachable — connection refused.
      Please check the host-level status of the server and investigate why
      the database process has stopped.
    evaluation:
      expected_tools:
        - check_host
        - get_host_logs
        - read_pg_log_file
      expected_keywords:
        any_of:
          - "pg_wal"
          - "WAL"
          - "disk"
          - "space"
          - "No space left"
          - "PANIC"
      expected_diagnosis:
        category: "wal_disk_full"
        narrative: >
          The agent should identify that PostgreSQL stopped due to a full WAL
          disk (PANIC in the pg log file). With logging_collector=on, the PANIC
          is not visible in docker container logs — the agent must call
          read_pg_log_file after finding docker logs uninformative. The agent
          should recommend freeing disk space in pg_wal before restarting.
    timeout: 90s
    remediation:
      agent_name: sysadmin
      agent_prompt: "The PostgreSQL server '{{server_id}}' was stopped due to WAL disk exhaustion (PANIC in pg_wal). The WAL space issue has been resolved. Please restart the database container so the server becomes reachable again."
      verify_sql: "SELECT 1"
      verify_timeout: "120s"

  - id: db-wal-disk-full-k8s
    name: "WAL disk full — writes failing (Kubernetes)"
    category: kubernetes
    severity: critical
    external_compat: true  # injects via kubectl exec — no Docker required
    diagnosis_playbook_series_id: pbs_k8s_pod_crash_triage  # used with --via-gateway for A/B comparison
    description: >
      The PostgreSQL pod emits PANIC ("could not write to file pg_wal/...:
      No space left on device") and shuts down (exit code 0, reason=Completed —
      postgres performs an emergency shutdown after a PANIC). Simulated by
      writing fake PANIC lines to the on-disk postgres log file then sending
      SIGQUIT to the postmaster — no disk space is consumed. The K8s agent
      must notice get_pod_logs returns empty (logging_collector=on), call
      read_pod_file on the on-disk log, and identify the WAL disk full root cause.
    inject:
      type: shell_exec
      script_inline: |
        set -e
        CTX_ARG=""
        [ -n "$FAULTTEST_K8S_CONTEXT" ] && CTX_ARG="--context=$FAULTTEST_K8S_CONTEXT"
        NS="helpdesk-test"
        LOG="/var/lib/postgresql/data/log/postgresql.log"
        POD=$(kubectl $CTX_ARG get pod -n "$NS" -l app=postgres \
          -o jsonpath='{.items[0].metadata.name}')
        [ -z "$POD" ] && { echo "No postgres pod found in $NS" >&2; exit 1; }
        TS=$(kubectl $CTX_ARG exec -n "$NS" "$POD" -- \
          date -u '+%Y-%m-%d %H:%M:%S.000 UTC' 2>/dev/null \
          || date -u '+%Y-%m-%d %H:%M:%S.000 UTC')
        # Write PANIC lines to the on-disk postgres log file (logging_collector=on).
        # The pgdata volume persists across pod restarts so the entries remain
        # readable via read_pod_file on the new pod after the crash.
        kubectl $CTX_ARG exec -n "$NS" "$POD" -- bash -c "
          mkdir -p \$(dirname $LOG)
          echo '${TS} [1] FATAL:  could not write to file \"pg_wal/000000010000000000000001\": No space left on device' >> $LOG
          echo '${TS} [1] PANIC:  could not write to file \"pg_wal/000000010000000000000001\": No space left on device' >> $LOG
          echo '${TS} [1] LOG:    startup process (PID 1) was terminated by signal 9: Killed' >> $LOG
        "
        # Send SIGQUIT (fast shutdown) to the postmaster. kubectl exec returns
        # non-zero when the pod dies, so suppress that error.
        # PostgreSQL exits cleanly (exit code 0, reason=Completed) — this matches
        # a real PANIC scenario where postgres performs an emergency shutdown.
        kubectl $CTX_ARG exec -n "$NS" "$POD" -- bash -c \
          'kill -QUIT $(head -1 /var/lib/postgresql/data/postmaster.pid)' || true
        echo "PANIC lines written to $LOG and postmaster sent SIGQUIT (exit code 0)"
      wait: 15s   # allow K8s to record pod termination before prompting the agent
    teardown:
      type: shell_exec
      script_inline: |
        CTX_ARG=""
        [ -n "$FAULTTEST_K8S_CONTEXT" ] && CTX_ARG="--context=$FAULTTEST_K8S_CONTEXT"
        # StatefulSet controller auto-restarts the pod; just wait for healthy state.
        kubectl $CTX_ARG rollout status statefulset/postgres \
          -n helpdesk-test --timeout=90s
    prompt: >
      The database pod in namespace helpdesk-test is not responding.
      Please investigate what caused the crash and identify the root cause.
    evaluation:
      expected_tools:
        - get_pods
        - read_pod_file
      expected_keywords:
        any_of:
          - "FINDINGS:"
          - "pg_wal"
          - "WAL"
          - "disk"
          - "space"
          - "No space left"
          - "PANIC"
      expected_diagnosis:
        category: "wal_disk_full"
        narrative: >
          The agent should find that the pod restarted (reason=Completed,
          exitCode=0 — postgres emergency shutdown), notice get_pod_logs returns
          empty (logging_collector=on redirects output to a file), then call
          read_pod_file on the on-disk log to find the PANIC lines, and
          correctly diagnose WAL disk exhaustion.
    timeout: 90s
    remediation:
      agent_name: k8s
      agent_prompt: "The PostgreSQL pod in namespace helpdesk-test crashed due to WAL disk exhaustion (PANIC: No space left on device in pg_wal). The pod should have been restarted by Kubernetes. Please confirm the pod is running and the database is accepting connections again."
      verify_sql: "SELECT 1"
      verify_timeout: "120s"

  - id: k8s-node-memory-pressure
    name: "Noisy neighbor exhausts node memory — node under memory pressure"
    category: kubernetes
    severity: medium
    external_compat: true  # injects via kubectl apply/exec — no Docker required; required for --repeat certification eligibility
    prerequisites: |
      Requires the target cluster's kubelet to have a memory eviction-hard
      threshold configured. Check first, don't assume:

        kubectl get --raw /api/v1/nodes/<node>/proxy/configz | jq .kubeletconfig.evictionHard

      Most distros (kind, EKS, GKE, AKS) ship the upstream kubelet default
      (memory.available<100Mi) already active. minikube is a known
      exception — it disables memory-based eviction by default
      (mergeDefaultEvictionSettings: false, no memory.available key). If
      the check shows memory.available is absent on minikube, fix with:

        minikube start --extra-config=kubelet.eviction-hard="memory.available<10%"

      (minikube-specific command — kind's equivalent is a KubeletConfiguration
      patch in the cluster config, not covered here.) Without this, the fault
      will not trigger a clean kubelet eviction — it will either time out or
      run until the kernel's global OOM killer intervenes directly, producing
      a raw-OOM signature instead of a clean node-pressure eviction.
    description: >
      A "noisy neighbor" pod on the same node as postgres consumes memory
      until the node crosses kubelet's hard eviction threshold. Kubelet's
      node-pressure eviction manager evicts the noisy pod
      (status.reason=Evicted) to relieve the pressure — postgres itself is
      not evicted (its own memory usage-over-request is far smaller than
      the noisy pod's, so it is never the top-ranked eviction candidate)
      but experiences a transient node MemoryPressure window. Distinct
      from k8s-oomkilled: here postgres's own container memory limit is
      untouched and postgres is never restarted — the signal is a
      node-level pressure event from a different pod, not postgres's own
      limit being undersized.
    inject:
      type: shell_exec
      script_inline: |
        set -e
        CTX_ARG=""
        [ -n "$FAULTTEST_K8S_CONTEXT" ] && CTX_ARG="--context=$FAULTTEST_K8S_CONTEXT"
        NS="helpdesk-test"

        NODE=$(kubectl $CTX_ARG get pod postgres-0 -n "$NS" -o jsonpath='{.spec.nodeName}')
        [ -z "$NODE" ] && { echo "Could not resolve postgres-0's node" >&2; exit 1; }

        # Pre-flight: this fault requires the node's kubelet to have a
        # memory-based eviction-hard threshold configured (see this fault's
        # `prerequisites` text). Without it, no eviction will ever fire —
        # fail fast with an actionable message instead of deploying the
        # noisy pod and polling for up to 15 minutes for an event that
        # provably cannot happen on this cluster.
        EVICTION_HARD=$(kubectl $CTX_ARG get --raw "/api/v1/nodes/$NODE/proxy/configz" 2>/dev/null \
          | jq -r '.kubeletconfig.evictionHard["memory.available"] // empty' 2>/dev/null)
        if [ -z "$EVICTION_HARD" ]; then
          echo "SKIP: node $NODE has no memory.available eviction-hard threshold configured." >&2
          echo "This fault cannot trigger a clean kubelet eviction on this cluster — see this fault's prerequisites." >&2
          echo "Fix (minikube): minikube start --extra-config=kubelet.eviction-hard=\"memory.available<10%\"" >&2
          exit 1
        fi

        # allocatable.memory is usually reported with a Ki suffix, but some
        # kubelet versions report a plain byte count with no suffix — handle both.
        RAW=$(kubectl $CTX_ARG get node "$NODE" -o jsonpath='{.status.allocatable.memory}')
        [ -z "$RAW" ] && { echo "Could not read node allocatable memory" >&2; exit 1; }
        if [[ "$RAW" == *Ki ]]; then
          ALLOC_MI=$(( ${RAW%Ki} / 1024 ))
        else
          ALLOC_MI=$(( RAW / 1024 / 1024 ))
        fi
        # Target just above the node's eviction-hard threshold rather than a
        # blind percentage of allocatable — avoids overshooting by gigabytes
        # on larger nodes while still reliably crossing the threshold.
        TARGET_MI=$(( ALLOC_MI - 700 ))
        [ "$TARGET_MI" -le 0 ] && { echo "Node too small for this fault (allocatable ${ALLOC_MI}Mi)" >&2; exit 1; }

        # Unique name per invocation — Kubernetes retains Events for ~1h by
        # default, so a fixed pod name would let a later run's event lookup
        # match a PRIOR run's stale Evicted event and return a false positive
        # before the new pod has even finished ramping.
        POD_NAME="noisy-neighbor-$(date +%s)"

        kubectl $CTX_ARG apply -f - <<EOF
        apiVersion: v1
        kind: Pod
        metadata:
          name: $POD_NAME
          namespace: $NS
          labels: {app: noisy-neighbor, faulttest: k8s-node-memory-pressure}
        spec:
          restartPolicy: Never
          nodeName: $NODE
          containers:
            - name: hog
              image: busybox:1.36
              command: ["sh", "-c"]
              args:
                - |
                  mkdir -p /mem; i=0; total=0
                  while [ "\$total" -lt "$TARGET_MI" ]; do
                    dd if=/dev/zero of=/mem/block_\$i bs=1M count=16 2>/dev/null
                    i=\$((i+1)); total=\$((total+16)); sleep 3
                  done
                  sleep 300
              resources:
                requests: {memory: "100Mi"}
              volumeMounts: [{name: mem, mountPath: /mem}]
          volumes:
            - name: mem
              emptyDir: {medium: Memory, sizeLimit: "${TARGET_MI}Mi"}
        EOF

        # Ramp is deliberately gentle (16Mi/3s) — empirically confirmed to
        # produce a clean kubelet Evicted event rather than a raw OOM kill.
        # The deadline scales with the actual fill time this node's
        # TARGET_MI requires at that fixed rate, plus a buffer for kubelet's
        # eviction manager to notice and act — a fixed assumption (e.g. 900s)
        # only holds on nodes with roughly the allocatable memory this fault
        # was originally tuned against; larger nodes need proportionally
        # longer to fill the same *relative* threshold at a fixed *absolute*
        # rate. Speeding up the ramp instead is NOT a safe substitute — a
        # faster rate risks a raw OOM kill rather than the clean kubelet
        # eviction this fault is specifically testing for.
        FILL_SECS=$(( (TARGET_MI / 16) * 3 ))
        BUFFER_SECS=300
        DEADLINE=$(( $(date +%s) + FILL_SECS + BUFFER_SECS ))
        EVICTED=""
        while [ "$(date +%s)" -lt "$DEADLINE" ]; do
          EVICTED=$(kubectl $CTX_ARG get events -n "$NS" \
            --field-selector reason=Evicted,involvedObject.name=$POD_NAME \
            -o jsonpath='{.items[0].reason}' 2>/dev/null || true)
          [ -n "$EVICTED" ] && break
          sleep 5
        done

        # Best-effort — the separate teardown phase does this exact same
        # idempotent delete regardless of inject's outcome, so a transient
        # API server hiccup here (e.g. TLS handshake timeout) must not abort
        # the whole script under `set -e` and discard a run that otherwise
        # completed successfully after up to ~20+ minutes of waiting.
        kubectl $CTX_ARG delete pod -l app=noisy-neighbor -n "$NS" --ignore-not-found --wait=false || true

        [ -z "$EVICTED" ] && { echo "TIMEOUT: $POD_NAME was not evicted within budget" >&2; exit 1; }

        echo "Confirmed: $POD_NAME evicted due to node memory pressure (postgres-0 unaffected)"
      wait: 15s
    teardown:
      type: shell_exec
      script_inline: |
        CTX_ARG=""
        [ -n "$FAULTTEST_K8S_CONTEXT" ] && CTX_ARG="--context=$FAULTTEST_K8S_CONTEXT"
        # postgres is never disrupted by this fault, so teardown only needs to
        # clean up the noisy pod — it's an idempotent safety net for aborted runs.
        # Pod names are unique per inject run (see inject script), so clean up by label.
        kubectl $CTX_ARG delete pod -l app=noisy-neighbor -n helpdesk-test --ignore-not-found --wait=false
    diagnosis_playbook_series_id: pbs_k8s_node_pressure_triage
    prompt: >
      We received a node memory-pressure alert for the node hosting the
      postgres pod in namespace helpdesk-test a few minutes ago. Please
      investigate what happened and assess whether the database was
      affected.
    evaluation:
      expected_tools:
        - get_pods
        - get_events
        - get_node_status
        - debug_node_dmesg
      expected_keywords:
        any_of:
          - "Evicted"
          - "evicted"
          - "memory pressure"
          - "MemoryPressure"
          - "node memory"
          - "noisy neighbor"
      expected_diagnosis:
        category: "node_memory_pressure"
        narrative: >
          The agent should find an Evicted event for a different pod
          (noisy-neighbor) on postgres's node, check get_node_status for a
          MemoryPressure condition around the time of the event, and
          identify that another pod's memory usage — not postgres's own
          container limit — drove the node into pressure. It should also
          confirm postgres-0 itself was never evicted or restarted (still
          Running throughout). Distinct from k8s-oomkilled: there
          postgres's own memory limit (10Mi) was undersized and the OOM
          killer targeted that specific container; here postgres's limit
          is untouched and unaffected — a different pod's memory usage
          drove the node into pressure and kubelet evicted that pod
          instead.
    timeout: 90s
    # inject_timeout overrides the default 90s (Part B, v0.26): this fault's
    # injection polls for a real kubelet eviction, computing its own internal
    # deadline as (TARGET_MI/16)*3 + 300s buffer — observed live at ~20-25min
    # on a typical test cluster (minikube/kind-sized node). 30m leaves
    # headroom above that; raise further if ever run against a much larger node.
    inject_timeout: 30m
    remediation:
      playbook_id: pbs_k8s_node_pressure_remediate
      namespace: helpdesk-test
      verify_sql: "SELECT 1"
      verify_timeout: "60s"

  - id: db-wal-stale-slot
    name: "WAL accumulation — stale replication slot"
    category: database
    severity: high
    diagnosis_playbook_series_id: pbs_wal_stale_slot
    description: >
      A physical replication slot was created for a standby that has since been
      decommissioned. With nothing consuming the slot, PostgreSQL cannot recycle
      WAL segments behind restart_lsn — the pg_wal directory grows without bound.
      The database remains fully operational until the volume fills. Three other
      causes produce the same symptom (archive failure, long transaction, write
      volume), so the agent must work through a hypothesis tree rather than
      jumping to the slot explanation.
    inject:
      type: sql
      script_inline: |
        SELECT pg_create_physical_replication_slot('old_standby', true);
        CREATE TABLE IF NOT EXISTS _wal_gen (id serial, val text);
        INSERT INTO _wal_gen (val)
          SELECT md5(i::text) FROM generate_series(1, 10000) AS i;
    teardown:
      type: sql
      script_inline: |
        SELECT pg_drop_replication_slot(slot_name)
          FROM pg_replication_slots
         WHERE slot_name = 'old_standby' AND active = false;
        DROP TABLE IF EXISTS _wal_gen;
    external_compat: true
    external_inject:
      type: sql
      script_inline: |
        SELECT pg_create_physical_replication_slot('old_standby', true);
        CREATE TABLE IF NOT EXISTS _wal_gen (id serial, val text);
        INSERT INTO _wal_gen (val)
          SELECT md5(i::text) FROM generate_series(1, 10000) AS i;
    external_teardown:
      type: sql
      script_inline: |
        SELECT pg_drop_replication_slot(slot_name)
          FROM pg_replication_slots
         WHERE slot_name = 'old_standby' AND active = false;
        DROP TABLE IF EXISTS _wal_gen;
    prompt: >
      Storage monitoring is alerting on the PostgreSQL data volume for
      '{{connection_string}}': the pg_wal directory is consuming an unusually
      large and still-growing amount of disk space. The database itself appears
      healthy — queries are succeeding normally. Please investigate why WAL is
      accumulating and identify the root cause.
    evaluation:
      expected_tools:
        - get_replication_status
      expected_keywords:
        any_of:
          - "old_standby"
          - "stale slot"
          - "replication slot"
          - "inactive"
          - "lag_bytes"
          - "restart_lsn"
          - "slot"
      expected_diagnosis:
        category: "wal_accumulation_stale_slot"
        narrative: >
          The agent should work through the WAL accumulation hypothesis tree:
          rule out archive failure (call get_pg_settings category=wal_archiving,
          find archive_mode=off), then call get_replication_status and find the
          inactive slot 'old_standby' with lag_bytes > 0. It should correctly
          identify this as a stale replication slot, not a disk configuration
          issue or write volume problem, and propose dropping the slot with
          operator approval before recommending any checkpoint or max_wal_size
          tuning.
    timeout: 90s
    remediation:
      playbook_id: pbs_stale_slot_remediate
      verify_sql: "SELECT count(*) = 0 FROM pg_replication_slots WHERE slot_name = 'old_standby'"
      verify_timeout: "30s"

  - id: db-checkpoint-warning
    name: "Checkpoint warnings — bgwriter overload"
    category: database
    severity: medium
    diagnosis_playbook_series_id: pbs_checkpoint_bgwriter_triage
    prerequisites: |
      CNPG only: ALTER SYSTEM is disabled by default, and pg_reload_conf() is
      blocked for non-operator connections even with pg_signal_backend granted.
      The external_inject uses `kubectl exec pg_ctl reload` to work around this.

      Before:
        kubectl patch cluster <cluster-name> -n <namespace> --type merge \
          -p '{"spec":{"postgresql":{"enableAlterSystem":true}}}'

        PostgreSQL 18+: grant per-parameter ALTER SYSTEM privileges —
          GRANT ALTER SYSTEM ON PARAMETER bgwriter_lru_maxpages TO <app-user>;
          GRANT ALTER SYSTEM ON PARAMETER checkpoint_warning TO <app-user>;
          GRANT pg_checkpoint TO <app-user>;  -- required by CHECKPOINT

        PostgreSQL ≤ 17: no parameter-level GRANT ALTER SYSTEM; pass a
          superuser DSN via --conn and use --agent-conn for the app-user alias.

        Set env vars for the inject script (Helm: faulttest.extraEnv):
          CNPG_CLUSTER=<cluster-name>   (default: pg-cluster-minkube)
          CNPG_NAMESPACE=<namespace>    (default: db)

        Ensure the faulttest job service account has pods/exec create in
        the CNPG namespace (the Helm chart's faulttest.targetNamespace RBAC
        already grants this when faulttest.rbac.create=true).

      After:
        PostgreSQL 18+:
          REVOKE ALTER SYSTEM ON PARAMETER bgwriter_lru_maxpages FROM <app-user>;
          REVOKE ALTER SYSTEM ON PARAMETER checkpoint_warning FROM <app-user>;
          REVOKE pg_checkpoint FROM <app-user>;
        kubectl patch cluster <cluster-name> -n <namespace> --type merge \
          -p '{"spec":{"postgresql":{"enableAlterSystem":false}}}'

      Other operators (Crunchy, Zalando, StackGres, KubeDB) and standalone
      PostgreSQL do not require any of these steps.
    description: >
      bgwriter_lru_maxpages is set to 2 (default: 100), so the background
      writer hits its per-round page limit on every wakeup cycle
      (maxwritten_clean > 0) and backends must write dirty pages themselves
      (buffers_backend climbs). checkpoint_warning is set to 10s, so two rapid
      manual checkpoints 1 second apart cause PostgreSQL to emit LOG:
      "checkpoints are occurring too frequently (1 second apart)". The database
      stays available but query latency increases due to bgwriter starvation and
      elevated backend I/O. max_wal_size is left at its default (1 GB) — the
      checkpoint warnings come from the short checkpoint_warning threshold, not
      from WAL fill.
    inject:
      type: sql
      script_inline: |
        ALTER SYSTEM SET bgwriter_lru_maxpages = 2;
        ALTER SYSTEM SET checkpoint_warning = '10s';
        DO $$ BEGIN PERFORM pg_reload_conf(); EXCEPTION WHEN insufficient_privilege THEN NULL; END $$;
        CREATE TABLE IF NOT EXISTS _chkpt_gen (id serial, val text);
        INSERT INTO _chkpt_gen (val) SELECT md5(i::text) FROM generate_series(1,100000) AS i;
        SELECT pg_sleep(1);
        INSERT INTO _chkpt_gen (val) SELECT md5(i::text) FROM generate_series(1,100000) AS i;
        SELECT pg_sleep(1);
        INSERT INTO _chkpt_gen (val) SELECT md5(i::text) FROM generate_series(1,100000) AS i;
        SELECT pg_sleep(2);
        CHECKPOINT;
        SELECT pg_sleep(1);
        CHECKPOINT;
      wait: 30s
    teardown:
      type: sql
      script_inline: |
        ALTER SYSTEM RESET bgwriter_lru_maxpages;
        ALTER SYSTEM RESET checkpoint_warning;
        DO $$ BEGIN PERFORM pg_reload_conf(); EXCEPTION WHEN insufficient_privilege THEN NULL; END $$;
        DROP TABLE IF EXISTS _chkpt_gen;
    external_compat: true
    external_inject:
      type: shell_exec
      script_inline: |
        set -e
        # ALTER SYSTEM: writes settings to postgresql.auto.conf.
        psql "$FAULTTEST_CONN" -v ON_ERROR_STOP=1 <<'PSQL'
        ALTER SYSTEM SET bgwriter_lru_maxpages = 2;
        ALTER SYSTEM SET checkpoint_warning = '10s';
        PSQL
        # Reload config: pg_reload_conf() works on standalone Postgres and CNPG
        # with a superuser DSN. Fall back to kubectl exec for CNPG restricted users.
        if psql "$FAULTTEST_CONN" -v ON_ERROR_STOP=1 -c "SELECT pg_reload_conf();" 2>/dev/null; then
          echo "Config reloaded via pg_reload_conf()"
        else
          CLUSTER="${CNPG_CLUSTER:-pg-cluster-minkube}"
          NS="${CNPG_NAMESPACE:-db}"
          POD=$(kubectl get pod -n "$NS" \
            -l "cnpg.io/cluster=${CLUSTER},role=primary" \
            -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -n "$NS" "$POD" -c postgres -- \
            sh -c 'pg_ctl reload -D "$PGDATA"'
          echo "Config reloaded via kubectl"
        fi
        sleep 2
        # Workload: generates dirty pages and triggers checkpoint warnings.
        psql "$FAULTTEST_CONN" -v ON_ERROR_STOP=1 <<'PSQL'
        CREATE TABLE IF NOT EXISTS _chkpt_gen (id serial, val text);
        INSERT INTO _chkpt_gen (val) SELECT md5(i::text) FROM generate_series(1,100000) AS i;
        SELECT pg_sleep(1);
        INSERT INTO _chkpt_gen (val) SELECT md5(i::text) FROM generate_series(1,100000) AS i;
        SELECT pg_sleep(1);
        INSERT INTO _chkpt_gen (val) SELECT md5(i::text) FROM generate_series(1,100000) AS i;
        SELECT pg_sleep(2);
        CHECKPOINT;
        SELECT pg_sleep(1);
        CHECKPOINT;
        PSQL
      wait: 30s
    external_teardown:
      type: shell_exec
      script_inline: |
        set -e
        psql "$FAULTTEST_CONN" -v ON_ERROR_STOP=1 <<'PSQL'
        ALTER SYSTEM RESET bgwriter_lru_maxpages;
        ALTER SYSTEM RESET checkpoint_warning;
        DROP TABLE IF EXISTS _chkpt_gen;
        PSQL
        if psql "$FAULTTEST_CONN" -v ON_ERROR_STOP=1 -c "SELECT pg_reload_conf();" 2>/dev/null; then
          echo "Config reloaded via pg_reload_conf()"
        else
          CLUSTER="${CNPG_CLUSTER:-pg-cluster-minkube}"
          NS="${CNPG_NAMESPACE:-db}"
          POD=$(kubectl get pod -n "$NS" \
            -l "cnpg.io/cluster=${CLUSTER},role=primary" \
            -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -n "$NS" "$POD" -c postgres -- \
            sh -c 'pg_ctl reload -D "$PGDATA"'
          echo "Config reloaded via kubectl"
        fi
    prompt: >
      Performance monitoring is showing elevated write latency on
      '{{connection_string}}' and the PostgreSQL log has warning messages about
      checkpoints occurring too frequently. The database is still accepting
      queries but response times are degraded. Please investigate the checkpoint
      and background-writer health and identify what is causing the warnings.
    evaluation:
      expected_tools:
        - get_bgwriter_stats
      expected_keywords:
        any_of:
          - "FINDINGS:"
          - "checkpoint"
          - "too frequently"
          - "bgwriter"
          - "maxwritten_clean"
          - "buffers_backend"
          - "bgwriter_lru_maxpages"
          - "checkpoint_warning"
      expected_diagnosis:
        category: "checkpoint_bgwriter_overload"
        narrative: >
          The agent should call get_bgwriter_stats and observe that
          maxwritten_clean > 0 (bgwriter is throttled — it hits bgwriter_lru_maxpages
          on every wakeup cycle and stops) and buffers_backend elevated (backends
          are writing dirty pages themselves because bgwriter cannot keep up).
          It should call read_pg_log and find the "checkpoints are occurring too
          frequently" warning, then call get_pg_settings with category=bgwriter
          to find bgwriter_lru_maxpages = 2 (default 100) as the root cause.
          max_wal_size is at its default 1 GB — the checkpoint warning is triggered
          by the short checkpoint_warning threshold (10s), not by WAL fill.
          The agent should identify bgwriter_lru_maxpages = 2 as the primary root
          cause and recommend raising it to at least 100 (default) or higher.
    timeout: 90s
    remediation:
      playbook_id: pbs_bgwriter_remediate
      verify_sql: |
        SELECT (SELECT setting FROM pg_settings WHERE name = 'bgwriter_lru_maxpages') = '100'
      verify_timeout: "30s"
