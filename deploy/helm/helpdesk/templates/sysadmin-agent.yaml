{{- /* agents.sysadmin.ssh may be absent when upgrading with --reuse-values (new chart defaults aren't merged in). */ -}}
{{- $ssh := .Values.agents.sysadmin.ssh | default dict -}}
{{- $sshMount := $ssh.mountPath | default "/etc/helpdesk/ssh" -}}
{{- $sshKnownHosts := $ssh.knownHostsKey | default "known_hosts" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helpdesk.fullname" . }}-sysadmin-agent
  labels:
    {{- include "helpdesk.labels" . | nindent 4 }}
    app.kubernetes.io/component: sysadmin-agent
spec:
  replicas: {{ .Values.agents.sysadmin.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: sysadmin-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: sysadmin-agent
    spec:
      {{- if .Values.agents.sysadmin.rbac.create }}
      serviceAccountName: {{ include "helpdesk.fullname" . }}-sysadmin-agent
      {{- end }}
      containers:
        - name: sysadmin-agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/sysadmin-agent"]
          env:
            - name: HELPDESK_AGENT_ADDR
              value: "0.0.0.0:{{ .Values.agents.sysadmin.port }}"
            - name: HELPDESK_AGENT_URL
              value: "http://{{ include "helpdesk.fullname" . }}-sysadmin-agent:{{ .Values.agents.sysadmin.port }}"
            {{- if .Values.infrastructure }}
            - name: HELPDESK_INFRA_CONFIG
              value: /etc/helpdesk/infrastructure.json
            {{- end }}
            {{- if $ssh.secretName }}
            - name: SSH_KNOWN_HOSTS
              value: {{ $sshMount }}/{{ $sshKnownHosts }}
            {{- end }}
            {{- include "helpdesk.modelEnv" . | nindent 12 }}
            {{- if .Values.governance.auditd.enabled }}
            - name: HELPDESK_AUDIT_ENABLED
              value: "true"
            - name: HELPDESK_AUDIT_URL
              value: "http://{{ include "helpdesk.fullname" . }}-auditd:{{ .Values.governance.auditd.port }}"
            {{- end }}
            {{- if .Values.governance.policy.enabled }}
            - name: HELPDESK_POLICY_ENABLED
              value: "true"
            - name: HELPDESK_POLICY_FILE
              value: /etc/helpdesk/policies.yaml
            {{- end }}
            {{- if .Values.governance.approvals.enabled }}
            - name: HELPDESK_APPROVAL_ENABLED
              value: "true"
            {{- end }}
            {{- if .Values.governance.approvals.timeout }}
            - name: HELPDESK_APPROVAL_TIMEOUT
              value: "{{ .Values.governance.approvals.timeout }}"
            {{- end }}
            {{- if .Values.agents.sysadmin.objectiveEvidence.enabled }}
            - name: HELPDESK_SYSADMIN_EVIDENCE_RULES
              value: /etc/helpdesk/objective_evidence.yaml
            {{- end }}
            {{- include "helpdesk.identityEnv" . | nindent 12 }}
            {{- include "helpdesk.operatingModeEnv" . | nindent 12 }}
            {{- include "helpdesk.logLevelEnv" . | nindent 12 }}
            {{- include "helpdesk.auditAPIKeyEnv" (dict "secret" .Values.agents.sysadmin.auditAPIKeySecret "key" .Values.agents.sysadmin.auditAPIKeyKey) | nindent 12 }}
          volumeMounts:
            {{- if .Values.infrastructure }}
            - name: infra-config
              mountPath: /etc/helpdesk/infrastructure.json
              subPath: infrastructure.json
              readOnly: true
            {{- end }}
            {{- if .Values.governance.policy.enabled }}
            - name: policy-config
              mountPath: /etc/helpdesk/policies.yaml
              subPath: policies.yaml
              readOnly: true
            {{- end }}
            {{- if .Values.agents.sysadmin.objectiveEvidence.enabled }}
            - name: objective-evidence-config
              mountPath: /etc/helpdesk/objective_evidence.yaml
              subPath: objective-evidence-sysadmin.yaml
              readOnly: true
            {{- end }}
            {{- if .Values.agents.sysadmin.dockerSocket.enabled }}
            - name: docker-sock
              mountPath: /var/run/docker.sock
            {{- end }}
            {{- if $ssh.secretName }}
            - name: ssh
              mountPath: {{ $sshMount }}
              readOnly: true
            {{- end }}
            {{- include "helpdesk.usersVolumeMount" . | nindent 12 }}
          ports:
            - name: a2a
              containerPort: {{ .Values.agents.sysadmin.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /.well-known/agent-card.json
              port: a2a
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /.well-known/agent-card.json
              port: a2a
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        {{- if .Values.infrastructure }}
        - name: infra-config
          configMap:
            name: {{ include "helpdesk.fullname" . }}-config
        {{- end }}
        {{- if .Values.governance.policy.enabled }}
        - name: policy-config
          configMap:
            name: {{ required "governance.policy.configMap must be set when governance.policy.enabled is true" .Values.governance.policy.configMap }}
        {{- end }}
        {{- if .Values.agents.sysadmin.objectiveEvidence.enabled }}
        - name: objective-evidence-config
          configMap:
            name: {{ .Values.agents.sysadmin.objectiveEvidence.configMap | default (printf "%s-config" (include "helpdesk.fullname" .)) }}
        {{- end }}
        {{- if .Values.agents.sysadmin.dockerSocket.enabled }}
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        {{- end }}
        {{- if $ssh.secretName }}
        - name: ssh
          secret:
            secretName: {{ $ssh.secretName }}
            defaultMode: 0400
        {{- end }}
        {{- include "helpdesk.usersVolume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "helpdesk.fullname" . }}-sysadmin-agent
  labels:
    {{- include "helpdesk.labels" . | nindent 4 }}
    app.kubernetes.io/component: sysadmin-agent
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.agents.sysadmin.port }}
      targetPort: a2a
      protocol: TCP
      name: a2a
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: sysadmin-agent
{{- if .Values.agents.sysadmin.rbac.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "helpdesk.fullname" . }}-sysadmin-agent
  labels:
    {{- include "helpdesk.labels" . | nindent 4 }}
    app.kubernetes.io/component: sysadmin-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "helpdesk.fullname" . }}-sysadmin-agent
  labels:
    {{- include "helpdesk.labels" . | nindent 4 }}
    app.kubernetes.io/component: sysadmin-agent
rules:
  # Pod-scoped reads: check_host's inspection of a Kubernetes-managed target
  # (phase, restart count, last termination), get_host_logs (pods/log), and
  # pgBackRest commands exec'd into a ready instance pod (pods/exec).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log", "pods/exec"]
    verbs: ["get", "create"]
  # The instance lifecycle (v0.32, agents/sysadmin/lifecycle.go) on a
  # self-managed Postgres StatefulSet: restore_from_backup scales it to 0
  # (recording the replica count in an annotation) and runs pgBackRest in a
  # one-off pod with its image and volumes (the pods create/delete above);
  # restart_container scales it back. Still narrower than the k8s agent's
  # ClusterRole: no deployments, jobs or nodes, only the StatefulSet whose pods
  # match a target's selector.
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets/scale"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "helpdesk.fullname" . }}-sysadmin-agent
  labels:
    {{- include "helpdesk.labels" . | nindent 4 }}
    app.kubernetes.io/component: sysadmin-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "helpdesk.fullname" . }}-sysadmin-agent
subjects:
  - kind: ServiceAccount
    name: {{ include "helpdesk.fullname" . }}-sysadmin-agent
    namespace: {{ .Release.Namespace }}
{{- end }}
