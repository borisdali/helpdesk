{{- if .Values.vaultQuery }}
{{- if .Values.vaultQuery.enabled }}
{{- if not .Values.vaultQuery.subcommand }}
  {{- fail "vaultQuery.subcommand is required when vaultQuery.enabled=true — e.g. --set vaultQuery.subcommand=accuracy --set vaultQuery.target=db-lock-contention" }}
{{- end }}
{{- $fullname := include "helpdesk.fullname" . }}
{{- $gatewayURL := printf "http://%s-gateway:%d" $fullname (.Values.gateway.port | int) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-vault-query
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helpdesk.labels" . | nindent 4 }}
    app.kubernetes.io/component: vault-query
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  {{- if .Values.vaultQuery.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ .Values.vaultQuery.ttlSecondsAfterFinished }}
  {{- end }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: vault-query
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              url="{{ $gatewayURL }}/health"
              echo "Waiting for gateway at $url..."
              until curl -sf "$url" >/dev/null 2>&1; do sleep 2; done
              echo "Gateway ready."
      containers:
        - name: faulttest
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/faulttest"]
          args:
            - vault
            - {{ .Values.vaultQuery.subcommand }}
            {{- if .Values.vaultQuery.target }}
            - {{ .Values.vaultQuery.target }}
            {{- end }}
            - --gateway={{ $gatewayURL }}
            {{- if .Values.faulttest.catalog }}
            - --catalog=/etc/faulttest/catalog.yaml
            {{- end }}
          env:
            {{- if .Values.vaultQuery.gatewayAPIKeySecret }}
            - name: HELPDESK_CLIENT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vaultQuery.gatewayAPIKeySecret }}
                  key: {{ .Values.vaultQuery.gatewayAPIKeyKey | default "api-key" }}
            {{- end }}
          {{- if .Values.faulttest.catalog }}
          volumeMounts:
            - name: faulttest-catalog
              mountPath: /etc/faulttest/catalog.yaml
              subPath: catalog.yaml
              readOnly: true
          {{- end }}
      {{- if .Values.faulttest.catalog }}
      volumes:
        - name: faulttest-catalog
          configMap:
            name: {{ $fullname }}-faulttest-catalog
      {{- end }}
{{- end }}
{{- end }}
