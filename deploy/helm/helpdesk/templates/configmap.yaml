apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "helpdesk.fullname" . }}-config
  labels:
    {{- include "helpdesk.labels" . | nindent 4 }}
data:
  agents.json: |
    [
      {
        "name": "postgres_database_agent",
        "url": "http://{{ include "helpdesk.fullname" . }}-database-agent:{{ .Values.agents.database.port }}",
        "description": "PostgreSQL database troubleshooting agent"
      },
      {
        "name": "k8s_agent",
        "url": "http://{{ include "helpdesk.fullname" . }}-k8s-agent:{{ .Values.agents.k8s.port }}",
        "description": "Kubernetes troubleshooting agent"
      },
      {
        "name": "incident_agent",
        "url": "http://{{ include "helpdesk.fullname" . }}-incident-agent:{{ .Values.agents.incident.port }}",
        "description": "Incident diagnostic bundle agent"
      }
    ]
  {{- if .Values.infrastructure }}
  infrastructure.json: {{ .Values.infrastructure | toJson | quote }}
  {{- end }}
  {{- if and .Values.agents.database.objectiveEvidence.enabled (not .Values.agents.database.objectiveEvidence.configMap) }}
  objective-evidence-database.yaml: |
{{ .Files.Get "files/objective-evidence-database.yaml" | indent 4 }}
  {{- end }}
  {{- if and .Values.agents.k8s.objectiveEvidence.enabled (not .Values.agents.k8s.objectiveEvidence.configMap) }}
  objective-evidence-k8s.yaml: |
{{ .Files.Get "files/objective-evidence-k8s.yaml" | indent 4 }}
  {{- end }}
