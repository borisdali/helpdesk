# Objective-evidence rules for the sysadmin agent.
#
# Each rule says: for a given tool's result, threshold a named probe and, if
# it matches, force a human-reviewed gate with the given signal — regardless
# of what the diagnosing model concludes or chooses to mention. See
# internal/evidence's package doc, agents/database/objective_evidence.yaml
# (the same mechanism's first user), and docs/AIGOVERNANCE.md for the full
# rationale (objectiveEvidenceForceGate, cmd/gateway/playbooks.go).
#
# Probes (what fields exist, and how they're read) are Go code, registered
# in agents/sysadmin/tools.go — adding a genuinely new field to threshold
# needs a small code change there. Everything below — which probes are
# active, what threshold triggers them, what the resulting signal/detail
# text is — is authored here and takes effect on the next agent restart, no
# other code change required. A rule naming an unregistered probe (e.g. a
# typo) fails the agent's startup loudly; it never silently just does
# nothing.

# wal_chain_broken (v0.32): true when the WAL-continuity check on
# get_pgbackrest_status finds the latest backup cannot be restored to the end
# of the archive — a segment between the backup and the archive end is
# missing, or the backup isn't on the newest timeline's history (see
# agents/sysadmin/walcheck.go). Fires on that definite finding only, not on
# "unverified" (the check couldn't run). This gate makes a human look at the
# finding; it is not what stops a restore — restore_from_backup itself
# refuses whenever WAL continuity isn't "continuous", whatever any model or
# gate concludes.
#
# confirmation_probe is evidence_quote_contains_any, not ..._value: the fired
# value is a derived true that no verbatim quote of the tool output contains.
# The terms are the raw wal_continuity data behind it: status "broken", or
# a phrase only a broken detail contains (walcheck.go). Field names like
# consistency_reachable are left out on purpose: a healthy result's quote
# has them too ("consistency_reachable: true"), and a misread like that
# must not confirm. Found live
# 2026-10-16: make faulttest-gateway-pgbackrest quoted
# "wal_continuity.status='broken'; consistency_reachable=false; ..." exactly,
# and the signal still came back unconfirmed.
#
# Listed FIRST on purpose: evidence.Evaluate records only the first matching
# rule per tool result, and a broken chain is the more severe and more
# specific finding when the backup is also stale. The stale/never-backed-up
# details are still in the tool result itself.
- tool: get_pgbackrest_status
  probe: wal_chain_broken
  operator: "=="
  threshold: true
  signal: pgbackrest_wal_chain_broken
  detail: "pgBackRest WAL chain from the latest backup is broken — stanza: %s"
  confirmation_probe: evidence_quote_contains_any
  confirmation_terms: ["broken", "is missing", "not in the repo", "does not descend from"]

# backup_unhealthy (v0.30 Part C): true when pgBackRest's own stanza status
# is non-ok, the most recent backup is older than the requested/default
# staleness bound, or no backup has ever succeeded. Deliberately a single
# combined bool rather than three separate probes — the triage playbook's
# own guidance is responsible for distinguishing which of the three actually
# applies from GetPgBackRestStatusResult's own StatusMessage/BackupStale/
# LastBackupTime fields; this gate only needs to know "is there something a
# human should look at," not which specific sub-case.
#
# confirmation_probe changed from resource_named_in_quote to
# evidence_quote_contains_value (2026-10-08) — found live on two real
# db-pgdata-corrupted runs with the IDENTICAL backup_unhealthy=true
# condition: one gated, one didn't, purely because resource_named_in_quote
# checks whether the stanza name ("main") appears ANYWHERE in the model's
# full, multi-paragraph response text. Confirmed directly (SQL against the
# real audit trail): the gated run's response never happened to say "main";
# the other run's did, in an unrelated sentence — neither run's choice of
# words had anything to do with whether it actually reasoned about the
# staleness risk. evidence_quote_contains_value is scoped to the PRIMARY
# hypothesis's own EVIDENCE field specifically (required by protocol to be a
# short verbatim quote from real tool output, not free narration) and checks
# for the actual fired value ("true") rather than an incidental resource
# name — tighter, though still not a perfect semantic-engagement check; see
# project memory for the fuller writeup if this needs revisiting again.
#
# Then widened to evidence_quote_contains_any (2026-10-16): "true" is only in
# the stale sub-case's quote (backup_stale: true). A non-ok stanza is quoted
# as its error message — the repo-unreadable run quoted
# repo_status_message "...[13] Permission denied" exactly and came back
# unconfirmed. The terms are values only a problem state has, including
# "backup_stale:true" for the stale case (matched however it's formatted;
# see normalizeQuote in internal/evidence/confirm.go). Field
# names (status_code, status_message) are left out on purpose: a healthy
# quote has them too ("status_code: 0", "status_message: ok"), and a model
# that quotes only those on a stale backup has missed the staleness. Same
# reason for "error]" rather than "error": it matches pgBackRest's own error
# codes ("[PathOpenError]"), not the last_backup_error field name.
- tool: get_pgbackrest_status
  probe: backup_unhealthy
  operator: "=="
  threshold: true
  signal: pgbackrest_backup_unhealthy
  detail: "pgBackRest backup unhealthy — most recent backup: %s"
  confirmation_probe: evidence_quote_contains_any
  confirmation_terms: ["backup_stale:true", "error]", "permission denied", "unable to", "no valid backup", "missing stanza", "invalid"]

# recovery_mismatch (v0.32 item 9): true when verify_restore_recovery finds
# PostgreSQL's recovery after a restore ended somewhere other than
# restore_from_backup predicted — it stopped short of (or went past) the
# predicted last segment, or promoted to a different timeline. not_found and
# unverified don't fire it: the comparison couldn't be made, which the
# playbook reports as such. Same confirmation reasoning as wal_chain_broken:
# the terms are words only a mismatch result contains ("verified" results
# have the same field names).
- tool: verify_restore_recovery
  probe: recovery_mismatch
  operator: "=="
  threshold: true
  signal: restore_recovery_mismatch
  detail: "PostgreSQL recovery after the restore did not end where predicted — target: %s"
  confirmation_probe: evidence_quote_contains_any
  confirmation_terms: ["mismatch", "stopped early", "went past the predicted end"]

# recovery_target_not_reached (v0.33): true when a point-in-time recovery ran
# out of WAL before its target and PostgreSQL shut down. PGDATA is intact and
# the restore can be repeated with an earlier target; the playbook reports it
# as that, not as a failed restore. The term is the status value, which only
# this result carries.
- tool: verify_restore_recovery
  probe: recovery_target_not_reached
  operator: "=="
  threshold: true
  signal: restore_target_not_reached
  detail: "Point-in-time recovery ended before its target was reached — target: %s"
  confirmation_probe: evidence_quote_contains_any
  confirmation_terms: ["target_not_reached", "ran out of WAL before"]
