name: helpdesk

services:
  # AI Governance: Audit daemon with approval workflows
  auditd:
    build:
      context: ../../..
      dockerfile: helpdesk/Dockerfile
    image: helpdesk:latest
    # Fixed shell command, not "exec $@" — an overriding command (e.g.
    # `docker compose run --rm auditd hashapikey <key>`, a documented way to
    # invoke the other binaries baked into this same image) was silently
    # ignored: sh -c's script text never referenced $@, so the passed command
    # became inert positional args and the full auditd server started anyway,
    # looking like a hang. Fixed by passing through an overriding command when
    # one is given, defaulting to the delayed auditd start otherwise.
    entrypoint: ["/bin/sh", "-c", "if [ \"$#\" -gt 0 ]; then exec \"$@\"; else sleep 4 && exec /usr/local/bin/auditd; fi", "sh"]
    environment:
      HELPDESK_LOG_LEVEL: ${HELPDESK_LOG_LEVEL:-info}
      # Core audit configuration
      HELPDESK_AUDIT_ADDR: "0.0.0.0:1199"
      HELPDESK_AUDIT_DB: /data/audit/audit.db
      HELPDESK_AUDIT_SOCKET: /data/audit/audit.sock
      # Set so that approvals/govexplain binaries exec'd inside this container
      # can find auditd without requiring -e or an explicit --url flag.
      HELPDESK_AUDIT_URL: http://localhost:1199
      # API key for the `approvals` CLI (docker compose exec auditd approvals ...).
      HELPDESK_APPROVAL_KEY: ${HELPDESK_APPROVAL_KEY:-}
      # Policy (for governance info / govexplain endpoint).
      # Empty default: auditd loads the mounted policy file unconditionally so
      # that govexplain hypothetical checks work out of the box.
      # Set HELPDESK_POLICY_ENABLED=false in .env to suppress loading entirely.
      HELPDESK_POLICY_ENABLED: ${HELPDESK_POLICY_ENABLED:-}
      HELPDESK_POLICY_FILE: /etc/helpdesk/policies.yaml
      # Infrastructure config — enables tag/sensitivity resolution in the
      # /v1/governance/explain endpoint without relying on caller-supplied values.
      HELPDESK_INFRA_CONFIG: /etc/helpdesk/infrastructure.json
      # Identity & access control for auditd endpoints (agents authenticate here).
      # static (not none): matches every agent in this file, which already
      # defaults to static — auditd/gateway were the only two services left on
      # the permissive "none" default, silently breaking role-based checks
      # (e.g. approval_override_roles) for any human operator, found live
      # during the debugging of faulttest's approval-mode clamp. The demo-*
      # services below already run static successfully — same pattern.
      HELPDESK_IDENTITY_PROVIDER: ${HELPDESK_IDENTITY_PROVIDER:-static}
      HELPDESK_USERS_FILE: /etc/helpdesk/users.yaml
      # Approval notification (optional)
      HELPDESK_APPROVAL_WEBHOOK: ${HELPDESK_APPROVAL_WEBHOOK:-}
      HELPDESK_APPROVAL_BASE_URL: ${HELPDESK_APPROVAL_BASE_URL:-http://localhost:1199}
      # Email notifications (optional)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      HELPDESK_EMAIL_FROM: ${HELPDESK_EMAIL_FROM:-}
      HELPDESK_EMAIL_TO: ${HELPDESK_EMAIL_TO:-}
    volumes:
      - audit-data:/data/audit
      - ${HELPDESK_USERS_FILE_HOST:-./users.example.yaml}:/etc/helpdesk/users.yaml:ro
      - ${HELPDESK_POLICY_FILE_HOST:-./policies.example.yaml}:/etc/helpdesk/policies.yaml:ro
      - ${HELPDESK_INFRA_CONFIG:-./infrastructure.json}:/etc/helpdesk/infrastructure.json:ro
    ports:
      - "1199:1199"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:1199/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  database-agent:
    build:
      context: ../../..
      dockerfile: helpdesk/Dockerfile
    image: helpdesk:latest
    command: ["/usr/local/bin/database-agent"]
    environment:
      HELPDESK_AGENT_ADDR: "0.0.0.0:1100"
      HELPDESK_AGENT_URL: "http://database-agent:1100"
      HELPDESK_INFRA_CONFIG: /etc/helpdesk/infrastructure.json
      HELPDESK_MODEL_VENDOR: ${HELPDESK_MODEL_VENDOR}
      HELPDESK_MODEL_NAME: ${HELPDESK_MODEL_NAME}
      HELPDESK_API_KEY: ${HELPDESK_API_KEY:-${ANTHROPIC_API_KEY:-}}
      # AI Governance
      HELPDESK_OPERATING_MODE: ${HELPDESK_OPERATING_MODE:-}
      HELPDESK_AUDIT_ENABLED: "true"
      HELPDESK_AUDIT_URL: http://auditd:1199
      HELPDESK_AUDIT_API_KEY: ${DB_AGENT_API_KEY:-}
      HELPDESK_IDENTITY_PROVIDER: ${HELPDESK_IDENTITY_PROVIDER:-static}
      HELPDESK_USERS_FILE: /etc/helpdesk/users.yaml
      HELPDESK_POLICY_ENABLED: ${HELPDESK_POLICY_ENABLED:-false}
      HELPDESK_POLICY_FILE: /etc/helpdesk/policies.yaml
      HELPDESK_APPROVAL_ENABLED: ${HELPDESK_APPROVAL_ENABLED:-false}
      HELPDESK_APPROVAL_TIMEOUT: ${HELPDESK_APPROVAL_TIMEOUT:-5m}
      HELPDESK_REQUIRE_PURPOSE_FOR_SENSITIVE: ${HELPDESK_REQUIRE_PURPOSE_FOR_SENSITIVE:-false}
      # Post-mutation verification retry tuning (optional)
      HELPDESK_VERIFY_MAX_ATTEMPTS: ${HELPDESK_VERIFY_MAX_ATTEMPTS:-}
      HELPDESK_VERIFY_INITIAL_DELAY_S: ${HELPDESK_VERIFY_INITIAL_DELAY_S:-}
      HELPDESK_VERIFY_MAX_DELAY_S: ${HELPDESK_VERIFY_MAX_DELAY_S:-}
      # Objective-evidence framework (docs/OBJECTIVE_EVIDENCE.md): deterministic,
      # code-derived rules that force-gate a response when a tool result crosses
      # a threshold, independent of what the diagnosing model concludes.
      HELPDESK_DB_EVIDENCE_RULES: /etc/helpdesk/objective_evidence.yaml
      # Optional: set PGPASSWORD in .env as a single global DB password.
      # This is not secure and not recommended for anything beyond
      # throw-away development databases.
      # For per-host credentials mount a .pgpass file via PGPASSFILE below.
      PGPASSWORD: ${PGPASSWORD:-}
    volumes:
      - ${HELPDESK_USERS_FILE_HOST:-./users.example.yaml}:/etc/helpdesk/users.yaml:ro
      - ${HELPDESK_INFRA_CONFIG:-./infrastructure.json}:/etc/helpdesk/infrastructure.json:ro
      - ${HELPDESK_POLICY_FILE_HOST:-./policies.example.yaml}:/etc/helpdesk/policies.yaml:ro
      - ${PGPASSFILE:-./.pgpass}:/root/.pgpass:ro
      - ${HELPDESK_DB_EVIDENCE_RULES_HOST:-../../agents/database/objective_evidence.yaml}:/etc/helpdesk/objective_evidence.yaml:ro
    ports:
      - "1100:1100"
    restart: unless-stopped
    depends_on:
      auditd:
        condition: service_healthy

  k8s-agent:
    build:
      context: ../../..
      dockerfile: helpdesk/Dockerfile
    image: helpdesk:latest
    command: ["/usr/local/bin/k8s-agent"]
    environment:
      HELPDESK_AGENT_ADDR: "0.0.0.0:1102"
      HELPDESK_AGENT_URL: "http://k8s-agent:1102"
      HELPDESK_INFRA_CONFIG: /etc/helpdesk/infrastructure.json
      HELPDESK_MODEL_VENDOR: ${HELPDESK_MODEL_VENDOR}
      HELPDESK_MODEL_NAME: ${HELPDESK_MODEL_NAME}
      HELPDESK_API_KEY: ${HELPDESK_API_KEY:-${ANTHROPIC_API_KEY:-}}
      # AI Governance
      HELPDESK_OPERATING_MODE: ${HELPDESK_OPERATING_MODE:-}
      HELPDESK_AUDIT_ENABLED: "true"
      HELPDESK_AUDIT_URL: http://auditd:1199
      HELPDESK_AUDIT_API_KEY: ${K8S_AGENT_API_KEY:-}
      HELPDESK_IDENTITY_PROVIDER: ${HELPDESK_IDENTITY_PROVIDER:-static}
      HELPDESK_USERS_FILE: /etc/helpdesk/users.yaml
      HELPDESK_POLICY_ENABLED: ${HELPDESK_POLICY_ENABLED:-false}
      HELPDESK_POLICY_FILE: /etc/helpdesk/policies.yaml
      HELPDESK_APPROVAL_ENABLED: ${HELPDESK_APPROVAL_ENABLED:-false}
      HELPDESK_APPROVAL_TIMEOUT: ${HELPDESK_APPROVAL_TIMEOUT:-5m}
      HELPDESK_REQUIRE_PURPOSE_FOR_SENSITIVE: ${HELPDESK_REQUIRE_PURPOSE_FOR_SENSITIVE:-false}
      # Post-mutation verification retry tuning (optional)
      HELPDESK_VERIFY_MAX_ATTEMPTS: ${HELPDESK_VERIFY_MAX_ATTEMPTS:-}
      HELPDESK_VERIFY_INITIAL_DELAY_S: ${HELPDESK_VERIFY_INITIAL_DELAY_S:-}
      HELPDESK_VERIFY_MAX_DELAY_S: ${HELPDESK_VERIFY_MAX_DELAY_S:-}
      # Objective-evidence framework (docs/OBJECTIVE_EVIDENCE.md): deterministic,
      # code-derived rules that force-gate a response when a tool result crosses
      # a threshold, independent of what the diagnosing model concludes.
      HELPDESK_K8S_EVIDENCE_RULES: /etc/helpdesk/objective_evidence.yaml
    volumes:
      - ${HELPDESK_USERS_FILE_HOST:-./users.example.yaml}:/etc/helpdesk/users.yaml:ro
      - ${KUBECONFIG:-~/.kube/config}:/root/.kube/config:ro
      - ${HELPDESK_INFRA_CONFIG:-./infrastructure.json}:/etc/helpdesk/infrastructure.json:ro
      - ${HELPDESK_POLICY_FILE_HOST:-./policies.example.yaml}:/etc/helpdesk/policies.yaml:ro
      - ${HELPDESK_K8S_EVIDENCE_RULES_HOST:-../../agents/k8s/objective_evidence.yaml}:/etc/helpdesk/objective_evidence.yaml:ro
    ports:
      - "1102:1102"
    restart: unless-stopped
    depends_on:
      auditd:
        condition: service_healthy

  sysadmin-agent:
    build:
      context: ../../..
      dockerfile: helpdesk/Dockerfile
    image: helpdesk:latest
    command: ["/usr/local/bin/sysadmin-agent"]
    environment:
      HELPDESK_AGENT_ADDR: "0.0.0.0:1103"
      HELPDESK_AGENT_URL: "http://sysadmin-agent:1103"
      HELPDESK_INFRA_CONFIG: /etc/helpdesk/infrastructure.json
      HELPDESK_MODEL_VENDOR: ${HELPDESK_MODEL_VENDOR}
      HELPDESK_MODEL_NAME: ${HELPDESK_MODEL_NAME}
      HELPDESK_API_KEY: ${HELPDESK_API_KEY:-${ANTHROPIC_API_KEY:-}}
      # AI Governance
      HELPDESK_OPERATING_MODE: ${HELPDESK_OPERATING_MODE:-}
      HELPDESK_AUDIT_ENABLED: "true"
      HELPDESK_AUDIT_URL: http://auditd:1199
      HELPDESK_AUDIT_API_KEY: ${SYSADMIN_AGENT_API_KEY:-}
      HELPDESK_IDENTITY_PROVIDER: ${HELPDESK_IDENTITY_PROVIDER:-static}
      HELPDESK_USERS_FILE: /etc/helpdesk/users.yaml
      HELPDESK_POLICY_ENABLED: ${HELPDESK_POLICY_ENABLED:-false}
      HELPDESK_POLICY_FILE: /etc/helpdesk/policies.yaml
      HELPDESK_APPROVAL_ENABLED: ${HELPDESK_APPROVAL_ENABLED:-false}
      HELPDESK_APPROVAL_TIMEOUT: ${HELPDESK_APPROVAL_TIMEOUT:-5m}
    volumes:
      - ${HELPDESK_USERS_FILE_HOST:-./users.example.yaml}:/etc/helpdesk/users.yaml:ro
      - ${HELPDESK_INFRA_CONFIG:-./infrastructure.json}:/etc/helpdesk/infrastructure.json:ro
      - ${HELPDESK_POLICY_FILE_HOST:-./policies.example.yaml}:/etc/helpdesk/policies.yaml:ro
      # Mount the Docker socket so the agent can inspect and manage containers on the host.
      # Required for databases managed via Docker/Podman. Remove if not applicable.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "1103:1103"
    restart: unless-stopped
    depends_on:
      auditd:
        condition: service_healthy

  incident-agent:
    build:
      context: ../../..
      dockerfile: helpdesk/Dockerfile
    image: helpdesk:latest
    command: ["/usr/local/bin/incident-agent"]
    environment:
      HELPDESK_AGENT_ADDR: "0.0.0.0:1104"
      HELPDESK_AGENT_URL: "http://incident-agent:1104"
      HELPDESK_MODEL_VENDOR: ${HELPDESK_MODEL_VENDOR}
      HELPDESK_MODEL_NAME: ${HELPDESK_MODEL_NAME}
      HELPDESK_API_KEY: ${HELPDESK_API_KEY:-${ANTHROPIC_API_KEY:-}}
      HELPDESK_INCIDENT_DIR: /data/incidents
      # AI Governance
      HELPDESK_OPERATING_MODE: ${HELPDESK_OPERATING_MODE:-}
      HELPDESK_AUDIT_ENABLED: "true"
      HELPDESK_AUDIT_URL: http://auditd:1199
      HELPDESK_AUDIT_API_KEY: ${INCIDENT_AGENT_API_KEY:-}
      HELPDESK_GATEWAY_URL: http://gateway:8080
      HELPDESK_CLIENT_API_KEY: ${INCIDENT_AGENT_CLIENT_API_KEY:-}
      HELPDESK_IDENTITY_PROVIDER: ${HELPDESK_IDENTITY_PROVIDER:-static}
      HELPDESK_USERS_FILE: /etc/helpdesk/users.yaml
      HELPDESK_POLICY_ENABLED: ${HELPDESK_POLICY_ENABLED:-false}
      HELPDESK_POLICY_FILE: /etc/helpdesk/policies.yaml
      HELPDESK_APPROVAL_ENABLED: ${HELPDESK_APPROVAL_ENABLED:-false}
      HELPDESK_APPROVAL_TIMEOUT: ${HELPDESK_APPROVAL_TIMEOUT:-5m}
    volumes:
      - incidents:/data/incidents
      - ${HELPDESK_USERS_FILE_HOST:-./users.example.yaml}:/etc/helpdesk/users.yaml:ro
      - ${KUBECONFIG:-~/.kube/config}:/root/.kube/config:ro
      - ${HELPDESK_POLICY_FILE_HOST:-./policies.example.yaml}:/etc/helpdesk/policies.yaml:ro
    ports:
      - "1104:1104"
    restart: unless-stopped
    depends_on:
      auditd:
        condition: service_healthy

  # Research agent for Gemini models - provides web search via GoogleSearch.
  # GoogleSearch cannot be combined with function declarations, so this agent
  # handles web searches separately. Harmless to run with Anthropic models.
  research-agent:
    build:
      context: ../../..
      dockerfile: helpdesk/Dockerfile
    image: helpdesk:latest
    command: ["/usr/local/bin/research-agent"]
    environment:
      HELPDESK_AGENT_ADDR: "0.0.0.0:1106"
      HELPDESK_AGENT_URL: "http://research-agent:1106"
      HELPDESK_MODEL_VENDOR: ${HELPDESK_MODEL_VENDOR}
      HELPDESK_MODEL_NAME: ${HELPDESK_MODEL_NAME}
      HELPDESK_API_KEY: ${HELPDESK_API_KEY:-${ANTHROPIC_API_KEY:-}}
      # AI Governance
      HELPDESK_OPERATING_MODE: ${HELPDESK_OPERATING_MODE:-}
      HELPDESK_AUDIT_ENABLED: "true"
      HELPDESK_AUDIT_URL: http://auditd:1199
      HELPDESK_AUDIT_API_KEY: ${RESEARCH_AGENT_API_KEY:-}
      HELPDESK_IDENTITY_PROVIDER: ${HELPDESK_IDENTITY_PROVIDER:-static}
      HELPDESK_USERS_FILE: /etc/helpdesk/users.yaml
      HELPDESK_POLICY_ENABLED: ${HELPDESK_POLICY_ENABLED:-false}
      HELPDESK_POLICY_FILE: /etc/helpdesk/policies.yaml
      HELPDESK_APPROVAL_ENABLED: ${HELPDESK_APPROVAL_ENABLED:-false}
      HELPDESK_APPROVAL_TIMEOUT: ${HELPDESK_APPROVAL_TIMEOUT:-5m}
    volumes:
      - ${HELPDESK_USERS_FILE_HOST:-./users.example.yaml}:/etc/helpdesk/users.yaml:ro
      - ${HELPDESK_POLICY_FILE_HOST:-./policies.example.yaml}:/etc/helpdesk/policies.yaml:ro
    ports:
      - "1106:1106"
    restart: unless-stopped
    depends_on:
      auditd:
        condition: service_healthy

  gateway:
    build:
      context: ../../..
      dockerfile: helpdesk/Dockerfile
    image: helpdesk:latest
    command: ["/usr/local/bin/gateway"]
    environment:
      HELPDESK_GATEWAY_ADDR: "0.0.0.0:8080"
      HELPDESK_AGENT_URLS: "http://database-agent:1100,http://k8s-agent:1102,http://sysadmin-agent:1103,http://incident-agent:1104,http://research-agent:1106"
      HELPDESK_MODEL_VENDOR: ${HELPDESK_MODEL_VENDOR}
      HELPDESK_MODEL_NAME: ${HELPDESK_MODEL_NAME}
      HELPDESK_API_KEY: ${HELPDESK_API_KEY:-${ANTHROPIC_API_KEY:-}}
      HELPDESK_INFRA_CONFIG: /etc/helpdesk/infrastructure.json
      # AI Governance - enables /api/v1/governance endpoints
      HELPDESK_AUDIT_ENABLED: "true"
      HELPDESK_AUDIT_URL: http://auditd:1199
      HELPDESK_AUDIT_API_KEY: ${GATEWAY_API_KEY:-}
      # Bearer token sent to agent /tool/{name} endpoints.
      # Default matches the hash in users.example.yaml — CHANGE THIS IN PRODUCTION.
      HELPDESK_AGENT_API_KEY: ${HELPDESK_AGENT_API_KEY:-gateway-api-key}
      # API key for operator CLIs exec'd inside this container (govexplain, srebot).
      HELPDESK_CLIENT_API_KEY: ${HELPDESK_CLIENT_API_KEY:-}
      # Identity & access. static (not none): matches every agent in this file,
      # which already defaults to static — gateway/auditd were the only two
      # services left on the permissive "none" default, silently breaking
      # role-based checks (e.g. approval_override_roles) for any human
      # operator, found live during the debugging of faulttest's approval-mode
      # clamp. The demo-* services below already run static successfully.
      HELPDESK_IDENTITY_PROVIDER: ${HELPDESK_IDENTITY_PROVIDER:-static}
      HELPDESK_USERS_FILE: /etc/helpdesk/users.yaml
      HELPDESK_JWT_JWKS_URL: ${HELPDESK_JWT_JWKS_URL:-}
      HELPDESK_JWT_ISSUER: ${HELPDESK_JWT_ISSUER:-}
      HELPDESK_JWT_AUDIENCE: ${HELPDESK_JWT_AUDIENCE:-}
      HELPDESK_JWT_ROLES_CLAIM: ${HELPDESK_JWT_ROLES_CLAIM:-}
      HELPDESK_JWT_CACHE_TTL: ${HELPDESK_JWT_CACHE_TTL:-}
      # Crystal-ball mode: bypass playbook guidance, hypothesis formatting, and
      # escalation chaining. For LLM benchmarks / demos only. NOT for production.
      HELPDESK_CRYSTAL_BALL: ${HELPDESK_CRYSTAL_BALL:-}
      # Decision Hub — public base URL used to build absolute resolve_url links in
      # API responses and webhook notifications. Set to the externally reachable
      # gateway URL (e.g. https://helpdesk.example.com). Leave empty to use
      # relative paths (fine for CLI use; breaks Slack/webhook notification links).
      HELPDESK_BASE_URL: ${HELPDESK_BASE_URL:-}
      # Decision notifications — fires when any gate, step-approval, or fleet-approval
      # opens or resolves. Slack incoming webhook URLs are auto-detected and formatted.
      # Leave empty to disable. WEBHOOK_SECRET adds X-Helpdesk-Signature: sha256=<hex>.
      HELPDESK_DECISION_WEBHOOK: ${HELPDESK_DECISION_WEBHOOK:-}
      HELPDESK_DECISION_WEBHOOK_SECRET: ${HELPDESK_DECISION_WEBHOOK_SECRET:-}
      # SMTP email notifications for decisions (optional — all fields required when set).
      HELPDESK_SMTP_HOST: ${HELPDESK_SMTP_HOST:-}
      HELPDESK_SMTP_PORT: ${HELPDESK_SMTP_PORT:-587}
      HELPDESK_SMTP_USER: ${HELPDESK_SMTP_USER:-}
      HELPDESK_SMTP_PASSWORD: ${HELPDESK_SMTP_PASSWORD:-}
      # Git webhook adapter — approve a gate or fleet job by merging a branch named
      # approved/gate/<runID> or approved/fleet/<approvalID>. Register
      # POST /api/v1/webhooks/git in your git provider and set the secret below.
      HELPDESK_GIT_WEBHOOK_SECRET: ${HELPDESK_GIT_WEBHOOK_SECRET:-}
      # Branch prefix that triggers resolution (default: "approved/").
      HELPDESK_GIT_RESOLVE_BRANCH: ${HELPDESK_GIT_RESOLVE_BRANCH:-}
    volumes:
      - ${HELPDESK_USERS_FILE_HOST:-./users.example.yaml}:/etc/helpdesk/users.yaml:ro
      - ${HELPDESK_INFRA_CONFIG:-./infrastructure.json}:/etc/helpdesk/infrastructure.json:ro
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      auditd:
        condition: service_healthy
      database-agent:
        condition: service_started
      k8s-agent:
        condition: service_started
      sysadmin-agent:
        condition: service_started
      incident-agent:
        condition: service_started
      research-agent:
        condition: service_started

  orchestrator:
    build:
      context: ../../..
      dockerfile: helpdesk/Dockerfile
    image: helpdesk:latest
    command: ["/usr/local/bin/helpdesk"]
    environment:
      HELPDESK_AGENT_URLS: "http://database-agent:1100,http://k8s-agent:1102,http://sysadmin-agent:1103,http://incident-agent:1104,http://research-agent:1106"
      HELPDESK_MODEL_VENDOR: ${HELPDESK_MODEL_VENDOR}
      HELPDESK_MODEL_NAME: ${HELPDESK_MODEL_NAME}
      HELPDESK_API_KEY: ${HELPDESK_API_KEY:-${ANTHROPIC_API_KEY:-}}
      HELPDESK_INFRA_CONFIG: /etc/helpdesk/infrastructure.json
      # Streaming mode: "sse" (streaming) or "none" (disabled, default)
      # Set to "none" to work around ADK REPL bug in containers
      HELPDESK_STREAMING_MODE: ${HELPDESK_STREAMING_MODE:-none}
      # Session-level purpose: injects an explicit purpose into every delegation.
      # Equivalent to X-Purpose: <value> on API requests. Required when policies
      # use allowed_purposes conditions (e.g., pii-data-protection). Set in .env.
      HELPDESK_SESSION_PURPOSE: ${HELPDESK_SESSION_PURPOSE:-}
      # AI Governance
      HELPDESK_OPERATING_MODE: ${HELPDESK_OPERATING_MODE:-}
      HELPDESK_AUDIT_ENABLED: "true"
      HELPDESK_AUDIT_URL: http://auditd:1199
      HELPDESK_AUDIT_API_KEY: ${ORCHESTRATOR_API_KEY:-}
    volumes:
      - ${HELPDESK_INFRA_CONFIG:-./infrastructure.json}:/etc/helpdesk/infrastructure.json:ro
    stdin_open: true
    tty: true
    profiles:
      - interactive
    depends_on:
      - database-agent
      - k8s-agent
      - sysadmin-agent
      - incident-agent
      - research-agent

  # Authenticated gateway CLI — for operators and scripts.
  # Run with: docker compose run --rm helpdesk-client
  # One-shot:  docker compose run --rm helpdesk-client --agent database --message "is prod-db healthy?"
  helpdesk-client:
    image: helpdesk:latest
    entrypoint: ["/usr/local/bin/helpdesk-client"]
    working_dir: /jobs
    environment:
      HELPDESK_AUDIT_URL: http://auditd:1199
      HELPDESK_GATEWAY_URL: http://gateway:8080
      HELPDESK_CLIENT_USER: ${HELPDESK_CLIENT_USER:-}
      HELPDESK_CLIENT_API_KEY: ${HELPDESK_CLIENT_API_KEY:-}
      HELPDESK_SESSION_PURPOSE: ${HELPDESK_SESSION_PURPOSE:-}
      HELPDESK_SESSION_PURPOSE_NOTE: ${HELPDESK_SESSION_PURPOSE_NOTE:-}
      HELPDESK_CLIENT_AGENT: ${HELPDESK_CLIENT_AGENT:-database}
    volumes:
      - ${FLEET_JOBS_DIR:-./jobs}:/jobs
    stdin_open: true
    tty: true
    profiles:
      - interactive
    depends_on:
      - gateway

  # Fleet runner: applies a single change across infrastructure targets with staged rollout.
  # Usage: docker compose --profile fleet run --rm fleet-runner --job-file health-check.json
  # Dry-run: docker compose --profile fleet run --rm fleet-runner --job-file health-check.json --dry-run
  # Job files are read from ./jobs/ (or $FLEET_JOBS_DIR) on the host, which is also
  # where --plan-fleet-job writes them from the helpdesk-client container.
  fleet-runner:
    image: helpdesk:latest
    entrypoint: ["/usr/local/bin/fleet-runner"]
    working_dir: /jobs
    environment:
      HELPDESK_GATEWAY_URL: http://gateway:8080
      HELPDESK_AUDIT_URL: http://auditd:1199
      HELPDESK_CLIENT_API_KEY: ${FLEET_RUNNER_API_KEY:-}
      HELPDESK_AUDIT_API_KEY: ${FLEET_RUNNER_API_KEY:-}
      HELPDESK_INFRA_CONFIG: /etc/helpdesk/infrastructure.json
      HELPDESK_SESSION_PURPOSE: fleet_rollout
    volumes:
      - ${HELPDESK_INFRA_CONFIG:-./infrastructure.json}:/etc/helpdesk/infrastructure.json:ro
      - ${FLEET_JOBS_DIR:-./jobs}:/jobs
    profiles:
      - fleet
    depends_on:
      - gateway
      - auditd

  # AI Governance: Real-time audit monitoring and alerting
  # Enable with: docker compose --profile governance up -d
  auditor:
    build:
      context: ../../..
      dockerfile: helpdesk/Dockerfile
    image: helpdesk:latest
    command:
      - /usr/local/bin/auditor
      - -socket=/data/audit/audit.sock
      - -webhook=${HELPDESK_ALERT_WEBHOOK:-}
    environment:
      HELPDESK_LOG_LEVEL: ${HELPDESK_LOG_LEVEL:-info}
      HELPDESK_AUDITOR_LOG_ALL: ${HELPDESK_AUDITOR_LOG_ALL:-false}
      # Email alerting (optional)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      HELPDESK_EMAIL_FROM: ${HELPDESK_EMAIL_FROM:-}
      HELPDESK_EMAIL_TO: ${HELPDESK_EMAIL_TO:-}
    volumes:
      - audit-data:/data/audit:ro
    profiles:
      - governance
    restart: unless-stopped
    depends_on:
      auditd:
        condition: service_healthy

  # AI Governance: Compliance reporter (one-shot, run with: docker compose run govbot)
  # Enable with: docker compose --profile governance run govbot
  govbot:
    build:
      context: ../../..
      dockerfile: helpdesk/Dockerfile
    image: helpdesk:latest
    command:
      - /usr/local/bin/govbot
      - -gateway=http://gateway:8080
      - -since=${GOVBOT_SINCE:-24h}
      - -webhook=${GOVBOT_WEBHOOK:-}
    environment:
      # Compliance history: govbot POSTs run snapshots to auditd so no PVC is needed.
      HELPDESK_AUDIT_URL: http://auditd:1199
      HELPDESK_AUDIT_API_KEY: ${GOVBOT_API_KEY:-}
      HELPDESK_CLIENT_API_KEY: ${GOVBOT_API_KEY:-}
    profiles:
      - governance
    depends_on:
      auditd:
        condition: service_healthy
      gateway:
        condition: service_healthy

  # AI Governance: Security responder bot
  # Enable with: docker compose --profile governance up -d
  secbot:
    build:
      context: ../../..
      dockerfile: helpdesk/Dockerfile
    image: helpdesk:latest
    command:
      - /usr/local/bin/secbot
      - -socket=/data/audit/audit.sock
      - -gateway=http://gateway:8080
    environment:
      HELPDESK_CLIENT_API_KEY: ${SECBOT_API_KEY:-}
    volumes:
      - audit-data:/data/audit:ro
    ports:
      - "9091:9091"
    profiles:
      - governance
    restart: unless-stopped
    depends_on:
      auditd:
        condition: service_healthy
      gateway:
        condition: service_healthy

  # Development / demo PostgreSQL instance.
  # Start with: docker compose --profile dev up -d
  # Can be combined: docker compose --profile dev --profile governance up -d
  # Not started by default — existing production deployments are unaffected.
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    profiles:
      - dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Demo profile ────────────────────────────────────────────────────────────
  # Self-contained demo: starts a local Postgres, runs aiHelpDesk, injects a
  # fault, and walks through the full governed incident response flow.
  #
  # Usage:
  #   export ANTHROPIC_API_KEY=sk-ant-...    # or GOOGLE_API_KEY / GEMINI_API_KEY
  #   docker compose --profile demo up -d
  #   docker compose --profile demo run --rm demo-runner
  #
  # Choose a fault:
  #   DEMO_FAULT=db-max-connections          (default) connection pool exhaustion
  #   DEMO_FAULT=db-long-running-query       slow query blocking
  #   DEMO_FAULT=db-tx-lock-chain-blocker    transaction lock chain
  #
  # Choose approval mode:
  #   DEMO_MODE=interactive  (default) pause at the gate and wait for ENTER
  #   DEMO_MODE=auto         auto-approve after a countdown (DEMO_AUTO_APPROVE_SECS=8)

  demo-postgres:
    image: postgres:16
    container_name: helpdesk-demo-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: demopassword
      POSTGRES_DB: postgres
    command:
      - postgres
      - -c
      - max_connections=20
      - -c
      # Reserve slots so the agent can always connect even under saturation.
      - superuser_reserved_connections=3
      - -c
      - shared_buffers=32MB
      - -c
      - log_statement=all
    ports:
      - "5434:5432"
    profiles:
      - demo
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # demo-auditd: isolated audit store for the demo (doesn't share with production).
  demo-auditd:
    image: ghcr.io/borisdali/helpdesk:latest
    container_name: helpdesk-demo-auditd
    entrypoint: ["/bin/sh", "-c", "sleep 3 && exec /usr/local/bin/auditd"]
    environment:
      HELPDESK_AUDIT_ADDR: "0.0.0.0:1299"
      HELPDESK_AUDIT_DB: /data/audit/demo-audit.db
      HELPDESK_AUDIT_SOCKET: /data/audit/demo-audit.sock
      HELPDESK_AUDIT_URL: http://localhost:1299
      HELPDESK_APPROVAL_KEY: demo-api-key
      HELPDESK_POLICY_ENABLED: "true"
      HELPDESK_POLICY_FILE: /etc/helpdesk/policies.yaml
      HELPDESK_INFRA_CONFIG: /etc/helpdesk/infrastructure.json
      HELPDESK_IDENTITY_PROVIDER: static
      HELPDESK_USERS_FILE: /etc/helpdesk/users.yaml
    volumes:
      - demo-audit-data:/data/audit
      - ./demo/users.yaml:/etc/helpdesk/users.yaml:ro
      - ./demo/policies.yaml:/etc/helpdesk/policies.yaml:ro
      - ./demo/infrastructure.json:/etc/helpdesk/infrastructure.json:ro
    profiles:
      - demo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:1299/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  # demo-db-agent: database agent wired to demo-postgres only.
  demo-db-agent:
    image: ghcr.io/borisdali/helpdesk:latest
    container_name: helpdesk-demo-db-agent
    command: ["/usr/local/bin/database-agent"]
    environment:
      HELPDESK_AGENT_ADDR: "0.0.0.0:1200"
      HELPDESK_AGENT_URL: "http://demo-db-agent:1200"
      HELPDESK_INFRA_CONFIG: /etc/helpdesk/infrastructure.json
      # API key: use whichever is set — Anthropic, Google/Gemini, or generic.
      # Set HELPDESK_MODEL_VENDOR + HELPDESK_MODEL_NAME explicitly to override.
      # Auto-detection: ANTHROPIC_API_KEY → anthropic/haiku; GOOGLE_API_KEY or
      # GEMINI_API_KEY → google/gemini-2.5-flash. Detected by detect-model.sh.
      HELPDESK_MODEL_VENDOR: ${HELPDESK_MODEL_VENDOR:-anthropic}
      HELPDESK_MODEL_NAME: ${HELPDESK_MODEL_NAME:-claude-haiku-4-5-20251001}
      HELPDESK_API_KEY: ${HELPDESK_API_KEY:-${ANTHROPIC_API_KEY:-${GOOGLE_API_KEY:-${GEMINI_API_KEY:-}}}}
      HELPDESK_AUDIT_ENABLED: "true"
      HELPDESK_AUDIT_URL: http://demo-auditd:1299
      HELPDESK_AUDIT_API_KEY: demo-api-key
      HELPDESK_IDENTITY_PROVIDER: static
      HELPDESK_USERS_FILE: /etc/helpdesk/users.yaml
      HELPDESK_POLICY_ENABLED: "true"
      HELPDESK_POLICY_FILE: /etc/helpdesk/policies.yaml
      HELPDESK_APPROVAL_ENABLED: "true"
      HELPDESK_APPROVAL_TIMEOUT: 10m
    volumes:
      - ./demo/users.yaml:/etc/helpdesk/users.yaml:ro
      - ./demo/policies.yaml:/etc/helpdesk/policies.yaml:ro
      - ./demo/infrastructure.json:/etc/helpdesk/infrastructure.json:ro
    profiles:
      - demo
    restart: unless-stopped
    depends_on:
      demo-auditd:
        condition: service_healthy
      demo-postgres:
        condition: service_healthy

  # demo-gateway: gateway wired to demo-db-agent only.
  demo-gateway:
    image: ghcr.io/borisdali/helpdesk:latest
    container_name: helpdesk-demo-gateway
    command: ["/usr/local/bin/gateway"]
    environment:
      HELPDESK_GATEWAY_ADDR: "0.0.0.0:8180"
      HELPDESK_AGENT_URLS: "http://demo-db-agent:1200"
      HELPDESK_MODEL_VENDOR: ${HELPDESK_MODEL_VENDOR:-anthropic}
      HELPDESK_MODEL_NAME: ${HELPDESK_MODEL_NAME:-claude-haiku-4-5-20251001}
      HELPDESK_API_KEY: ${HELPDESK_API_KEY:-${ANTHROPIC_API_KEY:-${GOOGLE_API_KEY:-${GEMINI_API_KEY:-}}}}
      HELPDESK_INFRA_CONFIG: /etc/helpdesk/infrastructure.json
      HELPDESK_AUDIT_ENABLED: "true"
      HELPDESK_AUDIT_URL: http://demo-auditd:1299
      HELPDESK_AUDIT_API_KEY: demo-api-key
      HELPDESK_AGENT_API_KEY: demo-api-key
      HELPDESK_CLIENT_API_KEY: demo-api-key
      HELPDESK_IDENTITY_PROVIDER: none
    volumes:
      - ./demo/infrastructure.json:/etc/helpdesk/infrastructure.json:ro
    ports:
      - "8180:8180"
    profiles:
      - demo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8180/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      demo-auditd:
        condition: service_healthy
      demo-db-agent:
        condition: service_started

  # demo-runner: injects the fault and drives the approval flow.
  # Run with: docker compose --profile demo run --rm demo-runner
  demo-runner:
    image: ghcr.io/borisdali/helpdesk:latest
    container_name: helpdesk-demo-runner
    entrypoint: ["/bin/bash", "/demo/run.sh"]
    environment:
      HELPDESK_GATEWAY_URL: http://demo-gateway:8180
      HELPDESK_CLIENT_API_KEY: demo-api-key
      DEMO_CONN: "host=demo-postgres port=5432 dbname=postgres user=postgres password=demopassword sslmode=disable"
      DEMO_FAULT: ${DEMO_FAULT:-db-max-connections}
      DEMO_MODE: ${DEMO_MODE:-interactive}
      DEMO_AUTO_APPROVE_SECS: ${DEMO_AUTO_APPROVE_SECS:-8}
      DEMO_OPERATOR: ${DEMO_OPERATOR:-demo@aihelpdesk.biz}
    volumes:
      - ./demo/run.sh:/demo/run.sh:ro
    stdin_open: true
    tty: true
    profiles:
      - demo
    depends_on:
      demo-gateway:
        condition: service_healthy

volumes:
  incidents:
  audit-data:
  postgres-data:
  demo-audit-data:
