coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
    # New/changed lines in a PR must be well-tested — the check
    # CONTRIBUTING.md's "coverage only goes up, PR-by-PR" rule actually
    # relies on. Judges only the lines a PR itself touches, not the
    # historical coverage of whatever file they happen to live in.
    patch:
      default:
        target: 80%
        threshold: 0%

ignore:
  # Binary entrypoints — glue code, not library logic. cmd/gateway and
  # cmd/auditd are deliberately NOT listed: they hold real logic (the recovery
  # gate, the incident and decision records, objective enforcement, the audit
  # HTTP handlers), so their patches are measured. Add a new cmd/ directory
  # here if it is only wiring.
  - "cmd/approvals/**"
  - "cmd/auditor/**"
  - "cmd/fleet-runner/**"
  - "cmd/govbot/**"
  - "cmd/govexplain/**"
  - "cmd/hashapikey/**"
  - "cmd/helpdesk-client/**"
  - "cmd/helpdesk/**"
  - "cmd/jwttest/**"
  - "cmd/secbot/**"
  - "cmd/srebot/**"
  # Agent startup/wiring code — same category as cmd/
  - "agents/database/main.go"
  - "agents/k8s/main.go"
  - "agents/sysadmin/main.go"
  - "agents/research/main.go"
  - "agents/incident/main.go"
  # agentutil/serve — server wiring extracted from agentutil during the v0.20.0 split;
  # Serve/ServeWithTracing/InitApprovalClient require a live process to exercise.
  - "agentutil/serve/**"
  # Pure HTTP client wrappers — require a live auditd server to test
  - "internal/audit/approval_client.go"
  - "internal/audit/remote_store.go"
  # Test infrastructure and helpers — not self-tested by design
  - "testing/**"
  # Embedded assets with no executable statements. (playbooks/ is NOT listed:
  # its YAML never appears in a Go profile, and seed.go and
  # availability_impact.go are real logic.)
  - "prompts/**"
