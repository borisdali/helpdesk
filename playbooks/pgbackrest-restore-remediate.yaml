series_id: pbs_pgbackrest_restore_remediate
name: "pgBackRest — Restore From Latest Backup"
version: "1.10"
playbook_type: remediation
entry_point: false
execution_mode: agent
agent_name: sysadmin_agent
approval_mode: manual
problem_class: availability
author: aiHelpDesk
description: |
  Restore a single PostgreSQL instance from its most recent pgBackRest
  backup after data-directory loss or corruption, then bring it back up.
  Restore-to-latest only — no point-in-time target, no replica rebuild.
  Runs only when pbs_db_data_loss_triage's own triage has already confirmed a
  healthy, non-stale backup exists on an intact repo and this is a single
  instance with no replica topology to consider; every other corruption
  scenario (no backup, broken repo, replica involved, ambiguous scope)
  stays with that playbook's human-escalation default.
symptoms:
  - "pbs_db_data_loss_triage triage confirmed a healthy, non-stale pgBackRest backup exists"
  - "pbs_db_data_loss_triage triage confirmed this is a single instance, not a primary with replicas"
  - "restore-to-latest-backup is the confirmed correct action"
guidance: |
  You are the remediation stage of a diagnostic chain. The prior playbook
  has already confirmed: data-directory loss or corruption on this
  instance, a healthy non-stale pgBackRest backup available to restore
  from, its archived WAL continuous to the end of the archive, and no
  replica topology to worry about. Your target for every tool
  call below is the connection_string stated at the top of this prompt.

  PRECONDITION CHECK — abort and escalate (do not call restore_from_backup)
  if any of these are true:
  - get_pgbackrest_status (Step 1 below) reports status_code != 0 (broken
    repo/stanza) — there is nothing safe to restore from.
  - get_pgbackrest_status reports no successful backup has ever completed.
  - get_pgbackrest_status reports wal_continuity.status other than
    continuous. broken means WAL between the backup and the end of the
    archive is missing (or the backup is off the newest timeline): the
    restore would stop at the gap, or PostgreSQL could not start at all
    (consistency_reachable=false), after PGDATA has already been
    overwritten. unverified means that can't be ruled out.
    restore_from_backup itself refuses in both cases. Quote
    wal_continuity.detail in FINDINGS for the human who decides next.
  - get_pgbackrest_status reports backup_stale=true — the most recent
    backup is older than expected. Even with wal_continuity continuous,
    restoring it means replaying everything since it was taken, and this
    playbook does not decide whether that is acceptable. Taking a fresh
    backup is not a fallback: the data directory is already confirmed corrupted/missing
    pg_control, so there is nothing valid left to back up from, online or
    offline. This is a human judgment call — do not emit TRANSITION_TO or
    ESCALATE_TO for this condition; a human must decide whether the stale
    backup is still worth restoring from given the alternative is no
    recovery at all.
  - Prior findings mention a replica or primary/replica topology — this
    playbook only handles a single, standalone instance.
  - You have real evidence that PostgreSQL is NOT down: the prior hops'
    findings never mention a startup failure, or something shows it serving.
    restore_from_backup itself refuses to run if postgres is still accepting
    connections (pg_isready), and that check is the authoritative one. Do not
    refuse on your own account because check_host reports a container as
    running: a Docker or Podman container can stay up after the PostgreSQL
    inside it has died, so Status=running with Restarting=false says nothing
    about PostgreSQL. The prior hops already established that it failed to
    start, from the log lines they quoted. Go on to Step 2 and let
    restore_from_backup decide; if it refuses, stop and escalate.

  Step 1 — Reconfirm backup health:
  Call get_pgbackrest_status with the connection_string (target). Do not
  trust the prior playbook's diagnosis alone — reconfirm status_code=0,
  backup_stale=false, wal_continuity.status=continuous, and a non-empty
  last_backup_label yourself before
  proceeding, the same discipline run_pgbackrest_backup's own remediation
  already applies to a stale-backup finding. If any precondition above
  fails, stop here and follow its own instruction instead of continuing to
  Step 2.

  Step 2 — Restore from the latest backup:
  Call restore_from_backup with the same connection_string (target). This
  restores the most recent backup's data (pgBackRest's own default recovery
  target — not an arbitrary point in time) and overwrites the current data
  directory. It independently refuses if the instance is still accepting
  connections — if it refuses, stop and escalate; do not retry or attempt
  to work around the refusal.
  It also keeps the WAL that was in pg_wal (commits that may never have
  reached the archive): its pg_wal_tail says where the original copies are
  saved (saved_to), how far recovery should replay past the archive end
  (replay_through_wal), and which segments it pushed to the archive. If its
  detail says a push FAILED, quote that detail in FINDINGS: the new timeline
  then depends on the saved copies until a human archives them.
  On Kubernetes (check_host runtime=kubectl, see Step 3) the restore scales
  the instance's StatefulSet to 0 first, so the pod is gone afterwards and
  its result says to call restart_container: that is what resumes it.

  Step 3 — Bring the instance back up:
  Call check_host with the connection_string (target) first and read its
  `runtime` field — do not assume from the prior playbook's own wording,
  confirm it yourself, the same discipline Step 1 already applies to backup
  health. runtime=docker or runtime=podman → call restart_container.
  runtime=systemd → call restart_service instead; restart_container does
  not apply to a systemd-managed instance and will fail outright.
  runtime=kubectl → call restart_container: for a Kubernetes target it scales
  the StatefulSet back up to the size restore_from_backup recorded, and the
  pod then starts against the restored data directory (no restart_service,
  no docker). If the instance's pod was not scaled down, there is nothing for
  it to resume: say so in FINDINGS instead of retrying.
  On Kubernetes, expect this first check_host to FAIL once restore_from_backup
  has run: it scaled the StatefulSet to 0, so there is no pod to inspect, and
  check_host reports that as an error. That is the expected state, not a
  failed restore and not a reason to stop. The target is Kubernetes-managed
  (the Known Infrastructure entry says "Kubernetes: ...", and the earlier hops
  reported runtime=kubectl), so go on to restart_container. Do not retry
  check_host until after restart_container. Either way, this
  restarts the instance against the now-repaired data directory.

  Step 4 — Confirm recovery:
  Call check_host again to verify the instance is up (Status=running and
  Restarting=false for docker/podman; ActiveState=active, SubState=running
  for systemd; for a Kubernetes pod the phase is Running and it is ready —
  a pod that has only just been resumed can take a minute or two to start
  and replay WAL, so call check_host once more before concluding it did not
  come up). Call get_host_logs and look for "database system is ready
  to accept connections" — the same verification pbs_replica_restart_action
  uses, since this agent has no psql-based tools to confirm a live
  connection directly. On Kubernetes get_host_logs reads `kubectl logs`. For a systemd target specifically, get_host_logs
  (journalctl) typically shows only the service's own lifecycle messages,
  not PostgreSQL's own output — if it doesn't show the "ready to accept
  connections" line, also call read_pg_log_file (do not pass log_path; this
  target's own configured default is already correct) before concluding the
  restart failed. Also check for any new PANIC/FATAL immediately after
  startup, which would mean the restore did not actually resolve the
  corruption.

  Step 4b — Verify where recovery actually ended:
  Call verify_restore_recovery with the same connection_string (target),
  once the instance is up. restore_from_backup recorded where recovery
  should end (the last archived WAL segment and the new timeline); this
  reads where PostgreSQL's recovery really ended and compares them.
  - status=verified: report its reached_wal, redo_done_lsn and
    new_timeline as the recovery point. When replayed_through_wal is set,
    recovery also replayed WAL from pg_wal past the archive: report that
    segment too — those commits were recovered although never archived.
  - status=mismatch: the restore did NOT reach the predicted point. Quote
    its detail in FINDINGS as an anomaly — data after reached_wal may be
    missing even though the instance is up. Do not retry the restore.
  - status=not_found: the recovery isn't in the log yet. If Step 4 just
    confirmed the instance is up, call it once more; if it is still
    not_found, report that the recovery point could not be confirmed.
  - status=unverified: report its detail; the recovery point is
    unconfirmed, not wrong.

  Step 5 — Report outcome:
  Emit FINDINGS with:
  - Whether the restore and restart both succeeded
  - The backup label/timestamp that was restored from (from Step 1's
    last_backup_label/last_backup_time), and the recovery point from Step
    4b: when verified, the reached_wal/redo_done_lsn/new_timeline it read
    from PostgreSQL's own log; otherwise Step 1's predicted
    wal_continuity.archive_end_wal, labelled as predicted, not confirmed.
  - What was lost, as exactly ONE of these two sentences, filled in (from
    Step 1's wal_continuity and Step 4b's result) and not combined or
    reworded:
    - Step 4b verified with replayed_through_wal set: "Commits after the
      archive end (<archive_end_wal>) were recovered from pg_wal through
      <replayed_through_wal>; only changes never written to pg_wal are
      lost."
    - otherwise: "Changes made after <archive_end_time> were never
      archived and are not restored."
  - Step 2's pg_wal_tail.saved_to: the original WAL is kept there and can
    be removed by a human once the recovery point is verified
  - Container state and log evidence after restart (quote the actual log
    line, do not paraphrase)
  - Any anomalies (restart_container failed, instance crashed again after
    restart, logs show a different error than before)

  Do NOT call any write or destructive tools beyond restore_from_backup and
  restart_container/restart_service. Do NOT retry restore_from_backup more than once — if
  it fails or refuses, report the failure and stop so a human can
  investigate. Do NOT emit TRANSITION_TO or ESCALATE_TO — this is a
  terminal action playbook. Your job ends with FINDINGS, including when a
  PRECONDITION CHECK fails above.

escalation:
  - "get_pgbackrest_status reports status_code != 0 or no successful backup ever completed"
  - "get_pgbackrest_status reports backup_stale=true — human judgment call on whether to restore from it anyway; no automated target"
  - "get_pgbackrest_status reports wal_continuity.status broken or unverified — the restore can't be confirmed to reach the end of the archive"
  - "restore_from_backup refuses on WAL continuity — do not retry; a human decides"
  - "restore_from_backup refuses because the instance is still accepting connections — the prior diagnosis may be wrong"
  - "restart_container/restart_service fails to bring the instance back up after a successful restore — deeper corruption than a single restore can fix"
  - "logs show a new PANIC/FATAL immediately after restart — escalate rather than retry"
  - "verify_restore_recovery reports mismatch — recovery did not reach the predicted point; a human checks what is missing"
  - "any sign of replica/primary topology — this playbook does not rebuild replicas"
target_hints: []
